<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Zonas y Matriz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --dark: #0f172a; --accent: #38bdf8; }
        body { background: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { width: 240px; min-height: 100vh; background: var(--dark); color: white; position: fixed; }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 15px 20px; display: block; transition: 0.3s; }
        .sidebar a:hover { background: #1e293b; color: var(--accent); }
        .main-content { margin-left: 240px; padding: 30px; }
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .sticky-col { position: sticky; left: 0; background: white; font-weight: bold; border-right: 2px solid #e2e8f0 !important; }
        th { font-size: 0.75rem; color: #64748b; text-transform: uppercase; text-align: center; }
        td { vertical-align: middle; text-align: center; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="text-center py-4 border-bottom border-secondary">
        <h6 class="mb-0 fw-bold">ADMINISTRACIÓN</h6>
    </div>
    <a href="#" onclick="render('servidores')"><i class="bi bi-hdd-network me-2"></i> Matriz Servidores</a>
    <a href="#" onclick="render('zonas')"><i class="bi bi-geo-alt me-2"></i> Gestión Zonas</a>
</div>

<div class="main-content">
    <div id="view" class="table-container">
        <div class="text-center py-5 text-muted">
            <i class="bi bi-cloud-check display-1"></i>
            <h4 class="mt-3">Bienvenido al Sistema</h4>
            <p>Selecciona un módulo para gestionar la información.</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalApp" tabindex="-1">
    <div class="modal-dialog modal-md">
        <div class="modal-content border-0">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="mTitle">Editar Registro</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="fID">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre</label>
                    <input type="text" id="fNom" class="form-control" placeholder="Ej: Zona Norte / Servidor HP">
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="fAct" checked>
                    <label class="form-check-label">Registro Activo</label>
                </div>
                <div id="extraZonas" class="d-none border-top pt-3">
                    <label class="form-label fw-bold small">Asignación de Servidores</label>
                    <div id="checkList" class="row g-2"></div>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button class="btn btn-primary w-100" id="btnSave">Guardar Información</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const config = { databaseURL: "https://abcservers-2927d-default-rtdb.firebaseio.com/" };
    const db = getDatabase(initializeApp(config));

    let store = { servidores: {}, zonas: {} };
    let currentPath = '';

    // Escucha de datos
    ['servidores', 'zonas'].forEach(path => {
        onValue(ref(db, path), (s) => {
            store[path] = s.val() || {};
            if (currentPath === path) render(path);
        });
    });

    window.render = (path) => {
        currentPath = path;
        const srvNames = Object.values(store.servidores).map(s => s.nombre).sort();
        const items = store[path];
        
        let html = `
            <div class="d-flex justify-content-between mb-4">
                <h4 class="text-dark fw-bold">${path === 'servidores' ? 'Servidores (Matriz)' : 'Catálogo de Zonas'}</h4>
                <button class="btn btn-dark btn-sm" onclick="showModal('${path}')"><i class="bi bi-plus-lg"></i> Agregar</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="sticky-col text-start">Nombre</th>
                            <th>Estado</th>
                            ${path === 'zonas' ? srvNames.map(n => `<th>${n}</th>`).join('') : ''}
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>`;

        Object.keys(items).forEach(id => {
            const row = items[id];
            html += `<tr>
                <td class="sticky-col text-start">${row.nombre}</td>
                <td><i class="bi ${row.activo ? 'bi-check-circle-fill text-success' : 'bi-x-circle-fill text-danger'}"></i></td>
                ${path === 'zonas' ? srvNames.map(n => `<td><i class="bi ${row[n] ? 'bi-record-circle-fill text-primary' : 'bi-circle text-muted'}"></i></td>`).join('') : ''}
                <td class="text-end">
                    <button class="btn btn-sm btn-light border" onclick="showModal('${path}', '${id}')"><i class="bi bi-pencil-square"></i></button>
                    <button class="btn btn-sm btn-light border text-danger" onclick="del('${path}', '${id}')"><i class="bi bi-trash"></i></button>
                </td>
            </tr>`;
        });

        html += `</tbody></table></div>`;
        document.getElementById("view").innerHTML = html;
    };

    window.showModal = (path, id = "") => {
        const item = id ? store[path][id] : { nombre: "", activo: true };
        document.getElementById("fID").value = id;
        document.getElementById("fNom").value = item.nombre;
        document.getElementById("fAct").checked = item.activo;
        
        const extra = document.getElementById("extraZonas");
        if (path === 'zonas') {
            extra.classList.remove('d-none');
            const srvs = Object.values(store.servidores).map(s => s.nombre).sort();
            document.getElementById("checkList").innerHTML = srvs.map(s => `
                <div class="col-6 small">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="chk_${s}" ${item[s] ? 'checked' : ''}>
                        <label class="form-check-label">${s}</label>
                    </div>
                </div>`).join('');
        } else {
            extra.classList.add('d-none');
        }
        new bootstrap.Modal(document.getElementById("modalApp")).show();
    };

    document.getElementById("btnSave").onclick = async () => {
        const id = document.getElementById("fID").value;
        const nombre = document.getElementById("fNom").value.trim();
        if(!nombre) return;

        const data = { nombre, activo: document.getElementById("fAct").checked };
        
        if (currentPath === 'zonas') {
            const srvs = Object.values(store.servidores).map(s => s.nombre);
            srvs.forEach(s => data[s] = document.getElementById(`chk_${s}`).checked);
        }

        try {
            id ? await update(ref(db, `${currentPath}/${id}`), data) : await push(ref(db, currentPath), data);
            bootstrap.Modal.getInstance(document.getElementById("modalApp")).hide();
        } catch (e) { console.error(e); }
    };

    window.del = async (path, id) => {
        const { isConfirmed } = await Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true });
        if (isConfirmed) await remove(ref(db, `${path}/${id}`));
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
