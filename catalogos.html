<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogos Administrativos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --dark: #0f172a; --accent: #38bdf8; }
        body { background: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        
        .sidebar { 
            width: 240px; 
            min-height: 100vh; 
            background: var(--dark); 
            color: white; 
            position: fixed; 
            z-index: 1000; 
            transition: all 0.3s;
            left: 0;
        }
        
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px 20px; display: block; transition: 0.3s; cursor: pointer; font-size: 0.9rem; }
        .sidebar a:hover { background: #1e293b; color: var(--accent); }
        .sidebar a.active { color: white; border-left: 4px solid var(--accent); background: #1e293b; }
        
        .main-content { 
            margin-left: 240px; 
            padding: 20px; 
            transition: all 0.3s;
        }

        @media (max-width: 768px) {
            .sidebar { left: -240px; }
            .sidebar.active { left: 0; }
            .main-content { margin-left: 0; }
            .main-content.shifted { margin-left: 0; filter: blur(2px); pointer-events: none; }
        }

        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 300px; }
        .sticky-col { position: sticky; left: 0; background: white; font-weight: bold; border-right: 2px solid #e2e8f0 !important; }
        th { font-size: 0.7rem; color: #64748b; text-transform: uppercase; text-align: center; background: #f8fafc !important; }
        td { vertical-align: middle; text-align: center; font-size: 0.85rem; }
        .empty-state { padding: 60px; text-align: center; color: #94a3b8; }
        input[type="text"], select, textarea { text-transform: uppercase; }

        .btn-toggle {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        @media (max-width: 768px) { .btn-toggle { display: block; } }
    </style>
</head>
<body>

<button class="btn btn-dark btn-toggle" onclick="toggleSidebar()">
    <i class="bi bi-list fs-4"></i>
</button>

<div class="sidebar" id="sidebar">
    <div class="text-center py-4 border-bottom border-secondary mb-2">
        <h6 class="mb-0 fw-bold text-white">CATÁLOGOS</h6>
    </div>
    <a onclick="render('servidores')" id="link-servidores"><i class="bi bi-hdd-network me-2"></i> Matriz Tecnología</a>
    <a onclick="render('zonas')" id="link-zonas"><i class="bi bi-geo-alt me-2"></i> Zonas</a>
    <a onclick="render('empresas')" id="link-empresas"><i class="bi bi-building me-2"></i> Empresas</a>
    <a onclick="render('sucursales')" id="link-sucursales"><i class="bi bi-shop me-2"></i> Sucursales</a>
    <a onclick="render('usuarios')" id="link-usuarios"><i class="bi bi-person-lines-fill me-2"></i> Usuarios</a>
</div>

<div class="main-content" id="main-content">
    <div id="view" class="table-container">
        <div class="text-center py-5 text-muted">
            <i class="bi bi-cloud-check display-1"></i>
            <h4 class="mt-3">Bienvenido al Sistema</h4>
            <p>Selecciona un módulo en el menú lateral.</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalApp" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="mTitle">Registro</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="fID">
                
                <div id="secEmpresa" class="d-none mb-3">
                    <label class="form-label fw-bold small">Empresa Responsable</label>
                    <select id="fEmp" class="form-select"></select>
                </div>
                <div id="secZona" class="d-none mb-3">
                    <label class="form-label fw-bold small">Zona</label>
                    <select id="fZona" class="form-select"></select>
                </div>

                <hr id="hrSucursal" class="d-none">

                <div id="secIndividual">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Nombre / Descripción</label>
                        <input type="text" id="fNom" class="form-control" placeholder="NOMBRE DEL REGISTRO">
                    </div>
                </div>

                <div id="secMasivo" class="d-none mt-3">
                    <div class="alert alert-info py-2 small">
                        <i class="bi bi-info-circle me-1"></i> Pegue una lista de nombres (uno por línea).
                    </div>
                    <label class="form-label fw-bold small">Lista de Sucursales</label>
                    <textarea id="fMasivo" class="form-control" rows="5" placeholder="SUCURSAL 1&#10;SUCURSAL 2&#10;SUCURSAL 3"></textarea>
                </div>

                <div id="secToggleMasivo" class="form-check form-switch d-none mb-3">
                    <input class="form-check-input" type="checkbox" id="checkMasivo">
                    <label class="form-check-label small fw-bold" for="checkMasivo">Activar Carga Masiva</label>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button class="btn btn-primary w-100" id="btnSave">Guardar Información</button>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('main-content').classList.toggle('shifted');
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const config = { databaseURL: "https://abcservers-2927d-default-rtdb.firebaseio.com/" };
    const db = getDatabase(initializeApp(config));

    let store = { servidores: {}, zonas: {}, empresas: {}, sucursales: {}, usuarios: {} };
    let currentPath = '';

    Object.keys(store).forEach(path => {
        onValue(ref(db, path), (s) => {
            store[path] = s.val() || {};
            if (currentPath === path) render(path);
        });
    });

    const updateZonasDropdown = (selectedEmpresa, selectedZona = "") => {
        const fZona = document.getElementById("fZona");
        const zonasFiltradas = Object.values(store.zonas)
            .filter(z => z.empresa === selectedEmpresa)
            .map(z => z.nombre)
            .sort();

        if (zonasFiltradas.length > 0) {
            fZona.innerHTML = zonasFiltradas.map(z => 
                `<option value="${z}" ${selectedZona === z ? 'selected' : ''}>${z}</option>`
            ).join('');
        } else {
            fZona.innerHTML = '<option value="">SIN ZONAS PARA ESTA EMPRESA</option>';
        }
    };

    document.getElementById("fEmp").onchange = (e) => {
        if (currentPath === 'sucursales') updateZonasDropdown(e.target.value);
    };

    // Toggle para mostrar/ocultar carga masiva
    document.getElementById("checkMasivo").onchange = (e) => {
        const isMasivo = e.target.checked;
        document.getElementById("secIndividual").classList.toggle('d-none', isMasivo);
        document.getElementById("secMasivo").classList.toggle('d-none', !isMasivo);
    };

    window.render = (path) => {
        currentPath = path;
        if(window.innerWidth < 768 && document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
        
        document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
        document.getElementById(`link-${path}`)?.classList.add('active');

        const items = store[path];
        const itemKeys = Object.keys(items);

        let html = `<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                        <h4 class="text-dark fw-bold m-0">${path.toUpperCase()}</h4>
                        <button class="btn btn-dark px-3" onclick="showModal('${path}')"><i class="bi bi-plus-lg me-1"></i> Nuevo Registro</button>
                    </div>`;

        if (itemKeys.length === 0) {
            html += `<div class="empty-state"><i class="bi bi-folder-x display-4 text-light"></i><p class="mt-2 text-muted">Sin registros.</p></div>`;
        } else {
            html += `<div class="table-responsive"><table class="table table-hover align-middle border">
                        <thead><tr>
                            ${(path === 'zonas' || path === 'sucursales') ? '<th>Empresa</th>' : ''}
                            ${path === 'sucursales' ? '<th>Zona</th>' : ''}
                            <th class="sticky-col text-start">Nombre</th>
                            <th class="text-end px-4">Acciones</th>
                        </tr></thead><tbody>`;

            itemKeys.forEach(id => {
                const row = items[id];
                html += `<tr>
                    ${(path === 'zonas' || path === 'sucursales') ? `<td><span class="fw-bold text-primary">${row.empresa || 'N/A'}</span></td>` : ''}
                    ${path === 'sucursales' ? `<td>${row.zona || '-'}</td>` : ''}
                    <td class="sticky-col text-start">${row.nombre}</td>
                    <td class="text-end px-3">
                        <button class="btn btn-sm btn-outline-secondary border-0" onclick="showModal('${path}', '${id}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger border-0" onclick="del('${path}', '${id}')"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
        }
        document.getElementById("view").innerHTML = html;
    };

    window.showModal = (path, id = "") => {
        const item = id ? store[path][id] : { nombre: "", empresa: "", zona: "" };
        document.getElementById("fID").value = id;
        document.getElementById("fNom").value = item.nombre;
        document.getElementById("fMasivo").value = "";
        document.getElementById("checkMasivo").checked = false;
        
        const secEmpresa = document.getElementById("secEmpresa");
        const secZona = document.getElementById("secZona");
        const secToggle = document.getElementById("secToggleMasivo");
        const hr = document.getElementById("hrSucursal");

        secEmpresa.classList.add('d-none');
        secZona.classList.add('d-none');
        secToggle.classList.add('d-none');
        hr.classList.add('d-none');
        document.getElementById("secIndividual").classList.remove('d-none');
        document.getElementById("secMasivo").classList.add('d-none');

        const emps = Object.values(store.empresas).map(e => e.nombre).sort();
        const fEmp = document.getElementById("fEmp");

        if (path === 'zonas' || path === 'sucursales') {
            secEmpresa.classList.remove('d-none');
            fEmp.innerHTML = emps.map(e => `<option value="${e}" ${item.empresa === e ? 'selected' : ''}>${e}</option>`).join('') || '<option value="">CREE EMPRESAS PRIMERO</option>';
        }

        if (path === 'sucursales') {
            secZona.classList.remove('d-none');
            hr.classList.remove('d-none');
            if(!id) secToggle.classList.remove('d-none'); // Solo mostrar carga masiva en nuevos registros
            updateZonasDropdown(item.empresa || fEmp.value, item.zona);
        }

        new bootstrap.Modal(document.getElementById("modalApp")).show();
    };

    document.getElementById("btnSave").onclick = async () => {
        const id = document.getElementById("fID").value;
        const isMasivo = document.getElementById("checkMasivo").checked;
        const empresa = document.getElementById("fEmp").value;
        const zona = document.getElementById("fZona").value;

        // Validación común para Sucursales
        if (currentPath === 'sucursales') {
            if(!zona || zona.includes("SIN ZONAS")) return Swal.fire("Error", "Debe seleccionar una zona válida", "error");
        }

        try {
            if (isMasivo && currentPath === 'sucursales') {
                // LÓGICA CARGA MASIVA
                const lineas = document.getElementById("fMasivo").value.split('\n');
                const nombres = lineas.map(l => l.trim().toUpperCase()).filter(l => l !== "");
                
                if(nombres.length === 0) return Swal.fire("Error", "La lista está vacía", "error");

                Swal.fire({ title: 'Guardando lista...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

                for (const nombre of nombres) {
                    await push(ref(db, currentPath), { nombre, empresa, zona });
                }
            } else {
                // LÓGICA INDIVIDUAL
                const nombre = document.getElementById("fNom").value.trim().toUpperCase();
                if(!nombre) return Swal.fire("Error", "Nombre obligatorio", "error");

                const data = { nombre };
                if (currentPath === 'zonas' || currentPath === 'sucursales') data.empresa = empresa;
                if (currentPath === 'sucursales') data.zona = zona;

                id ? await update(ref(db, `${currentPath}/${id}`), data) : await push(ref(db, currentPath), data);
            }

            bootstrap.Modal.getInstance(document.getElementById("modalApp")).hide();
            Swal.fire({ title: "Listo", icon: "success", timer: 800, showConfirmButton: false });
        } catch (e) { Swal.fire("Error", e.message, "error"); }
    };

    window.del = async (path, id) => {
        const { isConfirmed } = await Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true });
        if (isConfirmed) await remove(ref(db, `${path}/${id}`));
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
