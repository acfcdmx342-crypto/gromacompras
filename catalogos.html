<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogos Administrativos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --dark: #0f172a; --accent: #38bdf8; --cctv-blue: #0070c0; --cctv-green: #38b050; }
        body { background: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        
        /* Bloqueo visual de selección de texto para mayor seguridad */
        body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }

        .sidebar { 
            width: 240px; min-height: 100vh; background: var(--dark); color: white; 
            position: fixed; z-index: 1000; transition: all 0.3s; left: 0;
        }
        .sidebar a { color: #94a3b8; text-decoration: none; padding: 12px 20px; display: block; transition: 0.3s; cursor: pointer; font-size: 0.9rem; }
        .sidebar a:hover { background: #1e293b; color: var(--accent); }
        .sidebar a.active { color: white; border-left: 4px solid var(--accent); background: #1e293b; }
        
        .main-content { margin-left: 240px; padding: 20px; transition: all 0.3s; }

        body.hide-menu .sidebar { display: none !important; }
        body.hide-menu .main-content { margin-left: 0 !important; }

        @media (max-width: 768px) {
            .sidebar { left: -240px; }
            .sidebar.active { left: 0; }
            .main-content { margin-left: 0; }
        }

        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); min-height: 300px; }
        
        /* --- EFECTO ROTATING CUBE --- */
        .cube-container { perspective: 1000px; width: 40px; height: 40px; cursor: pointer; display: inline-block; margin: 0 10px; }
        .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .cube-container:hover .cube { transform: rotateY(-90deg); }
        .face { position: absolute; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border-radius: 8px; color: white; backface-visibility: hidden; }
        .front { background: var(--dark); transform: rotateY(0deg) translateZ(20px); }
        .side { background: var(--accent); transform: rotateY(90deg) translateZ(20px); }
        
        /* Estilos Formato CCTV */
        .cctv-header { background: var(--cctv-blue); color: white; font-weight: bold; padding: 5px 15px; margin-bottom: 10px; border-radius: 4px; }
        .cctv-green-header { background: var(--cctv-green); color: white; font-weight: bold; padding: 5px 15px; margin-top: 15px; }
        .cctv-label { background: #e9ecef; font-weight: bold; font-size: 0.75rem; border: 1px solid #dee2e6; padding: 4px 8px; width: 120px; }
        .cctv-input { border: 1px solid #dee2e6; padding: 4px 8px; font-size: 0.8rem; width: 100%; background: white; }
        .item-box { border: 1px solid #dee2e6; padding: 10px; background: #fff; height: 100%; }
        .signature-line { border-top: 1px solid #000; margin-top: 40px; font-size: 0.7rem; text-align: center; }

        @media print {
            .no-print, .sidebar, .btn-toggle { display: none !important; }
            .main-content { margin-left: 0 !important; padding: 0 !important; }
            .table-container { box-shadow: none !important; border: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body>

<button class="btn btn-dark btn-toggle no-print" style="position:fixed; bottom:20px; right:20px; z-index:1001; border-radius:50%; width:50px; height:50px;" onclick="toggleSidebar()">
    <i class="bi bi-list fs-4"></i>
</button>

<div class="sidebar no-print" id="sidebar">
    <div class="text-center py-4 border-bottom border-secondary mb-2">
        <h6 class="mb-0 fw-bold text-white">CATÁLOGOS</h6>
    </div>
    <a onclick="render('matriz')" id="link-matriz"><i class="bi bi-hdd-network me-2"></i> Matriz Tecnología</a>
    <a onclick="render('matrizcctv')" id="link-matrizcctv"><i class="bi bi-camera-video me-2"></i> Matriz de CCTV</a>
    <a onclick="render('zonas')" id="link-zonas"><i class="bi bi-geo-alt me-2"></i> Zonas</a>
    <a onclick="render('empresas')" id="link-empresas"><i class="bi bi-building me-2"></i> Empresas</a>
    <a onclick="render('sucursales')" id="link-sucursales"><i class="bi bi-shop me-2"></i> Sucursales</a>
    <a onclick="render('usuarios')" id="link-usuarios"><i class="bi bi-person-lines-fill me-2"></i> Usuarios</a>
    <div class="text-center py-2 border-top border-secondary mt-2">
        <h6 class="mb-0 fw-bold text-white small">FORMATOS</h6>
    </div>
    <a onclick="render('formato_cctv')" id="link-formato_cctv"><i class="bi bi-file-earmark-text me-2"></i> Formato CCTV</a>
</div>

<div class="main-content" id="main-content">
    <div id="view" class="table-container">
        <div class="text-center py-5 text-muted">
            <i class="bi bi-cloud-check display-1"></i>
            <h4 class="mt-3">Bienvenido al Sistema</h4>
            <p>Selecciona un módulo en el menú lateral.</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalApp" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title" id="mTitle">Registro</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="fID">
                <div class="row" id="modalFields">
                    <div id="secEmpresa" class="col-md-6 mb-3 d-none">
                        <label class="form-label fw-bold small">Empresa</label>
                        <select id="fEmp" class="form-select"></select>
                    </div>
                    <div id="secZona" class="col-md-6 mb-3 d-none">
                        <label class="form-label fw-bold small">Zona</label>
                        <select id="fZona" class="form-select"></select>
                    </div>
                    <div id="secMatriz" class="d-none row g-3">
                        <div class="col-md-6"><label class="form-label fw-bold small">Artículos</label><input type="text" id="mArt" class="form-control"></div>
                        <div class="col-md-6"><label class="form-label fw-bold small">Modelo</label><input type="text" id="mMod" class="form-control"></div>
                        <div class="col-md-6"><label class="form-label fw-bold small">Descripción</label><input type="text" id="mDes" class="form-control"></div>
                        <div class="col-md-6"><label class="form-label fw-bold small">Marca</label><input type="text" id="mMar" class="form-control"></div>
                    </div>
                    <div id="secIndividual" class="col-12 mt-3">
                        <label class="form-label fw-bold small" id="lblNom">Nombre / Descripción</label>
                        <input type="text" id="fNom" class="form-control">
                    </div>
                    <div id="secMasivo" class="col-12 d-none mt-3">
                        <textarea id="fMasivo" class="form-control" rows="5" placeholder="Uno por línea o CSV para matriz"></textarea>
                    </div>
                    <div id="secToggleMasivo" class="col-12 form-check form-switch d-none mt-3 ms-3">
                        <input class="form-check-input" type="checkbox" id="checkMasivo">
                        <label class="form-check-label small fw-bold" for="checkMasivo">Activar Carga Masiva</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button class="btn btn-primary w-100" id="btnSave">Guardar Información</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    
    const config = { databaseURL: "https://mydbu-fbc33-default-rtdb.firebaseio.com/" };
    const db = getDatabase(initializeApp(config));
    let store = { matriz: {}, matrizcctv: {}, zonas: {}, empresas: {}, sucursales: {}, usuarios: {} };
    let currentPath = '';

    Object.keys(store).forEach(path => {
        onValue(ref(db, path), (s) => {
            store[path] = s.val() || {};
            if (currentPath === path) render(path);
        });
    });

    window.render = (path) => {
        currentPath = path;
        document.querySelectorAll('.sidebar a').forEach(el => el.classList.remove('active'));
        document.getElementById(`link-${path}`)?.classList.add('active');
        if (path === 'formato_cctv') { renderCCTV(); return; }

        const items = store[path];
        const keys = Object.keys(items);
        let html = `<div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="fw-bold m-0">${path.toUpperCase()}</h4>
                        <button class="btn btn-dark" onclick="showModal('${path}')"><i class="bi bi-plus-lg"></i> Nuevo</button>
                    </div>`;

        if (keys.length === 0) {
            html += `<div class="text-center py-5 text-muted">No hay registros</div>`;
        } else {
            html += `<div class="table-responsive"><table class="table table-hover border">
                <thead><tr>
                    ${['usuarios','sucursales','zonas'].includes(path) ? '<th>Empresa</th>' : ''}
                    ${path.includes('matriz') ? '<th>Artículos</th><th>Modelo</th><th>Marca</th>' : '<th class="text-start">Nombre</th>'}
                    <th class="text-end">Acciones</th>
                </tr></thead><tbody>`;

            keys.forEach(id => {
                const r = items[id];
                html += `<tr>
                    ${['usuarios','sucursales','zonas'].includes(path) ? `<td><small>${r.empresa || '-'}</small></td>` : ''}
                    ${path.includes('matriz') ? `<td>${r.articulos}</td><td>${r.modelo}</td><td>${r.marca}</td>` : `<td class="text-start">${r.nombre}</td>`}
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-secondary" onclick="showModal('${path}', '${id}')"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger" onclick="del('${path}', '${id}')"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table></div>`;
        }
        document.getElementById("view").innerHTML = html;
    };

    function renderCCTV() {
        const today = new Date().toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const empresas = Object.values(store.empresas).map(e => e.nombre).sort();
        const articulosCctv = Object.values(store.matrizcctv).map(m => m.articulos).filter((v, i, a) => a.indexOf(v) === i).sort();

        let html = `
            <div class="p-4" style="max-width: 1000px; margin: auto; background: white; border: 1px solid #ccc; position: relative;">
                <div class="no-print d-flex justify-content-end mb-3">
                    <div class="cube-container" onclick="window.render('matriz')" title="Ir a Tecnología">
                        <div class="cube">
                            <div class="face front"><i class="bi bi-hdd-network"></i></div>
                            <div class="face side"><i class="bi bi-arrow-left"></i></div>
                        </div>
                    </div>
                    <div class="cube-container" onclick="window.print()" title="Descargar PDF">
                        <div class="cube">
                            <div class="face front"><i class="bi bi-file-earmark-pdf"></i></div>
                            <div class="face side"><i class="bi bi-download"></i></div>
                        </div>
                    </div>
                </div>

                <div class="text-center mb-4"><h3 class="fw-bold" style="color: var(--cctv-blue)">REQUISICIÓN DE CCTV</h3></div>
                <div class="cctv-header">Datos del Solicitante</div>
                <div class="row g-0 mb-4 border">
                    <div class="col-md-7 border-end">
                        <div class="d-flex border-bottom"><div class="cctv-label">Nombre:</div><input type="text" class="cctv-input" value="SOPORTE TÉCNICO"></div>
                        <div class="d-flex"><div class="cctv-label">Empresa:</div>
                            <select class="cctv-input" onchange="window.updateCctvZonas(this.value)">
                                <option value="">SELECCIONE...</option>
                                ${empresas.map(e => `<option value="${e}">${e}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <div class="d-flex border-bottom"><div class="cctv-label">Fecha:</div><div class="cctv-input bg-light">${today}</div></div>
                        <div class="d-flex"><div class="cctv-label">Zona:</div><select class="cctv-input" id="cctv-zona-select"><option>ZONA</option></select></div>
                    </div>
                </div>

                <div class="cctv-header">Requerimiento de equipo</div>
                <div class="row g-2" id="items-container">
                    ${Array.from({length: 6}, (_, i) => generateItemHTML(i + 1, articulosCctv)).join('')}
                </div>
                
                <div class="row mt-5">
                    <div class="col-4"><div class="signature-line">SOLICITA</div></div>
                    <div class="col-4"><div class="signature-line">REVISA</div></div>
                    <div class="col-4"><div class="signature-line">AUTORIZA</div></div>
                </div>
            </div>`;
        document.getElementById("view").innerHTML = html;
    }

    function generateItemHTML(i, articulos) {
        return `
            <div class="col-md-4 item-row">
                <div class="item-box">
                    <div class="d-flex mb-2"><span class="small fw-bold me-2">Cant:</span><input type="number" class="form-control form-control-sm" style="width: 60px"></div>
                    <select class="form-select form-select-sm mb-1" onchange="window.fillProductData(this, ${i})">
                        <option value="">ARTÍCULO...</option>
                        ${articulos.map(art => `<option value="${art}">${art}</option>`).join('')}
                    </select>
                    <input type="text" id="mod-${i}" class="form-control form-control-sm mb-1" placeholder="MODELO" readonly>
                    <input type="text" id="mar-${i}" class="form-control form-control-sm" placeholder="MARCA" readonly>
                </div>
            </div>`;
    }

    window.fillProductData = (select, index) => {
        const product = Object.values(store.matrizcctv).find(m => m.articulos === select.value);
        document.getElementById(`mod-${index}`).value = product?.modelo || "";
        document.getElementById(`mar-${index}`).value = product?.marca || "";
    };

    window.toggleSidebar = () => {
        document.getElementById('sidebar').classList.toggle('active');
    };

    // --- BLOQUEO DE SEGURIDAD REFORZADO ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = e => {
        // Bloquear F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
        if (e.keyCode == 123 || 
           (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || 
           (e.ctrlKey && e.keyCode == 85)) {
            return false;
        }
    };
</script>

</body>
</html>
