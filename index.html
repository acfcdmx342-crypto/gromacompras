<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>

<!-- ICONOS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body { font-family: Arial, sans-serif; padding: 20px; }
.card { border: 1px solid #ccc; padding: 20px; max-width: 350px; }

.input-group {
    position: relative;
    width: 100%;
}
.input-group input {
    width: 100%;
    padding: 10px 40px 10px 10px;
    margin-bottom: 15px;
    box-sizing: border-box;
}
.input-group i {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    color: #555;
}

button { padding: 10px 15px; cursor: pointer; width: 100%; }
.btn-recover { background-color: #28a745; color: white; margin-top: 10px; }
</style>
</head>

<body>

<h2>Login</h2>

<div class="card">

    <div class="input-group">
        <input id="loginUser" placeholder="Usuario" oninput="this.value = this.value.toUpperCase()">
        <i class="fa-solid fa-user"></i>
    </div>

    <div class="input-group">
        <input id="loginPass" type="password" placeholder="Contraseña">
        <i class="fa-solid fa-eye toggle-pass" onclick="verPassword()"></i>
    </div>

    <button onclick="login()">Ingresar</button>
    <button class="btn-recover" onclick="recuperar()">¿Olvidaste tu contraseña?</button>

</div>

<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("0aHlArLgvHrj2Xbk8");
</script>

<script>
// VER / OCULTAR PASSWORD
function verPassword() {
    const passField = document.getElementById("loginPass");
    const icon = document.querySelector(".toggle-pass");

    if (passField.type === "password") {
        passField.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        passField.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
}
</script>

<!-- LOGIN FIREBASE -->
<script type="module">
import { database, ref, get, child } from "./firebase.js";

window.login = async function () {
    const usuario = document.getElementById("loginUser").value.toUpperCase();
    const pass = document.getElementById("loginPass").value;

    if (!usuario || !pass) {
        alert("Completa todos los campos");
        return;
    }

    try {
        const snapshot = await get(child(ref(database), `usuarios/${usuario}`));

        if (!snapshot.exists()) {
            alert("Usuario no existe");
            return;
        }

        const data = snapshot.val();

        if (data.pass !== pass) {
            alert("Contraseña incorrecta");
            return;
        }

        localStorage.setItem("usuarioActivo", JSON.stringify(data));
        window.location.href = "tecnologia.html";

    } catch (error) {
        console.error(error);
        alert("Error al conectar con Firebase");
    }
};

window.recuperar = async function () {
    const usuario = prompt("Ingresa tu usuario:");

    if (!usuario) return;

    const snapshot = await get(child(ref(database), `usuarios/${usuario.toUpperCase()}`));

    if (!snapshot.exists()) {
        alert("Usuario no encontrado");
        return;
    }

    const data = snapshot.val();

    emailjs.send("service_mya4ogg", "template_ub0ksu5", {
        to_email: data.email,
        usuario: data.usuario,
        password: data.pass
    }).then(() => {
        alert("Tu contraseña fue enviada al correo");
    });
};
</script>

</body>
</html>
