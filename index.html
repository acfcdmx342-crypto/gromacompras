<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body { font-family: Arial, sans-serif; padding: 20px; background:#f4f4f4; }
.card { border: 1px solid #ccc; padding: 20px; max-width: 350px; background:#fff; }
.input-group { position: relative; width: 100%; }
.input-group input {
  width: 100%;
  padding: 10px 40px 10px 10px;
  margin-bottom: 15px;
}
.input-group i {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
}
button { padding: 10px; width: 100%; cursor: pointer; }
.btn-recover { background:#28a745; color:white; margin-top:10px; }
</style>
</head>

<body>

<h2>Login</h2>

<div class="card">

<div class="input-group">
<input id="loginUser" placeholder="Usuario"
 oninput="this.value=this.value.toUpperCase().trim()">
<i class="fa-solid fa-user"></i>
</div>

<div class="input-group">
<input id="loginPass" type="password" placeholder="Contraseña">
<i class="fa-solid fa-eye toggle-pass" onclick="verPassword()"></i>
</div>

<button onclick="login()">Ingresar</button>
<button class="btn-recover" onclick="recuperar()">¿Olvidaste tu contraseña?</button>

</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("0aHlArLgvHrj2Xbk8");
</script>

<script>
function verPassword() {
  const p = loginPass;
  const i = document.querySelector(".toggle-pass");
  p.type = p.type === "password" ? "text" : "password";
  i.classList.toggle("fa-eye");
  i.classList.toggle("fa-eye-slash");
}
</script>

<script type="module">
import { database, ref, get } from "./firebase.js";

window.login = async () => {

  const usuario = loginUser.value.trim().toUpperCase();
  const pass = loginPass.value.trim();

  if (!usuario || !pass) {
    alert("Completa todos los campos");
    return;
  }

  const snap = await get(ref(database,"usuarios/"+usuario));

  if (!snap.exists()) {
    alert("❌ Usuario NO registrado");
    return;
  }

  const data = snap.val();

  if (data.bloqueado) {
    alert("⛔ Usuario bloqueado");
    return;
  }

  if (data.contrasena !== pass) {
    alert("❌ Contraseña incorrecta");
    return;
  }

  // ✅ SESIÓN COMPLETA
  localStorage.setItem("usuarioLogueado", JSON.stringify({
    usuario: data.usuario,
    nombre: data.nombre,
    puesto: data.puesto.toUpperCase(),
    empresa: data.empresa || "",
    zona: data.zona || ""
  }));

  window.location.href = "tecnologia.html";
};

window.recuperar = async () => {
  const u = prompt("Ingresa tu usuario:");
  if (!u) return;

  const snap = await get(ref(database,"usuarios/"+u.toUpperCase()));
  if (!snap.exists()) {
    alert("Usuario no encontrado");
    return;
  }

  const d = snap.val();
  await emailjs.send("service_mya4ogg","template_ub0ksu5",{
    to_email: d.correo,
    usuario: d.usuario,
    password: d.contrasena
  });

  alert("Contraseña enviada al correo");
};
</script>

</body>
</html>
