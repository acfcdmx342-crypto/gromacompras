<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  background:#eef1f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  padding:30px;
  border-radius:20px;
  width:350px;
}
</style>
</head>

<body>

<div class="card shadow">
<h3 class="text-center fw-bold mb-4">Iniciar Sesión</h3>

<input id="usuario" class="form-control mb-3" placeholder="Usuario">
<input id="password" type="password" class="form-control mb-3" placeholder="Contraseña">

<button onclick="login()" class="btn btn-primary w-100">
Ingresar
</button>
</div>

<script type="module">
import { database, ref, get } from "./firebase.js";

window.login = async () => {
  const usuario = document.getElementById("usuario").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!usuario || !password){
    alert("Complete los campos");
    return;
  }

  const snap = await get(ref(database,"usuarios"));
  let acceso = false;

  snap.forEach(c=>{
    const data = c.val();

    if(data.usuario === usuario && data.password === password){

      // ✅ SESIÓN COMPLETA (COMO ANTES)
      localStorage.setItem("usuarioLogueado", data.usuario);
      localStorage.setItem("nombreCompleto", data.nombre);
      localStorage.setItem("puesto", data.puesto.toUpperCase());
      localStorage.setItem("empresa", data.empresa || "");
      localStorage.setItem("zona", data.zona || "");

      acceso = true;
      window.location.href = "tecnologia.html";
    }
  });

  if(!acceso){
    alert("Usuario o contraseña incorrectos");
  }
};
</script>

</body>
</html>
