<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  box-sizing:border-box;
}

body {
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  min-height:100vh;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.container {
  width:100%;
  max-width:380px;
}

h2 {
  text-align:center;
  margin-bottom:20px;
}

.card {
  border: 1px solid #ccc;
  padding: 20px;
  background:#fff;
  border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.input-group {
  position: relative;
  width: 100%;
  margin-bottom:15px;
}

.input-group input {
  width: 100%;
  padding: 12px 40px 12px 12px;
  font-size:16px;
}

.input-group i {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color:#555;
}

button {
  padding: 12px;
  width: 100%;
  cursor: pointer;
  font-size:16px;
  border:none;
  border-radius:4px;
  background:#007bff;
  color:white;
}

button:hover {
  opacity:.9;
}

.btn-recover {
  background:#28a745;
  margin-top:10px;
}

/* Ajustes extra para pantallas muy pequeñas */
@media (max-width:400px){
  .card{
    padding:15px;
  }
  h2{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="container">

<h2>Login</h2>

<div class="card">

<div class="input-group">
<input id="loginUser" placeholder="Usuario"
 oninput="this.value=this.value.toUpperCase().trim()">
<i class="fa-solid fa-user"></i>
</div>

<div class="input-group">
<input id="loginPass" type="password" placeholder="Contraseña">
<i class="fa-solid fa-eye toggle-pass" onclick="verPassword()"></i>
</div>

<button onclick="login()">Ingresar</button>
<button class="btn-recover" onclick="recuperar()">¿Olvidaste tu contraseña?</button>

</div>
</div>

<!-- EMAILJS -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("0aHlArLgvHrj2Xbk8");
</script>

<script>
function verPassword() {
  const p = loginPass;
  const i = document.querySelector(".toggle-pass");
  p.type = p.type === "password" ? "text" : "password";
  i.classList.toggle("fa-eye");
  i.classList.toggle("fa-eye-slash");
}
</script>

<script type="module">
import { database, ref, get } from "./firebase.js";

window.login = async () => {

  const usuario = loginUser.value.trim().toUpperCase();
  const pass = loginPass.value.trim();

  if (!usuario || !pass) {
    alert("Completa todos los campos");
    return;
  }

  const snap = await get(ref(database,"usuarios/"+usuario));

  if (!snap.exists()) {
    alert("❌ Usuario NO registrado");
    return;
  }

  const data = snap.val();

  if (data.bloqueado) {
    alert("⛔ Usuario bloqueado");
    return;
  }

  if (data.contrasena !== pass) {
    alert("❌ Contraseña incorrecta");
    return;
  }

  localStorage.setItem("usuarioLogueado", JSON.stringify({
    usuario: data.usuario,
    nombre: data.nombre,
    puesto: data.puesto.toUpperCase(),
    empresa: data.empresa || "",
    zona: data.zona || ""
  }));

  window.location.href = "tecnologia.html";
};

window.recuperar = async () => {
  const u = prompt("Ingresa tu usuario:");
  if (!u) return;

  const snap = await get(ref(database,"usuarios/"+u.toUpperCase()));
  if (!snap.exists()) {
    alert("Usuario no encontrado");
    return;
  }

  const d = snap.val();
  await emailjs.send("service_mya4ogg","template_ub0ksu5",{
    to_email: d.correo,
    usuario: d.usuario,
    password: d.contrasena
  });

  alert("Contraseña enviada al correo");
};
</script>

</body>
</html>
