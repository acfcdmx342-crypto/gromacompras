<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center" style="height:100vh">

<div class="card p-4 shadow" style="width:350px">
  <h4 class="text-center mb-3">Login</h4>

  <input id="usuario" class="form-control mb-2" placeholder="Usuario">
  <input id="password" type="password" class="form-control mb-3" placeholder="Contraseña">

  <button class="btn btn-primary w-100" onclick="login()">Ingresar</button>
</div>

<script type="module">
import { database, ref, get, child } from "./firebase.js";

window.login = function(){
  const user = usuario.value.toUpperCase();
  const pass = password.value;

  if(!user || !pass){
    alert("Completa todos los campos");
    return;
  }

  get(child(ref(database), "usuarios/" + user))
    .then(snapshot => {

      if(!snapshot.exists()){
        alert("Usuario no existe");
        return;
      }

      const u = snapshot.val();

      if(u.bloqueado){
        alert("Usuario bloqueado");
        return;
      }

      if(u.contrasena !== pass){
        alert("Contraseña incorrecta");
        return;
      }

      localStorage.setItem("usuarioLogueado", u.usuario);
      localStorage.setItem("puesto", u.puesto);

      window.location.href = "tecnologia.html";
    })
    .catch(err=>{
      console.error(err);
      alert("Error de conexión");
    });
};
</script>

</body>
</html>
