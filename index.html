<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
  box-sizing:border-box;
}

body {
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  min-height:100vh;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.container {
  width:100%;
  max-width:380px;
}

h2 {
  text-align:center;
  margin-bottom:20px;
}

.card {
  border: 1px solid #ccc;
  padding: 20px;
  background:#fff;
  border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.input-group {
  position: relative;
  width: 100%;
  margin-bottom:15px;
}

.input-group input {
  width: 100%;
  padding: 12px 40px 12px 12px;
  font-size:16px;
}

.input-group i {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color:#555;
}

button {
  padding: 12px;
  width: 100%;
  cursor: pointer;
  font-size:16px;
  border:none;
  border-radius:4px;
  background:#007bff;
  color:white;
}

button:hover {
  opacity:.9;
}

.btn-recover {
  background:#28a745;
  margin-top:10px;
}

/* Ajustes extra para pantallas muy pequeñas */
@media (max-width:400px){
  .card{
    padding:15px;
  }
  h2{
    font-size:20px;
  }
}
</style>
</head>

<body>
<div class="container">
    <h2>Login</h2>
    <div class="card">
        <div class="input-group">
            <input id="loginUser" placeholder="Usuario" oninput="this.value=this.value.toUpperCase().trim()">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="input-group">
            <input id="loginPass" type="password" placeholder="Contraseña">
            <i id="toggleBtn" class="fa-solid fa-eye toggle-pass"></i>
        </div>
        <button id="btnLogin">Ingresar</button>
        <button id="btnRecover" class="btn-recover">¿Olvidaste tu contraseña?</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>emailjs.init("0aHlArLgvHrj2Xbk8");</script>

<script type="module">
    import { database, ref, get } from "./firebase.js";

    const loginUser = document.getElementById("loginUser");
    const loginPass = document.getElementById("loginPass");
    const toggleBtn = document.getElementById("toggleBtn");

    toggleBtn.onclick = () => {
        const isPass = loginPass.type === "password";
        loginPass.type = isPass ? "text" : "password";
        toggleBtn.classList.toggle("fa-eye");
        toggleBtn.classList.toggle("fa-eye-slash");
    };

    document.getElementById("btnLogin").onclick = async () => {
        const usuario = loginUser.value.trim().toUpperCase();
        const pass = loginPass.value.trim();

        if (!usuario || !pass) return alert("Completa todos los campos");

        try {
            const snap = await get(ref(database, "usuarios/" + usuario));
            if (!snap.exists()) return alert("❌ Usuario NO registrado");

            const data = snap.val();
            if (data.bloqueado) return alert("⛔ Usuario bloqueado");
            if (data.contrasena !== pass) return alert("❌ Contraseña incorrecta");

            localStorage.setItem("usuarioLogueado", JSON.stringify({
                usuario: data.usuario,
                nombre: data.nombre,
                puesto: data.puesto.toUpperCase()
            }));

            window.location.href = "tecnologia.html";
        } catch (e) { alert("Error de conexión"); }
    };

    document.getElementById("btnRecover").onclick = async () => {
        const u = prompt("Ingresa tu usuario:");
        if (!u) return;
        const snap = await get(ref(database, "usuarios/" + u.toUpperCase()));
        if (snap.exists()) {
            const d = snap.val();
            await emailjs.send("service_mya4ogg", "template_ub0ksu5", {
                to_email: d.correo, usuario: d.usuario, password: d.contrasena
            });
            alert("Contraseña enviada al correo");
        }
    };
</script>
</body>
