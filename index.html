<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background:#f4f4f4;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
  padding:15px;
}

.card {
  background:#fff;
  padding:25px;
  max-width:360px;
  width:100%;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

h2 {
  text-align:center;
  margin-bottom:20px;
}

.input-group {
  position: relative;
  width: 100%;
}

.input-group input {
  width: 100%;
  padding: 12px 40px 12px 12px;
  margin-bottom: 15px;
  font-size:16px;
}

.input-group i {
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:18px;
  color:#555;
}

button {
  width:100%;
  padding:12px;
  font-size:16px;
  cursor:pointer;
  border:none;
  border-radius:8px;
}

button:hover { opacity:0.9; }

.btn-recover {
  background:#28a745;
  color:white;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="card">
  <h2>Login</h2>

  <div class="input-group">
    <input id="loginUser" placeholder="Usuario"
           oninput="this.value = this.value.toUpperCase().trim()">
    <i class="fa-solid fa-user"></i>
  </div>

  <div class="input-group">
    <input id="loginPass" type="password" placeholder="Contraseña">
    <i class="fa-solid fa-eye toggle-pass" onclick="verPassword()"></i>
  </div>

  <button onclick="login()">Ingresar</button>
  <button class="btn-recover" onclick="recuperar()">¿Olvidaste tu contraseña?</button>
</div>

<!-- ================= EMAILJS ================= -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
emailjs.init("0aHlArLgvHrj2Xbk8");
</script>

<!-- ================= UTILIDADES ================= -->
<script>
function verPassword() {
  const pass = document.getElementById("loginPass");
  const icon = document.querySelector(".toggle-pass");

  if (pass.type === "password") {
    pass.type = "text";
    icon.classList.replace("fa-eye", "fa-eye-slash");
  } else {
    pass.type = "password";
    icon.classList.replace("fa-eye-slash", "fa-eye");
  }
}
</script>

<!-- ================= LOGIN FIREBASE ================= -->
<script type="module">
import { database, ref, get } from "./firebase.js";

window.login = async function () {

  const usuario = loginUser.value.trim().toUpperCase();
  const pass = loginPass.value.trim();

  if (!usuario || !pass) {
    alert("Completa todos los campos");
    return;
  }

  try {
    const snapshot = await get(ref(database, "usuarios/" + usuario));

    if (!snapshot.exists()) {
      alert("❌ Usuario NO registrado en Base");
      return;
    }

    const data = snapshot.val();

    if (data.bloqueado === true) {
      alert("⛔ Usuario bloqueado");
      return;
    }

    if (data.contrasena !== pass) {
      alert("❌ Contraseña incorrecta");
      return;
    }

    localStorage.setItem("usuarioLogueado", data.usuario);
    localStorage.setItem("puesto", data.puesto.toUpperCase());
    localStorage.setItem("empresa", data.empresa || "");
    localStorage.setItem("zona", data.zona || "");

    window.location.href = "tecnologia.html";

  } catch (error) {
    console.error(error);
    alert("Error al conectar con Firebase");
  }
};

window.recuperar = async function () {

  const usuario = prompt("Ingresa tu usuario:");
  if (!usuario) return;

  try {
    const snapshot = await get(
      ref(database, "usuarios/" + usuario.trim().toUpperCase())
    );

    if (!snapshot.exists()) {
      alert("Usuario no encontrado en Base");
      return;
    }

    const data = snapshot.val();

    await emailjs.send("service_mya4ogg", "template_ub0ksu5", {
      to_email: data.correo,
      usuario: data.usuario,
      password: data.contrasena
    });

    alert("Tu contraseña fue enviada al correo");

  } catch (err) {
    console.error(err);
    alert("Error de conexión");
  }
};
</script>

</body>
</html>
