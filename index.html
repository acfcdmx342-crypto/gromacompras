<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  font-family: Arial, sans-serif;
  background:#eef1f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.card {
  background:#fff;
  padding:30px;
  border-radius:15px;
  width:350px;
  box-shadow:0 0 10px rgba(0,0,0,.1);
}

.input-group {
  position: relative;
  margin-bottom: 15px;
}

.input-group input {
  width: 100%;
  padding: 10px 40px 10px 10px;
}

.input-group i {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color:#555;
}
button {
  width:100%;
  padding:10px;
}
</style>
</head>

<body>

<div class="card">
<h3 class="text-center fw-bold mb-4">Iniciar sesión</h3>

<div class="input-group">
<input id="loginUser" placeholder="Usuario"
oninput="this.value=this.value.toUpperCase().trim()">
<i class="fa-solid fa-user"></i>
</div>

<div class="input-group">
<input id="loginPass" type="password" placeholder="Contraseña">
<i class="fa-solid fa-lock"></i>
</div>

<button onclick="login()" class="btn btn-primary">
Ingresar
</button>
</div>

<!-- ================= LOGIN FIREBASE ================= -->
<script type="module">
import { database, ref, get } from "./firebase.js";

window.login = async function () {

  const usuario = document.getElementById("loginUser").value.trim().toUpperCase();
  const pass = document.getElementById("loginPass").value.trim();

  if (!usuario || !pass) {
    alert("Completa todos los campos");
    return;
  }

  try {
    const snapshot = await get(ref(database, "usuarios"));

    let encontrado = false;

    snapshot.forEach(child => {
      const data = child.val();

      if (
        data.usuario === usuario &&
        data.contrasena === pass
      ) {
        encontrado = true;

        // ✅ SESIÓN (MISMA LÓGICA DE ANTES)
        localStorage.setItem("usuarioLogueado", data.usuario);
        localStorage.setItem("nombreCompleto", data.nombre);
        localStorage.setItem("puesto", data.puesto);
        localStorage.setItem("empresa", data.empresa || "");
        localStorage.setItem("zona", data.zona || "");

        window.location.href = "tecnologia.html";
      }
    });

    if (!encontrado) {
      alert("Usuario o contraseña incorrectos");
    }

  } catch (error) {
    console.error(error);
    alert("Error al conectar con Firebase");
  }
};
</script>

</body>
</html>
