<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Tecnología</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f2f4f7; }
.card { border-radius:20px; }
.action-btn { cursor:pointer; font-size:22px; margin-right:10px; }
.table thead { background:#0d6efd; color:white; }
.btn-rounded { border-radius:50px; }
</style>
</head>

<body class="p-4">

<div class="container">
<h2 class="text-center fw-bold mb-4">Solicitud de Tecnología</h2>

<div class="card shadow p-4 mb-4">
<h5 class="fw-bold">Registrar Solicitud</h5>

<form id="formTec" class="row g-3">

<div class="col-md-3">
<label>Empresa</label>
<input id="empresa" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label>Zona</label>
<input id="zona" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label>Soporte</label>
<input id="soporte" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label>Sucursal</label>
<input id="sucursal" class="form-control text-uppercase">
</div>

<div class="col-md-6">
<label>Archivo</label>
<input id="archivo" type="file" class="form-control">
</div>

<div class="col-12">
<button type="button" class="btn btn-primary btn-rounded"
onclick="guardarSolicitud()">Guardar</button>
</div>

</form>
</div>

<div class="card shadow p-4">
<h5 class="fw-bold">Solicitudes</h5>

<table class="table table-bordered">
<thead>
<tr>
<th>Folio</th>
<th>Empresa</th>
<th>Zona</th>
<th>Soporte</th>
<th>Sucursal</th>
<th>Archivo</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaTecBody"></tbody>
</table>
</div>
</div>

<script type="module">
import { database, ref, push, onValue } from "./firebase.js";

const tecnologiaRef = ref(database, "tecnologia");
const tabla = document.getElementById("tablaTecBody");

/* ===== GUARDAR ===== */
window.guardarSolicitud = function(){

  const emp = empresa.value.toUpperCase();
  const zon = zona.value.toUpperCase();
  const sop = soporte.value.toUpperCase();
  const suc = sucursal.value.toUpperCase();
  const file = archivo.files[0];

  if(!emp || !zon || !sop || !suc || !file){
    alert("Campos obligatorios");
    return;
  }

  const folio = `TEC-${emp}-${zon}-${Date.now()}`;

  const reader = new FileReader();
  reader.onload = async () => {

    await push(tecnologiaRef,{
      folio,
      empresa: emp,
      zona: zon,
      soporte: sop,
      sucursal: suc,
      archivoData: reader.result,
      archivoNombre: file.name,
      fecha: new Date().toLocaleString()
    });

    formTec.reset();
  };

  reader.readAsDataURL(file);
};

/* ===== TABLA ===== */
onValue(tecnologiaRef, snapshot => {
  tabla.innerHTML = "";
  snapshot.forEach(child => {
    const s = child.val();
    tabla.innerHTML += `
      <tr>
        <td>${s.folio}</td>
        <td>${s.empresa}</td>
        <td>${s.zona}</td>
        <td>${s.soporte}</td>
        <td>${s.sucursal}</td>
        <td>
          <a class="btn btn-success btn-sm"
             download="${s.archivoNombre}"
             href="${s.archivoData}">📥</a>
        </td>
        <td>
          <span class="action-btn"
            onclick="irSeguimiento('${s.folio}')">📋</span>
        </td>
      </tr>
    `;
  });
});

/* ===== IR A SEGUIMIENTO ===== */
window.irSeguimiento = function(folio){
  window.location.href = `seguimiento.html?folio=${folio}`;
};
</script>

</body>
</html>
