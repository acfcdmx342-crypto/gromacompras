<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tecnología</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){ emailjs.init("0aHlArLgvHrj2Xbk8"); })();
    </script>
    <style>
        body { background:#f2f4f7; }
        .card { border-radius:20px; }
        .action-btn { cursor:pointer; font-size:22px; transition: 0.2s; display: inline-block; margin: 0 5px; }
        .action-btn:hover { transform: scale(1.2); }
        .action-disabled { color:#adb5bd; cursor:not-allowed; opacity: 0.5; filter: grayscale(1); }
        .table thead { background:#0d6efd; color:white; }
        .btn-rounded { border-radius:50px; }
        .user-info-box { background: white; padding: 10px 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; }
        .aviso-devolucion { background: #fff3cd; border-left: 5px solid #ffc107; padding: 10px 15px; border-radius: 10px; font-size: 0.85rem; color: #856404; max-width: 600px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        #loader { 
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; 
            align-items: center; flex-direction: column; 
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="p-4">

<div id="loader">
    <div style="animation: pulse 1.5s infinite;">
        <img src="https://gruporoma.com/wp-content/uploads/2023/06/cropped-cropped-procomex-pachuca-logo-350-%C3%97-100-px-1.png" style="width: 250px;">
    </div>
    <div class="mt-3 text-center">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 fw-bold">Procesando información...</p>
    </div>
</div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <div class="user-info-box border-start border-primary border-4">
                <div class="fw-bold text-primary">👤 <span id="usuarioActivo"></span></div>
                <div class="text-muted small">Puesto: <span id="puestoActivo"></span></div>
            </div>
            <div class="aviso-devolucion d-none d-md-block">
                <strong>⚠️ Aviso:</strong> Se les recuerda que para hacer una devolucion de mercancia los empaques deben de estar lo mas intactos posibles...
            </div>
        </div>
        
        <div class="dropdown">
            <button class="btn btn-primary btn-rounded dropdown-toggle fw-bold px-4 shadow-sm" type="button" id="menuBtn" data-bs-toggle="dropdown">
                ☰ Menú
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><a class="dropdown-item" href="historial.html">📜 Ver Historial</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#" onclick="window.cerrarSesion()">🚪 Cerrar Sesión</a></li>
            </ul>
        </div>
    </div>

    <h2 class="text-center fw-bold mb-4">Solicitud de Tecnología</h2>

    <div class="card shadow p-4 mb-4 border-0">
        <h5 class="fw-bold mb-3 border-bottom pb-2 text-secondary">Registrar Solicitud</h5>
        <form id="formTec" class="row g-3">
            <div class="col-md-3"><label class="small fw-bold">Empresa</label><input id="empresa" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="small fw-bold">Zona</label><input id="zona" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="small fw-bold">Soporte Zona</label><input id="soporte" class="form-control text-uppercase" readonly></div>
            <div class="col-md-3"><label class="small fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase"></div>
            <div class="col-md-6"><label class="small fw-bold">Requisición</label><input id="archivo" type="file" class="form-control"></div>
            <div class="col-12 mt-4">
                <button type="button" class="btn btn-primary btn-rounded px-5 shadow" onclick="window.guardarSolicitud()">💾 Guardar Solicitud</button>
            </div>
        </form>
    </div>

    <div class="card shadow p-4 border-0">
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center bg-white">
                <thead class="table-primary">
                    <tr>
                        <th>Folio</th><th>Empresa</th><th>Zona</th><th>Soporte</th><th>Sucursal</th><th>Status</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaTecBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { database, ref, push, set, get, onValue, remove, update } from "./firebase.js";

    // --- SESIÓN Y PERMISOS ---
    const sesionRaw = localStorage.getItem("usuarioLogueado");
    if (!sesionRaw) {
        location.href = "index.html";
    } else {
        const sesion = JSON.parse(sesionRaw);
        document.getElementById("usuarioActivo").innerText = sesion.nombre;
        document.getElementById("puestoActivo").innerText = sesion.puesto;
        window.nombreSesion = sesion.nombre;
        window.puestoSesion = (sesion.puesto || "").toUpperCase();
        
        // Autollenar Soporte Zona si el usuario es Soporte
        if(window.puestoSesion.includes("SOPORTE")) {
            document.getElementById("soporte").value = window.nombreSesion;
        }
    }

    window.mostrarCargando = () => { document.getElementById("loader").style.display = "flex"; };
    window.ocultarCargando = () => { document.getElementById("loader").style.display = "none"; };
    window.cerrarSesion = () => { localStorage.clear(); location.href = "index.html"; };

    // --- CARGA DE TABLA (SOLUCIÓN LOADER INFINITO) ---
    onValue(ref(database, "tecnologia"), snap => {
        const tbody = document.getElementById("tablaTecBody");
        tbody.innerHTML = "";
        
        if (snap.exists()) {
            snap.forEach(child => {
                const s = child.val();
                const id = child.key;
                tbody.innerHTML += `
                    <tr>
                        <td>${s.folio}</td>
                        <td>${s.empresa}</td>
                        <td>${s.zona}</td>
                        <td>${s.soporte || '---'}</td>
                        <td>${s.sucursal}</td>
                        <td><span class="badge bg-info">${s.status}</span></td>
                        <td>
                            <span class="action-btn" onclick="window.verSeguimiento('${s.folio}')">👁️</span>
                            <span class="action-btn" onclick="window.eliminarSolicitud('${id}')">🗑️</span>
                        </td>
                    </tr>`;
            });
        } else {
            tbody.innerHTML = "<tr><td colspan='7'>No hay registros</td></tr>";
        }
        window.ocultarCargando(); // <--- Aquí se apaga el loader
    }, error => {
        window.ocultarCargando();
    });

    // --- FUNCIONES GLOBALES ---
    window.guardarSolicitud = async () => {
        const emp = document.getElementById("empresa").value;
        const zon = document.getElementById("zona").value;
        const sop = document.getElementById("soporte").value;
        const suc = document.getElementById("sucursal").value;
        const file = document.getElementById("archivo").files[0];

        if(!emp || !suc || !file) return Swal.fire("Error", "Campos obligatorios faltantes", "error");

        window.mostrarCargando();
        const reader = new FileReader();
        reader.onload = async (e) => {
            const folio = "TEC-" + Math.floor(Math.random()*9000+1000);
            await push(ref(database, "tecnologia"), {
                folio, empresa: emp.toUpperCase(), zona: zon.toUpperCase(), 
                soporte: sop.toUpperCase(), sucursal: suc.toUpperCase(),
                status: "PENDIENTE", fechaEnvio: new Date().toLocaleString(),
                archivoData: e.target.result, usuario: window.nombreSesion
            });
            document.getElementById("formTec").reset();
            window.ocultarCargando();
            Swal.fire("Éxito", "Registrado correctamente", "success");
        };
        reader.readAsDataURL(file);
    };

    window.verSeguimiento = (fol) => { location.href = `seguimiento.html?folio=${encodeURIComponent(fol)}`; };

    window.eliminarSolicitud = async (id) => {
        // Lógica de archivado que ya tenías...
        if(confirm("¿Eliminar registro?")) {
            window.mostrarCargando();
            await remove(ref(database, `tecnologia/${id}`));
            window.ocultarCargando();
        }
    };
</script>
<script>
  // Seguridad de código fuente
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.onkeydown = function(e) {
    if(e.keyCode == 123) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
  };
</script>
</body>
</html>
