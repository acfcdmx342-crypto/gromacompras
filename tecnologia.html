<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tecnología - Procomex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script type="text/javascript">
        (function(){ emailjs.init("0aHlArLgvHrj2Xbk8"); })();
    </script>
    <style>
        body { background:#f2f4f7; font-family: 'Segoe UI', sans-serif; }
        .card { border-radius:15px; border: none; }
        .action-btn { cursor:pointer; font-size:20px; transition: 0.2s; display: inline-block; padding: 0 5px; }
        .action-btn:hover { transform: scale(1.2); }
        .action-disabled { color:#adb5bd; cursor:not-allowed; opacity: 0.4; pointer-events: none; }
        
        /* Diferenciación Visual de Filas */
        .fila-local { background-color: #fff9e6 !important; } /* Tono Crema para Locales */
        .badge-local { background-color: #ffc107; color: #000; font-weight: bold; }
        .badge-compras { background-color: #6c757d; color: #fff; }

        .st-zona { background-color: #ffc107 !important; color: black; }
        
        #loader { 
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; 
            align-items: center; flex-direction: column; 
        }
        #preview-container { border: 2px dashed #ccc; border-radius: 10px; height: 150px; display: flex; align-items: center; justify-content: center; background: #fff; margin-top: 10px; overflow: hidden; }
        #preview-container img, #preview-container iframe { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body class="p-4">

<div id="loader">
    <div class="spinner-border text-primary" role="status"></div>
    <span class="mt-2 fw-bold">Actualizando registros...</span>
</div>

<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm border-start border-primary border-4">
        <div>
            <h5 class="mb-0 fw-bold text-primary">👤 <span id="usuarioActivo"></span></h5>
            <small class="text-muted" id="puestoActivo"></small>
        </div>
        <div class="dropdown">
            <button class="btn btn-primary btn-rounded dropdown-toggle px-4 shadow-sm" data-bs-toggle="dropdown">Menú</button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li><a class="dropdown-item" href="historial.html">📜 Ver Historial</a></li>
                <li id="liBase"></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">🚪 Cerrar Sesión</a></li>
            </ul>
        </div>
    </div>

    <div class="card shadow-sm p-4 mb-4">
        <h6 class="fw-bold mb-3 text-secondary border-bottom pb-2">REGISTRAR NUEVA SOLICITUD</h6>
        <form id="formTec" class="row g-3">
            <div class="col-md-2"><label class="small fw-bold">Empresa</label><input id="empresa" class="form-control text-uppercase"></div>
            <div class="col-md-2"><label class="small fw-bold">Zona</label><input id="zona" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="small fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase"></div>
            <div class="col-md-5">
                <label class="small fw-bold">Archivo Requisición</label>
                <div class="input-group">
                    <input id="archivo" type="file" class="form-control" onchange="previewArchivo(this)">
                    <div class="input-group-text bg-white">
                        <input class="form-check-input mt-0" type="checkbox" id="checkLocal">
                        <label class="form-check-label small fw-bold ms-2" for="checkLocal">Solicitud Local</label>
                    </div>
                </div>
                <div id="preview-container"><small class="text-muted">Vista previa</small></div>
            </div>
            <div class="col-12 mt-3 text-end">
                <button type="button" class="btn btn-primary px-5 fw-bold" onclick="guardarSolicitud()">💾 Guardar Solicitud</button>
            </div>
        </form>
    </div>

    <div class="card shadow-sm p-4">
        <div class="table-responsive">
            <table class="table align-middle text-center table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>Folio</th><th>Empresa</th><th>Zona</th><th>Sucursal</th>
                        <th>Tipo</th><th>Status Actual</th><th>Tiempo</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaTecBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { database, ref, push, set, get, onValue, update, remove } from "./firebase.js";

    // Manejo de Sesión y Perfiles
    const sesion = JSON.parse(localStorage.getItem("usuarioLogueado") || "{}");
    if(!sesion.usuario) location.href="index.html";
    
    const uNombre = sesion.nombre;
    const uPuesto = (sesion.puesto || "").toUpperCase();
    const esSoporteJR = uPuesto === "SOPORTE TECNICO JR";
    
    document.getElementById("usuarioActivo").textContent = uNombre;
    document.getElementById("puestoActivo").textContent = uPuesto;

    const solicitudesRef = ref(database, "tecnologia");
    const seguimientoRef = ref(database, "seguimiento");
    let globalSegs = [];

    window.ocultarCargando = () => document.getElementById("loader").style.display = "none";
    window.mostrarCargando = () => document.getElementById("loader").style.display = "flex";

    // Carga de Datos en Tiempo Real
    onValue(seguimientoRef, snap => {
        globalSegs = [];
        snap.forEach(c => { globalSegs.push({...c.val(), id: c.key}); });
        onValue(solicitudesRef, sSnap => renderTable(sSnap));
    });

    function renderTable(snap) {
        const tbody = document.getElementById("tablaTecBody");
        tbody.innerHTML = "";
        
        snap.forEach(doc => {
            const s = doc.val();
            const id = doc.key;
            if(s.eliminado) return;

            // Obtener el último estatus del seguimiento
            const misSegs = globalSegs.filter(x => x.folio === s.folio).sort((a,b) => new Date(b.fechaRegistro) - new Date(a.fechaRegistro));
            const stActual = misSegs.length > 0 ? misSegs[0].status : (s.status || "PENDIENTE");
            
            if(stActual === "CONFIRMADO") return;

            // LÓGICA DE RETROCOMPATIBILIDAD (Importante para tus registros anteriores)
            const esLocal = (s.solicitudLocal === true || s.isLocal === true); 
            const filaClase = esLocal ? "fila-local" : "";
            const tipoBadge = esLocal ? "badge-local" : "badge-compras";

            tbody.innerHTML += `
                <tr class="${filaClase}">
                    <td class="fw-bold">${s.folio}</td>
                    <td>${s.empresa}</td>
                    <td>${s.zona}</td>
                    <td>${s.sucursal}</td>
                    <td><span class="badge ${tipoBadge}">${esLocal ? 'LOCAL' : 'COMPRAS'}</span></td>
                    <td><span class="badge ${stActual === 'EN ZONA' ? 'st-zona' : 'bg-info text-dark'} w-100">${stActual}</span></td>
                    <td><small>${calcularTiempo(s.fechaISO || s.fechaEnvio)}</small></td>
                    <td>
                        <div class="d-flex gap-2 justify-content-center">
                            <span class="action-btn" title="Historial" onclick="verHistorial('${s.folio}')">📜</span>
                            
                            ${esLocal ? 
                                `<span class="action-btn text-info" title="Seguimiento Local" onclick="modalSegLocal('${id}', '${s.folio}')">📋</span>` :
                                `<span class="action-btn text-secondary ${esSoporteJR ? 'action-disabled' : ''}" title="Seguimiento Compras" onclick="irSeg('${s.folio}')">📋</span>`
                            }

                            ${esSoporteJR && stActual === "EN ZONA" ? `
                                <span class="action-btn text-success" title="Confirmar Entrega" onclick="confirmarEntrega('${s.folio}')">✅</span>
                                <span class="action-btn text-warning" title="Devolución" onclick="devolucion('${s.folio}')">🔄</span>
                            ` : ''}
                        </div>
                    </td>
                </tr>`;
        });
        ocultarCargando();
    }

    window.guardarSolicitud = async () => {
        const emp = document.getElementById("empresa").value;
        const zon = document.getElementById("zona").value;
        const suc = document.getElementById("sucursal").value;
        const arc = document.getElementById("archivo").files[0];
        const local = document.getElementById("checkLocal").checked;

        if(!emp || !zon || !suc || !arc) return Swal.fire("Error", "Campos incompletos", "error");

        mostrarCargando();
        const reader = new FileReader();
        reader.onload = async () => {
            const nFolio = `TEC-${emp}-${zon}-${Date.now().toString().slice(-4)}`.toUpperCase();
            await push(solicitudesRef, {
                folio: nFolio, empresa: emp.toUpperCase(), zona: zon.toUpperCase(),
                sucursal: suc.toUpperCase(), archivoData: reader.result,
                status: local ? "EN COTIZACION" : "PENDIENTE",
                solicitudLocal: local, isLocal: local, // Guardamos ambas para seguridad
                fechaISO: new Date().toISOString(),
                usuario: uNombre, eliminado: false
            });
            document.getElementById("formTec").reset();
            document.getElementById("preview-container").innerHTML = "";
            Swal.fire("Guardado", "La solicitud se ha registrado correctamente", "success");
        };
        reader.readAsDataURL(arc);
    };

    window.modalSegLocal = async (id, fol) => {
        const segs = globalSegs.filter(x => x.folio === fol);
        // Respaldo de descripción para registros antiguos
        const descPrev = segs.find(x => x.descripcionArt)?.descripcionArt || "";
        
        const { value: form } = await Swal.fire({
            title: 'Seguimiento de Solicitud Local',
            html: `
                <div class="text-start">
                    <label class="small fw-bold">Descripción del Artículo</label>
                    <textarea id="sw-desc" class="form-control mb-2" ${descPrev ? 'readonly' : ''}>${descPrev}</textarea>
                    <label class="small fw-bold">Cambiar Status</label>
                    <select id="sw-status" class="form-select mb-2">
                        <option value="EN COTIZACION">EN COTIZACION</option>
                        <option value="EN AUTORIZACION">EN AUTORIZACION</option>
                        <option value="EN COMPRA">EN COMPRA</option>
                        <option value="EN ZONA">EN ZONA</option>
                    </select>
                    <label class="small fw-bold">Comentario Adicional</label>
                    <textarea id="sw-coment" class="form-control" placeholder="Escribe aquí..."></textarea>
                </div>`,
            showCancelButton: true,
            confirmButtonText: 'Registrar',
            preConfirm: () => ({ 
                desc: document.getElementById('sw-desc').value, 
                sts: document.getElementById('sw-status').value, 
                com: document.getElementById('sw-coment').value 
            })
        });

        if(form) {
            mostrarCargando();
            await push(seguimientoRef, {
                folio: fol, status: form.sts, descripcionArt: form.desc.toUpperCase(),
                comentarios: form.com.toUpperCase(), fechaRegistro: new Date().toISOString(), usuario: uNombre
            });
            ocultarCargando();
            Swal.fire("Registrado", "Seguimiento actualizado", "success");
        }
    };

    window.previewArchivo = (input) => {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => {
            const cont = document.getElementById("preview-container");
            cont.innerHTML = input.files[0].type.includes("pdf") ? `<iframe src="${e.target.result}"></iframe>` : `<img src="${e.target.result}">`;
        };
        reader.readAsDataURL(input.files[0]);
    };

    function calcularTiempo(f) {
        if(!f) return "0h";
        const diff = new Date() - new Date(f);
        const horas = Math.floor(diff / 3600000);
        return `${horas}h`;
    }

    window.cerrarSesion = () => { localStorage.clear(); location.href="index.html"; };
    window.irSeg = (f) => location.href = "seguimiento.html?folio=" + encodeURIComponent(f);
    
    // Funciones globales para evitar errores de referencia
    window.verHistorial = (fol) => {
        const hist = globalSegs.filter(x => x.folio === fol).sort((a,b) => new Date(a.fechaRegistro) - new Date(b.fechaRegistro));
        let html = '<ul class="list-group text-start">';
        hist.forEach(h => {
            html += `<li class="list-group-item"><b>${h.status}:</b> ${h.descripcionArt || h.comentarios || 'Sin detalles'} <br><small class="text-muted">${new Date(h.fechaRegistro).toLocaleString()}</small></li>`;
        });
        html += '</ul>';
        Swal.fire({ title: 'Historial ' + fol, html: html || 'Sin registros aún' });
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
