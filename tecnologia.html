<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Tecnología</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background:#f2f4f7; }
    .card { border-radius:20px; }
    .action-btn { cursor:pointer; font-size:22px; transition: 0.2s; display: inline-block; }
    .action-btn:hover { transform: scale(1.2); }
    .action-disabled { color:#adb5bd; cursor:not-allowed; opacity: 0.5; filter: grayscale(1); }
    .table thead { background:#0d6efd; color:white; }
    .btn-rounded { border-radius:50px; }
    
    /* Estilos de navegación y usuario */
    #btnRegresar { cursor:pointer; font-size:40px; color:#0d6efd; transition: 0.3s; }
    #btnRegresar:hover { color: #0056b3; transform: scale(1.1); }
    
    .user-info-box {
        background: white;
        padding: 10px 20px;
        border-radius: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        display: inline-block;
    }

    .acciones { display:flex; justify-content:center; gap:10px; }
    
    /* Colores dinámicos vinculados */
    .st-compras { background-color: #0d6efd !important; color: white; } 
    .st-zona { background-color: #ffc107 !important; color: black; }    
    .st-pendiente { background-color: #dc3545 !important; color: white; } 
    .st-sistemas { background-color: #198754 !important; color: white; }  
    .st-default { background-color: #6c757d !important; color: white; }   
    
    .tiempo-badge { font-size: 0.75rem; font-weight: bold; color: #555; }
</style>
</head>
<body class="p-4">

<script>
    const sesion = JSON.parse(localStorage.getItem("usuarioLogueado"));
    if (!sesion) { alert("Sesión no válida"); location.href = "index.html"; }
    const usuarioSesion = sesion.usuario;
    const nombreSesion = sesion.nombre;
    const puestoSesion = sesion.puesto;

    const puestosPrivilegiados = [
        "GERENTE DE SISTEMAS", 
        "JEFE DE INFRAESTRUCTURA Y SOPORTE TECNICO", 
        "COORDINADOR DE SOPORTE TECNICO", 
        "SOPORTE TECNICO", 
        "BECARIO"
    ];

    const esSoporteJR = puestoSesion === "SOPORTE TECNICO JR";
</script>

<div class="container">
            <div class="d-flex align-items-center gap-4">
            <div class="user-info-box border-start border-primary border-3">
                <div class="fw-bold text-primary" style="font-size: 0.9rem;">👤 <span id="usuarioActivo"></span></div>
                <div class="text-muted small" style="font-size: 0.8rem;">Puesto: <span id="puestoActivo"></span></div>
            </div>
            <button class="btn btn-outline-danger btn-rounded fw-bold" onclick="cerrarSesion()">
                🚪 Cerrar Sesión
            </button>
        </div>
    </div>

    <h2 class="text-center mb-4 fw-bold">Solicitud de Tecnología</h2>

    <div class="card shadow p-4 mb-4">
        <h5 class="fw-bold mb-3 border-bottom pb-2 text-secondary">Registrar Solicitud</h5>
        <form id="formTec" class="row g-3">
            <div class="col-md-3"><label class="fw-bold">Folio</label><input id="folio" class="form-control" readonly placeholder="Auto-generado"></div>
            <div class="col-md-3"><label class="fw-bold">Empresa</label><input id="empresa" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="fw-bold">Zona</label><input id="zona" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="fw-bold">Soporte Zona</label><input id="soporte" class="form-control text-uppercase" readonly></div>
            <div class="col-md-3"><label class="fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase"></div>
            <div class="col-md-6"><label class="fw-bold">Requisición (PDF/Imagen)</label><input id="archivo" type="file" class="form-control"></div>
            <div class="col-12 text-start mt-4">
                <button type="button" class="btn btn-primary btn-rounded px-4" onclick="guardarSolicitud()">
                    💾 Guardar Solicitud
                </button>
            </div>
        </form>
    </div>

    <div class="card shadow p-4">
        <h5 class="fw-bold mb-3 border-bottom pb-2 text-secondary">Registros de Solicitudes</h5>
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle text-center">
                <thead>
                    <tr>
                        <th>Folio</th>
                        <th>Empresa</th>
                        <th>Zona</th>
                        <th>Soporte</th>
                        <th>Sucursal</th>
                        <th>Archivo</th>
                        <th>Status Actual</th>
                        <th>Transcurrido</th> 
                        <th>Fecha Registro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaTecBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalHistorial" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Historial de Seguimiento: <span id="histFolio"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table class="table table-sm table-hover">
                    <thead><tr><th>Fecha</th><th>Estatus</th><th>Descripción</th><th>Comentarios</th></tr></thead>
                    <tbody id="histBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { database, ref, push, set, get, onValue, remove } from "./firebase.js";

// Llenado de información del usuario
usuarioActivo.textContent = nombreSesion;
puestoActivo.textContent = puestoSesion;
soporte.value = nombreSesion;

const solicitudesRef = ref(database,"tecnologia");
const seguimientoRef = ref(database,"seguimiento");

let globalSeguimientos = [];

function calcularTranscurrido(fechaInicio) {
    const inicio = new Date(fechaInicio);
    if (isNaN(inicio)) return "N/A";
    const ahora = new Date();
    const dif = ahora - inicio;
    const dias = Math.floor(dif / (1000 * 60 * 60 * 24));
    const horas = Math.floor((dif / (1000 * 60 * 60)) % 24);
    if (dias > 0) return `${dias}d ${horas}h`;
    if (horas > 0) return `${horas}h`;
    return "Menos de 1h";
}

onValue(seguimientoRef, snap => {
    globalSeguimientos = [];
    snap.forEach(c => { 
        globalSeguimientos.push({ ...c.val(), id: c.key }); 
    });
    renderTable(); 
});

function renderTable() {
    onValue(solicitudesRef, snap => {
        tablaTecBody.innerHTML = "";
        snap.forEach(c => {
            const s = c.val();
            const puedeVerTodo = puestosPrivilegiados.includes(puestoSesion);
            const esDuenoDelRegistro = s.usuario === usuarioSesion;

            if(puedeVerTodo || esDuenoDelRegistro) {
                const segsDelFolio = globalSeguimientos.filter(x => x.folio === s.folio);
                let statusMostrar = s.status || "PENDIENTE";
                let claseColor = "st-default";

                if(segsDelFolio.length > 0) {
                    segsDelFolio.sort((a, b) => new Date(b.fechaRegistro) - new Date(a.fechaRegistro));
                    statusMostrar = segsDelFolio[0].status;
                    switch(statusMostrar) {
                        case "ENVIADO A COMPRAS": claseColor = "st-compras"; break;
                        case "ENVIADO A ZONA": claseColor = "st-zona"; break;
                        case "PENDIENTE POR AUTORIZAR": claseColor = "st-pendiente"; break;
                        case "EN SISTEMAS": claseColor = "st-sistemas"; break;
                        default: claseColor = "st-default";
                    }
                }

                const tiempo = calcularTranscurrido(s.fechaISO || s.fechaEnvio);

                tablaTecBody.innerHTML += `
                <tr>
                    <td><small class="fw-bold">${s.folio}</small></td>
                    <td>${s.empresa}</td>
                    <td>${s.zona}</td>
                    <td>${s.soporte}</td>
                    <td>${s.sucursal}</td>
                    <td><a class="btn btn-success btn-sm" download="${s.archivoNombre}" href="${s.archivoData}">📥</a></td>
                    <td><span class="badge ${claseColor} p-2 w-100" style="font-size:10px;">${statusMostrar}</span></td>
                    <td class="tiempo-badge">${tiempo}</td>
                    <td><small>${s.fechaEnvio}</small></td>
                    <td>
                        <div class="acciones">
                            <span class="action-btn ${esSoporteJR ? 'action-disabled' : ''}" 
                                  onclick="irSeguimiento('${s.folio}')" 
                                  title="${esSoporteJR ? 'Sin permisos para editar' : 'Nuevo Seguimiento'}">📋</span>
                            
                            <span class="action-btn ${segsDelFolio.length > 0 ? '' : 'action-disabled'}" 
                                  onclick="${segsDelFolio.length > 0 ? `verHistorial('${s.folio}')` : ''}" title="Ver Historial">📜</span>
                            
                            ${puedeVerTodo ? `<span class="action-btn" onclick="eliminar('${c.key}')">🗑️</span>` : ``}
                        </div>
                    </td>
                </tr>`;
            }
        });
    });
}

async function generarFolio(emp, zon){
    const key = `TEC_${emp}_${zon}`.toUpperCase();
    const r = ref(database,"folios/"+key);
    const s = await get(r);
    let n = s.exists() ? s.val()+1 : 1;
    await set(r,n);
    return `TEC-${emp}-${zon}-${n.toString().padStart(4,"0")}`;
}

window.guardarSolicitud = async ()=>{
    if(!empresa.value||!zona.value||!sucursal.value||!archivo.files[0]){
        alert("Todos los campos son obligatorios, incluyendo el archivo."); return;
    }
    const fol = await generarFolio(empresa.value,zona.value);
    const reader = new FileReader();
    reader.onload = async ()=>{
        const ahora = new Date();
        await push(solicitudesRef,{
            folio: fol, empresa: empresa.value.toUpperCase(), zona: zona.value.toUpperCase(),
            soporte: nombreSesion, sucursal: sucursal.value.toUpperCase(),
            archivoData: reader.result, archivoNombre: archivo.files[0].name,
            status:"PENDIENTE", 
            fechaEnvio: ahora.toLocaleString(), 
            fechaISO: ahora.toISOString(),
            usuario:usuarioSesion
        });
        alert("Solicitud guardada correctamente.");
        document.getElementById("formTec").reset(); 
        soporte.value = nombreSesion;
    };
    reader.readAsDataURL(archivo.files[0]);
};

window.verHistorial = (fol) => {
    document.getElementById("histFolio").textContent = fol;
    const histBody = document.getElementById("histBody");
    histBody.innerHTML = "";
    const filtrados = globalSeguimientos.filter(x => x.folio === fol);
    filtrados.sort((a,b) => new Date(b.fechaRegistro) - new Date(a.fechaRegistro));
    
    filtrados.forEach(h => {
        histBody.innerHTML += `
            <tr>
                <td><small>${h.fechaRegistro}</small></td>
                <td><span class="badge bg-light text-dark border">${h.status}</span></td>
                <td>${h.descripcion || '-'}</td>
                <td><small>${h.comentarios || '-'}</small></td>
            </tr>`;
    });
    new bootstrap.Modal(document.getElementById('modalHistorial')).show();
};

window.irSeguimiento = f => { 
    if(esSoporteJR) {
        alert("Acceso denegado: El puesto Soporte Técnico JR solo puede visualizar.");
        return;
    }
    location.href = "seguimiento.html?folio=" + encodeURIComponent(f); 
};

window.eliminar = id => confirm("¿Eliminar solicitud?") && remove(ref(database,"tecnologia/"+id));
window.cerrarSesion = ()=>{localStorage.clear();location.href="index.html";}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
