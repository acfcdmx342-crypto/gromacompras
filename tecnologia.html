<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Tecnología</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f2f4f7; }
.card { border-radius:20px; }
.action-btn { cursor:pointer; font-size:22px; margin-right:10px; }
.action-disabled {
    color:#adb5bd;
    cursor:not-allowed;
}
.table thead { background:#0d6efd; color:white; }
.btn-rounded { border-radius:50px; }
#btnRegresar {
    cursor:pointer;
    font-size:40px;
    position:fixed;
    top:20px;
    left:20px;
    color:#0d6efd;
}
td:last-child { display:flex; justify-content:center; }
.btn-delete {
    float:right;
    cursor:pointer;
    color:#dc3545;
}
</style>
</head>

<body class="p-4">

<span id="btnRegresar" onclick="irLogin()">🔙</span>

<div class="container">
<h2 class="text-center mb-4 fw-bold">Solicitud de Tecnología</h2>

<!-- ===== FORMULARIO ===== -->
<div class="card shadow p-4 mb-4">
<h5 class="fw-bold mb-3">Registrar Solicitud</h5>

<form id="formTec" class="row g-3">
<div class="col-md-3">
<label class="fw-bold">Folio</label>
<input id="folio" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Empresa</label>
<input id="empresa" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Zona</label>
<input id="zona" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Soporte Zona</label>
<input id="soporte" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Sucursal</label>
<input id="sucursal" class="form-control text-uppercase">
</div>

<div class="col-md-6">
<label class="fw-bold">Requisición</label>
<input id="archivo" type="file" class="form-control">
</div>

<div class="col-12">
<button type="button" class="btn btn-primary btn-rounded" onclick="guardarSolicitud()">
Guardar Solicitud
</button>
</div>
</form>
</div>

<!-- ===== TABLA ===== -->
<div class="card shadow p-4">
<h5 class="fw-bold mb-3">Registros de Solicitudes</h5>

<table class="table table-bordered table-striped">
<thead>
<tr>
<th>Folio</th>
<th>Empresa</th>
<th>Zona</th>
<th>Soporte</th>
<th>Sucursal</th>
<th>Archivo</th>
<th>Status</th>
<th>Fecha</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaTecBody"></tbody>
</table>
</div>
</div>

<!-- ===== MODAL HISTORIAL ===== -->
<div class="modal fade" id="modalHistorial" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">📜 Historial de Seguimiento</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="card p-3 mb-3">
          <h6 class="fw-bold text-primary">➕ Agregar seguimiento</h6>

          <select id="nuevoStatus" class="form-select mb-2">
            <option value="">Seleccione status</option>
            <option>ENVIADO A COMPRAS</option>
            <option>ENVIADO A ZONA</option>
            <option>PENDIENTE POR AUTORIZAR</option>
            <option>EN SISTEMAS</option>
          </select>

          <input id="nuevaObs" class="form-control mb-2 text-uppercase"
                 placeholder="Observaciones">

          <button class="btn btn-primary btn-sm" onclick="agregarSeguimiento()">
            Guardar seguimiento
          </button>
        </div>

        <ul class="list-group" id="listaHistorial"></ul>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>

    </div>
  </div>
</div>

<script type="module">
import { database, ref, push, set, get, onValue, remove } from "./firebase.js";

const solicitudesRef = ref(database,"tecnologia");
const seguimientoRef = ref(database,"seguimiento");

let folioActual = "";
let foliosConSeguimiento = new Set();

/* ===== DETECTAR FOLIOS CON SEGUIMIENTO ===== */
onValue(seguimientoRef,snap=>{
    foliosConSeguimiento.clear();
    snap.forEach(c=>{
        foliosConSeguimiento.add(c.val().folio);
    });
});

/* ===== GENERAR FOLIO ===== */
async function generarFolio(emp, zon){
    const key = `TEC_${emp}_${zon}`.toUpperCase();
    const r = ref(database,"folios/"+key);
    const s = await get(r);
    let n = s.exists() ? s.val()+1 : 1;
    await set(r,n);
    return `TEC-${emp}-${zon}-${n.toString().padStart(4,"0")}`;
}

/* ===== GUARDAR SOLICITUD ===== */
window.guardarSolicitud = async ()=>{
    if(!empresa.value||!zona.value||!soporte.value||!sucursal.value||!archivo.files[0]){
        alert("Campos obligatorios");
        return;
    }

    const fol = await generarFolio(empresa.value,zona.value);
    folio.value = fol;

    const reader = new FileReader();
    reader.onload = async ()=>{
        await push(solicitudesRef,{
            folio: fol,
            empresa: empresa.value.toUpperCase(),
            zona: zona.value.toUpperCase(),
            soporte: soporte.value.toUpperCase(),
            sucursal: sucursal.value.toUpperCase(),
            archivoData: reader.result,
            archivoNombre: archivo.files[0].name,
            status: "Pendiente",
            fechaEnvio: new Date().toLocaleString()
        });
        formTec.reset();
        folio.value="";
    };
    reader.readAsDataURL(archivo.files[0]);
};

/* ===== LISTAR SOLICITUDES ===== */
onValue(solicitudesRef,snap=>{
    tablaTecBody.innerHTML="";
    snap.forEach(c=>{
        const s = c.val();
        const tieneSeguimiento = foliosConSeguimiento.has(s.folio);

        tablaTecBody.innerHTML+=`
        <tr>
          <td>${s.folio}</td>
          <td>${s.empresa}</td>
          <td>${s.zona}</td>
          <td>${s.soporte}</td>
          <td>${s.sucursal}</td>
          <td><a class="btn btn-success btn-sm" download="${s.archivoNombre}" href="${s.archivoData}">📥</a></td>
          <td class="bg-success text-white">${s.status}</td>
          <td>${s.fechaEnvio}</td>
          <td>
            ${
              tieneSeguimiento
              ? `<span class="action-btn action-disabled" title="Seguimiento ya registrado">📋</span>`
              : `<span class="action-btn" onclick="irSeguimiento('${s.folio}')">📋</span>`
            }
            <span class="action-btn" onclick="verHistorial('${s.folio}')">📜</span>
            <span class="action-btn" onclick="eliminar('${c.key}')">🗑️</span>
          </td>
        </tr>`;
    });
});

/* ===== HISTORIAL ===== */
window.verHistorial = async (folio)=>{
    folioActual = folio;
    listaHistorial.innerHTML = "";

    const snap = await get(seguimientoRef);
    let existe = false;

    snap.forEach(h=>{
        const d = h.val();
        if(d.folio === folio){
            existe = true;
            listaHistorial.innerHTML+=`
              <li class="list-group-item">
                <span class="btn-delete" onclick="eliminarSeguimiento('${h.key}')">🗑️</span>
                <strong>${d.status}</strong><br>
                ${d.observaciones || ""}<br>
                <small>${d.fechaRegistro}</small>
              </li>`;
        }
    });

    if(!existe){
        listaHistorial.innerHTML = `
          <li class="list-group-item text-center text-muted">
            Sin historial
          </li>`;
    }

    new bootstrap.Modal(modalHistorial).show();
};

window.agregarSeguimiento = async ()=>{
    if(!nuevoStatus.value) return alert("Seleccione status");

    await push(seguimientoRef,{
        folio: folioActual,
        status: nuevoStatus.value,
        observaciones: nuevaObs.value.toUpperCase(),
        fechaRegistro: new Date().toLocaleString()
    });

    nuevoStatus.value="";
    nuevaObs.value="";
    verHistorial(folioActual);
};

window.eliminarSeguimiento = async (id)=>{
    if(confirm("¿Eliminar seguimiento?")){
        await remove(ref(database,"seguimiento/"+id));
        verHistorial(folioActual);
    }
};

window.eliminar = id=>{
    if(confirm("¿Eliminar solicitud?")){
        remove(ref(database,"tecnologia/"+id));
    }
};

window.irSeguimiento = folio=>{
    location.href="seguimiento.html?folio="+encodeURIComponent(folio);
};

window.irLogin = ()=>{
    localStorage.clear();
    location.href="index.html";
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
