<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tecnología</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f2f4f7; }
        .card { border-radius:20px; }
        .action-btn { cursor:pointer; font-size:22px; }
        .action-disabled { color:#adb5bd; cursor:not-allowed; }
        .table thead { background:#0d6efd; color:white; }
        .acciones{ display:flex; justify-content:center; gap:10px; }
    </style>
</head>
<body class="p-4">

<script>
    const sesion = JSON.parse(localStorage.getItem("usuarioLogueado"));
    if (!sesion) {
        alert("Sesión no válida");
        location.href = "index.html";
    }
    const usuarioSesion = sesion.usuario;
    const nombreSesion = sesion.nombre;
    const puestoSesion = sesion.puesto;
    const puestosPermitidos = ["GERENTE DE SISTEMAS", "JEFE DE INFRAESTRUCTURA Y SOPORTE TECNICO", "COORDINADOR DE SOPORTE TECNICO", "SOPORTE TECNICO", "BECARIO"];
</script>

<div class="container">
    <div class="text-end mb-3 fw-bold text-primary">
        👤 Usuario: <span id="usuarioActivo"></span>
    </div>
    <h2 class="text-center mb-4 fw-bold">Solicitud de Tecnología</h2>

    <div class="card shadow p-4 mb-4">
        <form id="formTec" class="row g-3">
            <div class="col-md-3"><label class="fw-bold">Folio (Auto)</label><input id="folio" class="form-control" readonly placeholder="TEC-XXX"></div>
            <div class="col-md-3"><label class="fw-bold">Empresa</label><input id="empresa" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="fw-bold">Zona</label><input id="zona" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="fw-bold">Soporte Zona</label><input id="soporte" class="form-control text-uppercase" readonly></div>
            <div class="col-md-3"><label class="fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase"></div>
            <div class="col-md-6"><label class="fw-bold">Requisición (PDF/Img)</label><input id="archivo" type="file" class="form-control"></div>
            <div class="col-12"><button type="button" class="btn btn-primary" onclick="guardarSolicitud()">Guardar Solicitud</button></div>
        </form>
    </div>

    <div class="card shadow p-4">
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Empresa</th>
                    <th>Zona</th>
                    <th>Soporte</th>
                    <th>Sucursal</th>
                    <th>Archivo</th>
                    <th>Status</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaTecBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { database, ref, push, set, get, onValue, remove } from "./firebase.js";

document.getElementById("usuarioActivo").textContent = `${nombreSesion} (${puestoSesion})`;
document.getElementById("soporte").value = nombreSesion;

const solicitudesRef = ref(database, "tecnologia");
const seguimientoRef = ref(database, "seguimiento");

let foliosConSeguimiento = new Set();

onValue(seguimientoRef, snap => {
    foliosConSeguimiento.clear();
    snap.forEach(c => foliosConSeguimiento.add(c.val().folio));
    actualizarTabla(); // Refrescar tabla cuando cambie el seguimiento
});

async function generarFolio(emp, zon) {
    const key = `TEC_${emp}_${zon}`.toUpperCase();
    const r = ref(database, "folios/" + key);
    const s = await get(r);
    let n = s.exists() ? s.val() + 1 : 1;
    await set(r, n);
    return `TEC-${emp}-${zon}-${n.toString().padStart(4, "0")}`;
}

window.guardarSolicitud = async () => {
    const emp = document.getElementById("empresa").value;
    const zon = document.getElementById("zona").value;
    const suc = document.getElementById("sucursal").value;
    const arch = document.getElementById("archivo").files[0];

    if (!emp || !zon || !suc || !arch) {
        alert("Campos obligatorios");
        return;
    }

    const fol = await generarFolio(emp, zon);
    const reader = new FileReader();
    reader.onload = async () => {
        await push(solicitudesRef, {
            folio: fol,
            empresa: emp.toUpperCase(),
            zona: zon.toUpperCase(),
            soporte: nombreSesion,
            sucursal: suc.toUpperCase(),
            archivoData: reader.result,
            archivoNombre: arch.name,
            status: "Pendiente",
            fechaEnvio: new Date().toLocaleString(),
            usuario: usuarioSesion
        });
        alert("Registro exitoso");
        location.reload();
    };
    reader.readAsDataURL(arch);
};

function actualizarTabla() {
    onValue(solicitudesRef, snap => {
        const tbody = document.getElementById("tablaTecBody");
        tbody.innerHTML = "";
        snap.forEach(c => {
            const s = c.val();
            const tieneSeg = foliosConSeguimiento.has(s.folio);
            if (puestosPermitidos.includes(puestoSesion) || s.usuario === usuarioSesion) {
                tbody.innerHTML += `
                <tr>
                    <td>${s.folio}</td>
                    <td>${s.empresa}</td>
                    <td>${s.zona}</td>
                    <td>${s.soporte}</td>
                    <td>${s.sucursal}</td>
                    <td><a class="btn btn-success btn-sm" download="${s.archivoNombre}" href="${s.archivoData}">📥</a></td>
                    <td class="bg-success text-white">${s.status}</td>
                    <td>
                        <div class="acciones">
                            ${tieneSeg ? `<span class="action-btn action-disabled">📋</span>` : `<span class="action-btn" onclick="irSeguimiento('${s.folio}')">📋</span>`}
                            ${tieneSeg ? `<span class="action-btn" onclick="verHistorial('${s.folio}')">📜</span>` : `<span class="action-btn action-disabled">📜</span>`}
                            ${puestosPermitidos.includes(puestoSesion) ? `<span class="action-btn" onclick="eliminar('${c.key}')">🗑️</span>` : ``}
                        </div>
                    </td>
                </tr>`;
            }
        });
    }, { onlyOnce: true });
}

window.irSeguimiento = f => {
    location.href = "seguimiento.html?folio=" + encodeURIComponent(f);
};

window.eliminar = id => confirm("¿Eliminar solicitud?") && remove(ref(database, "tecnologia/" + id)).then(()=>location.reload());
window.cerrarSesion = () => { localStorage.clear(); location.href = "index.html"; }

actualizarTabla();
</script>
</body>
</html>
