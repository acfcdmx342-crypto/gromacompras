<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Tecnología</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f2f4f7; }
.card { border-radius:20px; }
.action-btn { cursor:pointer; font-size:22px; margin-right:10px; }
.table thead { background:#0d6efd; color:white; }
</style>
</head>

<body class="p-4">

<div class="container">
<h2 class="text-center mb-4 fw-bold">Solicitud de Tecnología</h2>

<div class="card shadow p-4">
<table class="table table-bordered table-striped">
<thead>
<tr>
<th>Folio</th>
<th>Empresa</th>
<th>Zona</th>
<th>Soporte</th>
<th>Sucursal</th>
<th>Status</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaTecBody"></tbody>
</table>
</div>
</div>

<!-- MODAL HISTORIAL -->
<div class="modal fade" id="modalHistorial" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">📜 Historial de Seguimiento</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <ul class="list-group" id="listaHistorial"></ul>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { database, ref, onValue, get } from "./firebase.js";

onValue(ref(database,"tecnologia"), snap=>{
  tablaTecBody.innerHTML="";
  snap.forEach(c=>{
    const s=c.val();
    tablaTecBody.innerHTML+=`
    <tr>
      <td>${s.folio}</td>
      <td>${s.empresa}</td>
      <td>${s.zona}</td>
      <td>${s.soporte}</td>
      <td>${s.sucursal}</td>
      <td>${s.status || "Pendiente"}</td>
      <td>
        <span class="action-btn" onclick="verHistorial('${s.folio}')">📜</span>
      </td>
    </tr>`;
  });
});

window.verHistorial = async folio=>{
  const lista=document.getElementById("listaHistorial");
  lista.innerHTML="";

  const snap = await get(ref(database,"historialSeguimiento/"+folio));

  if(!snap.exists()){
    lista.innerHTML=`<li class="list-group-item text-center text-muted">Sin historial</li>`;
  }else{
    snap.forEach(h=>{
      const d=h.val();
      lista.innerHTML+=`
      <li class="list-group-item">
        <strong>${d.status}</strong><br>
        ${d.observaciones || ""}<br>
        <small class="text-muted">${d.fecha} · ${d.usuario}</small>
      </li>`;
    });
  }

  new bootstrap.Modal(document.getElementById("modalHistorial")).show();
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
