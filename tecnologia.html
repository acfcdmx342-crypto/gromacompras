<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Tecnología</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background:#f2f4f7; }
    .card { border-radius:20px; }
    .action-btn { cursor:pointer; font-size:22px; transition: 0.2s; }
    .action-btn:hover { transform: scale(1.2); }
    .action-disabled { color:#adb5bd; cursor:not-allowed; opacity: 0.5; }
    .table thead { background:#0d6efd; color:white; }
    .btn-rounded { border-radius:50px; }
    #btnRegresar { cursor:pointer; font-size:40px; position:fixed; top:20px; left:20px; color:#0d6efd; z-index: 1000; }
    .acciones { display:flex; justify-content:center; gap:10px; }
    /* Colores dinámicos para estatus */
    .st-compras { background-color: #0d6efd !important; color: white; }
    .st-zona { background-color: #ffc107 !important; color: black; }
    .st-pendiente { background-color: #dc3545 !important; color: white; }
    .st-sistemas { background-color: #198754 !important; color: white; }
</style>
</head>
<body class="p-4">

<script>
    const sesion = JSON.parse(localStorage.getItem("usuarioLogueado"));
    if (!sesion) { alert("Sesión no válida"); location.href = "index.html"; }
    const usuarioSesion = sesion.usuario;
    const nombreSesion = sesion.nombre;
    const puestoSesion = sesion.puesto;
    const puestosPermitidos = ["GERENTE DE SISTEMAS", "JEFE DE INFRAESTRUCTURA Y SOPORTE TECNICO", "COORDINADOR DE SOPORTE TECNICO", "SOPORTE TECNICO", "BECARIO"];
</script>

<span id="btnRegresar" onclick="cerrarSesion()">🔙</span>

<div class="container">
    <div class="text-end mb-3 fw-bold text-primary">👤 Usuario: <span id="usuarioActivo"></span></div>
    <h2 class="text-center mb-4 fw-bold">Solicitud de Tecnología</h2>

    <div class="card shadow p-4 mb-4">
        <h5 class="fw-bold mb-3">Registrar Solicitud</h5>
        <form id="formTec" class="row g-3">
            <div class="col-md-3"><label class="fw-bold">Folio</label><input id="folio" class="form-control" readonly></div>
            <div class="col-md-3"><label class="fw-bold">Empresa</label><input id="empresa" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="fw-bold">Zona</label><input id="zona" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="fw-bold">Soporte Zona</label><input id="soporte" class="form-control text-uppercase" readonly></div>
            <div class="col-md-3"><label class="fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase"></div>
            <div class="col-md-6"><label class="fw-bold">Requisición</label><input id="archivo" type="file" class="form-control"></div>
            <div class="col-12"><button type="button" class="btn btn-primary btn-rounded" onclick="guardarSolicitud()">Guardar Solicitud</button></div>
        </form>
    </div>

    <div class="card shadow p-4">
        <h5 class="fw-bold mb-3">Registros de Solicitudes</h5>
        <table class="table table-bordered table-striped align-middle text-center">
            <thead>
                <tr>
                    <th>Folio</th><th>Empresa</th><th>Zona</th><th>Soporte</th><th>Sucursal</th><th>Archivo</th><th>Status Actual</th><th>Fecha</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaTecBody"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="modalHistorial" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title">Historial de Seguimiento: <span id="histFolio"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <table class="table table-sm table-hover">
                    <thead><tr><th>Fecha</th><th>Estatus</th><th>Descripción</th><th>Comentarios</th></tr></thead>
                    <tbody id="histBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { database, ref, push, set, get, onValue, remove } from "./firebase.js";

usuarioActivo.textContent = `${nombreSesion} (${puestoSesion})`;
soporte.value = nombreSesion;

const solicitudesRef = ref(database,"tecnologia");
const seguimientoRef = ref(database,"seguimiento");

let globalSeguimientos = [];

// Escuchar cambios en seguimientos para tener data fresca
onValue(seguimientoRef, snap => {
    globalSeguimientos = [];
    snap.forEach(c => { globalSeguimientos.push(c.val()); });
    renderTable(); // Re-renderizar tabla principal cuando hay nuevos seguimientos
});

async function generarFolio(emp, zon){
    const key = `TEC_${emp}_${zon}`.toUpperCase();
    const r = ref(database,"folios/"+key);
    const s = await get(r);
    let n = s.exists() ? s.val()+1 : 1;
    await set(r,n);
    return `TEC-${emp}-${zon}-${n.toString().padStart(4,"0")}`;
}

window.guardarSolicitud = async ()=>{
    if(!empresa.value||!zona.value||!sucursal.value||!archivo.files[0]){
        alert("Campos obligatorios"); return;
    }
    const fol = await generarFolio(empresa.value,zona.value);
    const reader = new FileReader();
    reader.onload = async ()=>{
        await push(solicitudesRef,{
            folio: fol, empresa: empresa.value.toUpperCase(), zona: zona.value.toUpperCase(),
            soporte: nombreSesion, sucursal: sucursal.value.toUpperCase(),
            archivoData: reader.result, archivoNombre: archivo.files[0].name,
            status:"PENDIENTE", fechaEnvio:new Date().toLocaleString(), usuario:usuarioSesion
        });
        formTec.reset(); soporte.value = nombreSesion;
    };
    reader.readAsDataURL(archivo.files[0]);
};

function renderTable() {
    onValue(solicitudesRef, snap => {
        tablaTecBody.innerHTML="";
        snap.forEach(c => {
            const s = c.val();
            // Buscar seguimientos de este folio
            const segsDelFolio = globalSeguimientos.filter(x => x.folio === s.folio);
            const tieneSeg = segsDelFolio.length > 0;
            
            // Determinar último estatus
            let statusMostrar = s.status;
            let claseColor = "bg-secondary";

            if(tieneSeg) {
                // Ordenar por fecha de registro (asumiendo formato local)
                segsDelFolio.sort((a,b) => new Date(b.fechaRegistro) - new Date(a.fechaRegistro));
                statusMostrar = segsDelFolio[0].status;
                
                if(statusMostrar === "ENVIADO A COMPRAS") claseColor = "st-compras";
                else if(statusMostrar === "ENVIADO A ZONA") claseColor = "st-zona";
                else if(statusMostrar === "PENDIENTE POR AUTORIZAR") claseColor = "st-pendiente";
                else if(statusMostrar === "EN SISTEMAS") claseColor = "st-sistemas";
            }

            if(puestosPermitidos.includes(puestoSesion)||s.usuario===usuarioSesion){
                tablaTecBody.innerHTML+=`
                <tr>
                    <td>${s.folio}</td><td>${s.empresa}</td><td>${s.zona}</td><td>${s.soporte}</td><td>${s.sucursal}</td>
                    <td><a class="btn btn-success btn-sm" download="${s.archivoNombre}" href="${s.archivoData}">📥</a></td>
                    <td><span class="badge ${claseColor} p-2 w-100">${statusMostrar}</span></td>
                    <td>${s.fechaEnvio}</td>
                    <td>
                        <div class="acciones">
                            <span class="action-btn" onclick="irSeguimiento('${s.folio}')" title="Nuevo Seguimiento">📋</span>
                            <span class="action-btn ${tieneSeg ? '' : 'action-disabled'}" 
                                  onclick="${tieneSeg ? `verHistorial('${s.folio}')` : ''}" title="Ver Historial">📜</span>
                            ${puestosPermitidos.includes(puestoSesion) ? `<span class="action-btn" onclick="eliminar('${c.key}')">🗑️</span>` : ``}
                        </div>
                    </td>
                </tr>`;
            }
        });
    }, { onlyOnce: true });
}

window.verHistorial = (fol) => {
    document.getElementById("histFolio").textContent = fol;
    const histBody = document.getElementById("histBody");
    histBody.innerHTML = "";
    
    const filtrados = globalSeguimientos.filter(x => x.folio === fol);
    filtrados.sort((a,b) => new Date(b.fechaRegistro) - new Date(a.fechaRegistro));
    
    filtrados.forEach(h => {
        histBody.innerHTML += `
            <tr>
                <td><small>${h.fechaRegistro}</small></td>
                <td><span class="badge bg-light text-dark border">${h.status}</span></td>
                <td>${h.descripcion || '-'}</td>
                <td><small>${h.comentarios || '-'}</small></td>
            </tr>`;
    });
    new bootstrap.Modal(document.getElementById('modalHistorial')).show();
};

window.irSeguimiento = f => { location.href = "seguimiento.html?folio=" + encodeURIComponent(f); };
window.eliminar = id => confirm("¿Eliminar solicitud?") && remove(ref(database,"tecnologia/"+id));
window.cerrarSesion = ()=>{localStorage.clear();location.href="index.html";}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
