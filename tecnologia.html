<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tecnología</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background:#f2f4f7; }
        .card { border-radius:20px; }
        .action-btn { cursor:pointer; font-size:22px; transition: 0.2s; display: inline-block; }
        .action-btn:hover { transform: scale(1.2); }
        .action-disabled { color:#adb5bd; cursor:not-allowed; opacity: 0.5; filter: grayscale(1); }
        .table thead { background:#0d6efd; color:white; }
        .btn-rounded { border-radius:50px; }
        .user-info-box { background: white; padding: 10px 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; }
        .acciones { display:flex; justify-content:center; gap:10px; }
        .dropdown-menu { border-radius: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 10px; }
        .dropdown-item { border-radius: 8px; margin-bottom: 2px; font-weight: 500; }
        
        /* Colores status */
        .st-compras { background-color: #0d6efd !important; color: white; } 
        .st-zona { background-color: #ffc107 !important; color: black; }    
        .st-pendiente { background-color: #dc3545 !important; color: white; } 
        .st-sistemas { background-color: #198754 !important; color: white; }  
        .st-default { background-color: #6c757d !important; color: white; }   
        .tiempo-badge { font-size: 0.75rem; font-weight: bold; color: #555; }
    </style>
</head>
<body class="p-4">

<script>
    const sesionRaw = localStorage.getItem("usuarioLogueado");
    if (!sesionRaw) {
        alert("Sesión no válida");
        location.href = "index.html";
    } else {
        const sesion = JSON.parse(sesionRaw);
        window.usuarioSesion = sesion.usuario;
        window.nombreSesion = sesion.nombre;
        window.puestoSesion = (sesion.puesto || "").toUpperCase();

        const puestosPrivilegiados = [
            "GERENTE DE SISTEMAS", 
            "JEFE DE INFRAESTRUCTURA Y SOPORTE TECNICO", 
            "COORDINADOR DE SOPORTE TECNICO", 
            "SOPORTE TECNICO", 
            "SOPORTE TECNICO SR",
            "BECARIO DE SISTEMAS",
            "BECARIO"
        ];
        window.esSoporteJR = window.puestoSesion === "SOPORTE TECNICO JR";
        window.puedeVerBase = puestosPrivilegiados.includes(window.puestoSesion);
    }
</script>

<div class="container">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div class="user-info-box border-start border-primary border-4">
            <div class="fw-bold text-primary">👤 <span id="usuarioActivo"></span></div>
            <div class="text-muted small">Puesto: <span id="puestoActivo"></span></div>
        </div>
        
        <div class="dropdown">
            <button class="btn btn-primary btn-rounded dropdown-toggle fw-bold px-4 shadow-sm" type="button" data-bs-toggle="dropdown">
                ☰ Menú
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="historial_compras.html">📜 Ver Historial</a></li>
                <li id="liBase"></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">🚪 Cerrar Sesión</a></li>
            </ul>
        </div>
    </div>

    <h2 class="text-center fw-bold mb-4">Solicitud de Tecnología</h2>

    <div class="card shadow p-4 mb-4 border-0">
        <h5 class="fw-bold mb-3 border-bottom pb-2 text-secondary">Registrar Solicitud</h5>
        <form id="formTec" class="row g-3">
            <div class="col-md-3"><label class="small fw-bold">Empresa</label><input id="empresa" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="small fw-bold">Zona</label><input id="zona" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="small fw-bold">Soporte Zona</label><input id="soporte" class="form-control text-uppercase" readonly></div>
            <div class="col-md-3"><label class="small fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase"></div>
            <div class="col-md-6"><label class="small fw-bold">Requisición</label><input id="archivo" type="file" class="form-control"></div>
            <div class="col-12 mt-4">
                <button type="button" class="btn btn-primary btn-rounded px-5 shadow" onclick="guardarSolicitud()">💾 Guardar Solicitud</button>
            </div>
        </form>
    </div>

    <div class="card shadow p-4 border-0">
        <h5 class="fw-bold mb-3 border-bottom pb-2 text-secondary">Solicitudes en Proceso</h5>
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center bg-white">
                <thead class="table-primary">
                    <tr><th>Folio</th><th>Empresa</th><th>Zona</th><th>Soporte</th><th>Sucursal</th><th>Archivo</th><th>Status</th><th>Tiempo</th><th>Fecha</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaTecBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { database, ref, push, set, get, onValue, update } from "./firebase.js";

    document.getElementById("usuarioActivo").textContent = window.nombreSesion;
    document.getElementById("puestoActivo").textContent = window.puestoSesion;
    document.getElementById("soporte").value = window.nombreSesion;

    if (window.puedeVerBase) {
        document.getElementById("liBase").innerHTML = '<a class="dropdown-item" href="base.html">🏠 Página Base (Usuarios)</a>';
    }

    const solicitudesRef = ref(database, "tecnologia");
    const seguimientoRef = ref(database, "seguimiento");

    let globalSeguimientos = [];
    onValue(seguimientoRef, snap => {
        globalSeguimientos = [];
        snap.forEach(c => { globalSeguimientos.push({ ...c.val(), id: c.key }); });
        renderTable(); 
    });

    function renderTable() {
        onValue(solicitudesRef, snap => {
            const tbody = document.getElementById("tablaTecBody");
            tbody.innerHTML = "";
            
            snap.forEach(c => {
                const s = c.val();
                const idKey = c.key;

                const segsDelFolio = globalSeguimientos
                    .filter(x => x.folio === s.folio)
                    .sort((a,b) => new Date(b.fechaRegistro) - new Date(a.fechaRegistro));
                
                const statusActual = segsDelFolio.length > 0 ? segsDelFolio[0].status : (s.status || "PENDIENTE");

                if (s.eliminado || statusActual === "CONFIRMADO") return;

                const puedeVerTodo = window.puedeVerBase;
                const esDueno = s.usuario === window.usuarioSesion;

                if(puedeVerTodo || esDueno) {
                    let claseColor = "st-default";
                    const colores = {"ENVIADO A COMPRAS":"st-compras", "ENVIADO A ZONA":"st-zona", "PENDIENTE POR AUTORIZAR":"st-pendiente", "EN SISTEMAS":"st-sistemas"};
                    claseColor = colores[statusActual] || "st-default";

                    tbody.innerHTML += `
                        <tr>
                            <td><small class="fw-bold">${s.folio}</small></td>
                            <td>${s.empresa}</td>
                            <td>${s.zona}</td>
                            <td>${s.soporte}</td>
                            <td>${s.sucursal}</td>
                            <td><a class="btn btn-success btn-sm" download="${s.archivoNombre}" href="${s.archivoData}">📥</a></td>
                            <td><span class="badge ${claseColor} p-2 w-100">${statusActual}</span></td>
                            <td class="tiempo-badge">${calcularTranscurrido(s.fechaISO || s.fechaEnvio)}</td>
                            <td><small>${s.fechaEnvio}</small></td>
                            <td>
                                <div class="acciones">
                                    <span class="action-btn ${window.esSoporteJR ? 'action-disabled' : ''}" onclick="${window.esSoporteJR ? '' : `window.irSeguimiento('${s.folio}')`}">📋</span>
                                    ${window.esSoporteJR && statusActual === "ENVIADO A ZONA" ? `<span class="action-btn text-success" onclick="window.confirmarEntrega('${s.folio}')">✅</span>` : ''}
                                    ${puedeVerTodo ? `<span class="action-btn" onclick="window.eliminarSolicitud('${idKey}')">🗑️</span>` : ``}
                                </div>
                            </td>
                        </tr>`;
                }
            });
        });
    }

    function calcularTranscurrido(f) {
        const d = new Date(f); if (isNaN(d)) return "N/A";
        const dif = new Date() - d;
        const dias = Math.floor(dif / 86400000);
        const horas = Math.floor((dif / 3600000) % 24);
        return dias > 0 ? `${dias}d ${horas}h` : `${horas}h`;
    }

    window.cerrarSesion = () => { localStorage.clear(); location.href = "index.html"; };
    window.irSeguimiento = f => location.href = "seguimiento.html?folio=" + encodeURIComponent(f);

    window.eliminarSolicitud = async (id) => {
        const { value: motivo } = await Swal.fire({
            title: 'Motivo de eliminación',
            input: 'textarea',
            inputPlaceholder: 'Escriba por qué elimina este registro...',
            showCancelButton: true,
            inputValidator: (value) => { if (!value) return '¡El motivo es obligatorio!' }
        });
        if (motivo) {
            await update(ref(database, `tecnologia/${id}`), { eliminado: true, motivoEliminacion: motivo });
            Swal.fire('Eliminado', 'Registro movido al historial.', 'success');
        }
    };

    window.confirmarEntrega = async (fol) => {
        const { value: formValues } = await Swal.fire({
            title: 'Confirmar Entrega',
            html: '<input type="file" id="swal-foto" class="form-control mb-2" accept="image/*"><textarea id="swal-comentario" class="form-control" placeholder="Comentario..."></textarea>',
            preConfirm: () => {
                const f = document.getElementById('swal-foto').files[0];
                const c = document.getElementById('swal-comentario').value;
                if (!f || !c) return Swal.showValidationMessage('Foto y comentario obligatorios');
                return { f, c };
            }
        });
        if (formValues) {
            const reader = new FileReader();
            reader.onload = async () => {
                await push(seguimientoRef, { 
                    folio: fol, status: "CONFIRMADO", comentarios: formValues.c, 
                    fotoEvidencia: reader.result, fechaRegistro: new Date().toLocaleString(), 
                    usuario: window.usuarioSesion 
                });
                Swal.fire('Confirmado', 'El folio se ha cerrado.', 'success');
            };
            reader.readAsDataURL(formValues.f);
        }
    };

    window.guardarSolicitud = async () => {
        const emp = document.getElementById("empresa").value;
        const zon = document.getElementById("zona").value;
        const suc = document.getElementById("sucursal").value;
        const arc = document.getElementById("archivo").files[0];

        if (!emp || !zon || !suc || !arc) return Swal.fire("Atención", "Faltan campos obligatorios", "warning");

        const key = `TEC_${emp}_${zon}`.toUpperCase();
        const rFolio = ref(database, "folios/" + key);
        const sFolio = await get(rFolio);
        let n = sFolio.exists() ? sFolio.val() + 1 : 1;
        await set(rFolio, n);
        const fol = `TEC-${emp}-${zon}-${n.toString().padStart(4, "0")}`.toUpperCase();

        const reader = new FileReader();
        reader.onload = async () => {
            await push(solicitudesRef, {
                folio: fol, empresa: emp.toUpperCase(), zona: zon.toUpperCase(),
                soporte: window.nombreSesion, sucursal: suc.toUpperCase(),
                archivoData: reader.result, archivoNombre: arc.name,
                status: "PENDIENTE", fechaEnvio: new Date().toLocaleString(), 
                fechaISO: new Date().toISOString(),
                usuario: window.usuarioSesion, eliminado: false
            });
            document.getElementById("formTec").reset();
            Swal.fire("Éxito", "Solicitud guardada con folio: " + fol, "success");
        };
        reader.readAsDataURL(arc);
    };
</script>
</body>
</html>
