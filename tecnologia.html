<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tecnología</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background:#f2f4f7; }
        .card { border-radius:20px; border: none; }
        .action-btn { cursor:pointer; font-size:22px; transition: 0.2s; display: inline-block; margin: 0 5px; }
        .action-btn:hover { transform: scale(1.2); }
        .table thead { background:#0d6efd; color:white; }
        /* El loader ahora inicia oculto por seguridad o se maneja estrictamente por JS */
        #loader { 
            display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; 
            align-items: center; flex-direction: column; 
        }
        .loader-logo { animation: pulse 1.5s infinite; width: 250px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="p-4">

<div id="loader">
    <img src="https://gruporoma.com/wp-content/uploads/2023/06/cropped-cropped-procomex-pachuca-logo-350-%C3%97-100-px-1.png" class="loader-logo">
    <div class="mt-3">
        <div class="spinner-border text-primary" role="status"></div>
        <span class="ms-2 fw-bold">Cargando sistema...</span>
    </div>
</div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="p-3 bg-white rounded shadow-sm border-start border-primary border-4">
            <div class="fw-bold text-primary">👤 <span id="usuarioActivo"></span></div>
            <div class="text-muted small">Puesto: <span id="puestoActivo"></span></div>
        </div>
        <div>
            <a href="historial.html" class="btn btn-outline-dark fw-bold">📜 Historial</a>
            <button onclick="window.cerrarSesion()" class="btn btn-danger fw-bold">Cerrar Sesión</button>
        </div>
    </div>

    <div class="card shadow p-4 mb-4">
        <h5 class="fw-bold mb-3 border-bottom pb-2">Nueva Solicitud</h5>
        <form id="formTec" class="row g-3">
            <div class="col-md-4"><label class="small fw-bold">Empresa</label><input id="empresa" class="form-control text-uppercase"></div>
            <div class="col-md-4"><label class="small fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase"></div>
            <div class="col-md-4"><label class="small fw-bold">Requisición (Archivo)</label><input id="archivo" type="file" class="form-control"></div>
            <div class="col-12 mt-3"><button type="button" class="btn btn-primary w-100 fw-bold" onclick="window.guardarSolicitud()">💾 GUARDAR</button></div>
        </form>
    </div>

    <div class="card shadow p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
                <thead><tr><th>Folio</th><th>Empresa</th><th>Sucursal</th><th>Status</th><th>Acciones</th></tr></thead>
                <tbody id="tablaTecBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { database, ref, push, set, get, onValue, remove } from "./firebase.js";

    // Manejo de Sesión
    const sesionRaw = localStorage.getItem("usuarioLogueado");
    if (!sesionRaw) { location.href = "index.html"; }
    const sesion = JSON.parse(sesionRaw);
    document.getElementById("usuarioActivo").innerText = sesion.nombre;
    document.getElementById("puestoActivo").innerText = sesion.puesto;

    // Funciones Globales
    window.mostrarCargando = () => document.getElementById("loader").style.display = "flex";
    window.ocultarCargando = () => document.getElementById("loader").style.display = "none";
    window.cerrarSesion = () => { localStorage.clear(); location.href = "index.html"; };

    // CARGA DE DATOS (Aquí es donde se quita el loader)
    onValue(ref(database, "tecnologia"), snap => {
        const tbody = document.getElementById("tablaTecBody");
        tbody.innerHTML = "";
        
        if (snap.exists()) {
            snap.forEach(child => {
                const s = child.val();
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${s.folio}</td>
                        <td>${s.empresa}</td>
                        <td>${s.sucursal}</td>
                        <td><span class="badge bg-warning">${s.status}</span></td>
                        <td>
                            <button class="btn btn-sm btn-light" onclick="window.location.href='seguimiento.html?folio=${s.folio}'">👁️</button>
                            <button class="btn btn-sm btn-danger" onclick="window.eliminarSolicitud('${child.key}')">🗑️</button>
                        </td>
                    </tr>`;
            });
        } else {
            tbody.innerHTML = "<tr><td colspan='5'>No hay solicitudes pendientes</td></tr>";
        }
        window.ocultarCargando(); // SE OCULTA AL TERMINAR DE LEER FIREBASE
    }, error => {
        console.error(error);
        window.ocultarCargando(); // SE OCULTA INCLUSO SI HAY ERROR
    });

    window.guardarSolicitud = async () => {
        const emp = document.getElementById("empresa").value;
        const suc = document.getElementById("sucursal").value;
        const file = document.getElementById("archivo").files[0];

        if(!emp || !suc || !file) return Swal.fire("Error", "Faltan datos", "error");

        window.mostrarCargando();
        const reader = new FileReader();
        reader.onload = async (e) => {
            const folio = "TEC-" + Math.floor(Math.random()*9000+1000);
            await push(ref(database, "tecnologia"), {
                folio, empresa: emp.toUpperCase(), sucursal: suc.toUpperCase(),
                status: "PENDIENTE", fechaEnvio: new Date().toLocaleString(),
                archivoData: e.target.result, usuario: sesion.nombre
            });
            document.getElementById("formTec").reset();
            Swal.fire("Éxito", "Registrado", "success");
            window.ocultarCargando();
        };
        reader.readAsDataURL(file);
    };

    window.eliminarSolicitud = async (id) => {
        if(confirm("¿Eliminar registro?")) {
            window.mostrarCargando();
            await remove(ref(database, `tecnologia/${id}`));
            window.ocultarCargando();
        }
    };
</script>
<script>
  // Seguridad de código fuente
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.onkeydown = function(e) {
    if(e.keyCode == 123) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
    if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
  };
</script>
</body>
</html>
