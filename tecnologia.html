<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Tecnología</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background: #f2f4f7; }
.card { border-radius: 20px; }
.action-btn { cursor: pointer; font-size: 22px; margin-right: 10px; }
.table thead { background:#0d6efd; color:white; }
.btn-rounded { border-radius: 50px; }
#btnRegresar {
    cursor: pointer;
    font-size: 40px;
    position: fixed;
    top: 20px;
    left: 20px;
    color: #0d6efd;
    z-index: 1000;
}
#btnRegresar:hover { color: #0a58ca; }
td:last-child {
    display: flex;
    justify-content: center;
}
</style>
</head>

<body class="p-4">

<span id="btnRegresar" onclick="irLogin()">🔙</span>

<div class="container">
<h2 class="text-center mb-4 fw-bold">Solicitud de Tecnología</h2>

<div class="card shadow p-4 mb-4">
<h5 class="fw-bold mb-3">Registrar Solicitud</h5>

<form id="formTec" class="row g-3">
<div class="col-md-3">
<label class="fw-bold">Folio</label>
<input id="folio" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Empresa</label>
<input id="empresa" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Zona</label>
<input id="zona" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Soporte Zona</label>
<input id="soporte" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Sucursal</label>
<input id="sucursal" class="form-control text-uppercase">
</div>

<div class="col-md-6">
<label class="fw-bold">Requisición</label>
<input id="archivo" class="form-control" type="file">
</div>

<div class="col-12 d-flex justify-content-between mt-3">
<button type="button" class="btn btn-primary btn-rounded" onclick="guardarSolicitud()">Guardar Solicitud</button>
</div>
</form>
</div>

<div class="card shadow p-4">
<h5 class="fw-bold mb-3">Registros</h5>

<table class="table table-bordered table-striped">
<thead>
<tr>
<th>Folio</th>
<th>Empresa</th>
<th>Zona</th>
<th>Soporte</th>
<th>Sucursal</th>
<th>Archivo</th>
<th>Status</th>
<th>Fecha</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaTecBody"></tbody>
</table>
</div>
</div>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { database, ref, push, onValue, set, remove } from "./firebase.js";

let solicitudes = [];
let indexEditar = null;
const solicitudesRef = ref(database, "tecnologia");

/* ======= FOLIO ======= */
function generarFolio(){
    return "TEC-" + Date.now();
}
folio.value = generarFolio();

/* ======= GUARDAR ======= */
window.guardarSolicitud = function(){
    let file = archivo.files[0];
    if(!empresa.value || !zona.value || !soporte.value || !sucursal.value || !file){
        alert("Campos obligatorios");
        return;
    }

    let reader = new FileReader();
    reader.onload = () => {
        push(solicitudesRef,{
            folio: folio.value,
            empresa: empresa.value,
            zona: zona.value,
            soporte: soporte.value,
            sucursal: sucursal.value,
            archivoNombre: file.name,
            archivoData: reader.result,
            status: "Pendiente",
            fechaEnvio: new Date().toLocaleString()
        });
        formTec.reset();
        folio.value = generarFolio();
    };
    reader.readAsDataURL(file);
};

/* ======= LEER EN TIEMPO REAL ======= */
onValue(solicitudesRef, snapshot => {
    solicitudes = [];
    snapshot.forEach(child => {
        solicitudes.push({ id: child.key, ...child.val() });
    });
    actualizarTabla();
});

/* ======= TABLA ======= */
function actualizarTabla(){
    tablaTecBody.innerHTML = "";
    solicitudes.forEach((s,i)=>{
        tablaTecBody.innerHTML += `
        <tr>
        <td>${s.folio}</td>
        <td>${s.empresa}</td>
        <td>${s.zona}</td>
        <td>${s.soporte}</td>
        <td>${s.sucursal}</td>
        <td><a class="btn btn-success btn-sm" download="${s.archivoNombre}" href="${s.archivoData}">📥</a></td>
        <td class="bg-success text-white fw-bold">${s.status}</td>
        <td>${s.fechaEnvio}</td>
        <td>
            <span class="action-btn" onclick="eliminar(${i})">🗑️</span>
        </td>
        </tr>`;
    });
}

/* ======= ELIMINAR ======= */
window.eliminar = function(i){
    if(confirm("¿Eliminar solicitud?")){
        remove(ref(database,"tecnologia/"+solicitudes[i].id));
    }
};

/* ======= LOGIN ======= */
window.irLogin = function(){
    localStorage.removeItem("usuarioLogueado");
    location.href = "index.html";
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
