<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tecnología</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("0aHlArLgvHrj2Xbk8"); 
        })();
    </script>
    <style>
        body { background:#f2f4f7; }
        .card { border-radius:20px; }
        .action-btn { cursor:pointer; font-size:22px; transition: 0.2s; display: inline-block; }
        .action-btn:hover { transform: scale(1.2); }
        .action-disabled { color:#adb5bd; cursor:not-allowed; opacity: 0.5; filter: grayscale(1); }
        .table thead { background:#0d6efd; color:white; }
        .btn-rounded { border-radius:50px; }
        .user-info-box { background: white; padding: 10px 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; }
        .aviso-devolucion { background: #fff3cd; border-left: 5px solid #ffc107; padding: 10px 15px; border-radius: 10px; font-size: 0.85rem; color: #856404; max-width: 600px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .acciones { display:flex; justify-content:center; gap:10px; }
        .dropdown-menu { border-radius: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 10px; z-index: 1050; }
        .dropdown-item { border-radius: 8px; margin-bottom: 2px; font-weight: 500; }
        .st-compras { background-color: #0d6efd !important; color: white; } 
        .st-zona { background-color: #ffc107 !important; color: black; }    
        .st-pendiente { background-color: #dc3545 !important; color: white; } 
        .st-sistemas { background-color: #198754 !important; color: white; }  
        .st-devolucion { background-color: #6f42c1 !important; color: white; }
        .st-default { background-color: #6c757d !important; color: white; }   
        .tiempo-badge { font-size: 0.75rem; font-weight: bold; color: #555; }
        
        /* Estilos Mejora Vista Previa */
        #preview-container { border: 2px dashed #ccc; border-radius: 10px; min-height: 100px; display: flex; align-items: center; justify-content: center; background: #fff; overflow: hidden; }
        #preview-container iframe, #preview-container img { width: 100%; height: 250px; object-fit: contain; }

        #loader { 
            display: flex; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; 
            align-items: center; flex-direction: column; 
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="p-4">
<div id="loader">
    <div style="animation: pulse 1.5s infinite;">
        <img src="https://gruporoma.com/wp-content/uploads/2023/06/cropped-cropped-procomex-pachuca-logo-350-%C3%97-100-px-1.png" style="width: 250px;">
    </div>
    <div class="mt-3">
        <div class="spinner-border text-primary" role="status"></div>
        <span class="ms-2 fw-bold">Procesando información...</span>
    </div>
</div>

<script>
    const sesionRaw = localStorage.getItem("usuarioLogueado");
    if (!sesionRaw) {
        location.href = "index.html";
    } else {
        const sesion = JSON.parse(sesionRaw);
        window.usuarioSesion = sesion.usuario;
        window.nombreSesion = sesion.nombre;
        window.puestoSesion = (sesion.puesto || "").toUpperCase();
        const puestosPrivilegiados = ["GERENTE DE SISTEMAS", "JEFE DE INFRAESTRUCTURA Y SOPORTE TECNICO", "COORDINADOR DE SOPORTE TECNICO", "SOPORTE TECNICO", "SOPORTE TECNICO SR", "BECARIO DE SISTEMAS", "BECARIO"];
        window.esSoporteJR = window.puestoSesion === "SOPORTE TECNICO JR";
        window.puedeVerBase = puestosPrivilegiados.includes(window.puestoSesion);
    }
    window.mostrarCargando = () => { document.getElementById("loader").style.display = "flex"; };
    window.ocultarCargando = () => { document.getElementById("loader").style.display = "none"; };
    window.cerrarSesion = () => { localStorage.clear(); location.href = "index.html"; };
</script>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <div class="user-info-box border-start border-primary border-4">
                <div class="fw-bold text-primary">👤 <span id="usuarioActivo"></span></div>
                <div class="text-muted small">Puesto: <span id="puestoActivo"></span></div>
            </div>
            <div class="aviso-devolucion d-none d-md-block">
                <strong>⚠️ Aviso:</strong> Verifique bien los datos antes de guardar la solicitud.
            </div>
        </div>
       <div class="dropdown">
            <button class="btn btn-primary btn-rounded dropdown-toggle fw-bold px-4 shadow-sm" type="button" id="menuBtn" data-bs-toggle="dropdown" aria-expanded="false">
                ☰ Menú
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="menuBtn">
                <li><a class="dropdown-item" href="historial.html">📜 Ver Historial</a></li>
                <li id="liBase"></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">🚪 Cerrar Sesión</a></li>
            </ul>
        </div>
    </div>

    <h2 class="text-center fw-bold mb-4">Solicitud de Tecnología</h2>

    <div class="card shadow p-4 mb-4 border-0">
        <h5 class="fw-bold mb-3 border-bottom pb-2 text-secondary">Registrar Solicitud</h5>
        <form id="formTec" class="row g-3">
            <div class="col-md-3"><label class="small fw-bold">Empresa</label><input id="empresa" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="small fw-bold">Zona</label><input id="zona" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="small fw-bold">Soporte Zona</label><input id="soporte" class="form-control text-uppercase" readonly></div>
            <div class="col-md-3"><label class="small fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase"></div>
            <div class="col-md-6">
                <label class="small fw-bold">Requisición (PDF/Imagen)</label>
                <input id="archivo" type="file" class="form-control" onchange="window.previewArchivo(this)">
            </div>
            <div class="col-md-6">
                <label class="small fw-bold">Vista Previa del Archivo</label>
                <div id="preview-container"><small class="text-muted">Sin archivo seleccionado</small></div>
            </div>
            <div class="col-12 mt-4 text-center">
                <button type="button" class="btn btn-primary btn-rounded px-5 shadow" onclick="guardarSolicitud()">💾 Guardar Solicitud</button>
            </div>
        </form>
    </div>

    <div class="card shadow p-4 border-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-secondary">Solicitudes en Proceso</h5>
            <div id="contenedorExportar"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center bg-white">
                <thead class="table-primary">
                    <tr><th>Folio</th><th>Empresa</th><th>Zona</th><th>Soporte</th><th>Sucursal</th><th>Archivo</th><th>Status</th><th>Tiempo</th><th>Fecha</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaTecBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { database, ref, push, set, get, onValue, update, remove } from "./firebase.js";

    document.getElementById("usuarioActivo").textContent = window.nombreSesion;
    document.getElementById("puestoActivo").textContent = window.puestoSesion;
    document.getElementById("soporte").value = window.nombreSesion;
    
    if (!window.esSoporteJR) {
        document.getElementById("contenedorExportar").innerHTML = `
            <button class="btn btn-outline-success btn-sm fw-bold px-3" onclick="window.exportarExcel()">
                📊 Descargar Reporte
            </button>
        `;
    }

    if (window.puedeVerBase) {
        document.getElementById("liBase").innerHTML = '<a class="dropdown-item" href="base.html">🏠 Página Base (Usuarios)</a>';
    }

    const solicitudesRef = ref(database, "tecnologia");
    const seguimientoRef = ref(database, "seguimiento");
    let globalSeguimientos = [];
    let dataParaExportar = [];

    // --- MEJORA: VISTA PREVIA ---
    window.previewArchivo = (input) => {
        const container = document.getElementById("preview-container");
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                if (file.type === "application/pdf") {
                    container.innerHTML = `<iframe src="${e.target.result}"></iframe>`;
                } else if (file.type.startsWith("image/")) {
                    container.innerHTML = `<img src="${e.target.result}">`;
                } else {
                    container.innerHTML = `<p class="p-3">El archivo no tiene vista previa soportada.</p>`;
                }
            };
            reader.readAsDataURL(file);
        } else {
            container.innerHTML = `<small class="text-muted">Sin archivo seleccionado</small>`;
        }
    };

    onValue(seguimientoRef, snap => {
        globalSeguimientos = [];
        snap.forEach(c => { globalSeguimientos.push({ ...c.val(), id: c.key }); });
        onValue(solicitudesRef, snapSolicitudes => {
            try { renderTable(snapSolicitudes); } catch (e) { console.error(e); } finally { window.ocultarCargando(); }
        });
    }, () => window.ocultarCargando());

    function renderTable(snap) {
        const tbody = document.getElementById("tablaTecBody");
        tbody.innerHTML = "";
        dataParaExportar = []; 
        
        snap.forEach(c => {
            const s = c.val();
            const idKey = c.key;
            const segsDelFolio = globalSeguimientos.filter(x => x.folio === s.folio).sort((a,b) => new Date(b.fechaRegistro) - new Date(a.fechaRegistro));
            const statusActual = segsDelFolio.length > 0 ? segsDelFolio[0].status : (s.status || "PENDIENTE");
            
            if (s.eliminado === true || statusActual === "CONFIRMADO") return;
            
            if(window.puedeVerBase || s.usuario === window.usuarioSesion) {
                const colores = {"ENVIADO A COMPRAS":"st-compras", "ENVIADO A ZONA":"st-zona", "PENDIENTE POR AUTORIZAR":"st-pendiente", "EN SISTEMAS":"st-sistemas", "DEVOLUCION": "st-devolucion"};
                const claseColor = colores[statusActual] || "st-default";
                
                dataParaExportar.push({ ...s, statusActual, segs: segsDelFolio.reverse() });

                tbody.innerHTML += `
                    <tr>
                        <td><small class="fw-bold">${s.folio}</small></td>
                        <td>${s.empresa}</td>
                        <td>${s.zona}</td>
                        <td>${s.soporte}</td>
                        <td>${s.sucursal}</td>
                        <td><button class="btn btn-sm btn-success" onclick="window.verPDF('${s.archivoData}', '${s.folio}')">👁️</button></td>
                        <td><span class="badge ${claseColor} p-2 w-100">${statusActual}</span></td>
                        <td class="tiempo-badge">${calcularTranscurrido(s.fechaISO || s.fechaEnvio)}</td>
                        <td><small>${s.fechaEnvio}</small></td>
                        <td>
                            <div class="acciones">
                                <span class="action-btn" onclick="window.verHistorialFolio('${s.folio}')" title="Historial">📜</span>
                                <span class="action-btn text-primary" onclick="window.editarRegistro('${idKey}')" title="Editar">✏️</span>
                                ${window.esSoporteJR && statusActual === "ENVIADO A ZONA" ? `
                                    <span class="action-btn text-success" onclick="window.confirmarEntrega('${s.folio}')" title="Confirmar Solicitud">✅</span>
                                    <span class="action-btn text-warning" onclick="window.enviarDevolucion('${s.folio}')" title="Devolucion">🔄</span>
                                ` : `
                                    <span class="action-btn ${window.esSoporteJR ? 'action-disabled' : ''}" onclick="${window.esSoporteJR ? '' : `window.irSeguimiento('${s.folio}')`}" title="Dar Seguimiento">📋</span>
                                `}
                            </div>
                        </td>
                    </tr>`;
            }
        });
    }

    // --- MEJORA: EDITAR REGISTRO ---
    window.editarRegistro = async (idKey) => {
        const snap = await get(ref(database, `tecnologia/${idKey}`));
        const data = snap.val();
        
        const { value: formValues } = await Swal.fire({
            title: 'Editar Solicitud',
            html: `
                <div class="text-start">
                    <label class="small fw-bold">Zona</label><input id="edt-zona" class="form-control mb-2 text-uppercase" value="${data.zona}">
                    <label class="small fw-bold">Sucursal</label><input id="edt-sucursal" class="form-control mb-2 text-uppercase" value="${data.sucursal}">
                    <label class="small fw-bold">Actualizar Archivo (Opcional)</label><input type="file" id="edt-archivo" class="form-control">
                </div>`,
            showCancelButton: true,
            confirmButtonText: 'Actualizar',
            preConfirm: () => {
                return {
                    zona: document.getElementById('edt-zona').value,
                    sucursal: document.getElementById('edt-sucursal').value,
                    archivo: document.getElementById('edt-archivo').files[0]
                };
            }
        });

        if (formValues) {
            window.mostrarCargando();
            const updates = { zona: formValues.zona.toUpperCase(), sucursal: formValues.sucursal.toUpperCase() };
            
            if (formValues.archivo) {
                const reader = new FileReader();
                reader.onload = async () => {
                    updates.archivoData = reader.result;
                    await update(ref(database, `tecnologia/${idKey}`), updates);
                    window.ocultarCargando();
                    Swal.fire("Actualizado", "Registro modificado correctamente", "success");
                };
                reader.readAsDataURL(formValues.archivo);
            } else {
                await update(ref(database, `tecnologia/${idKey}`), updates);
                window.ocultarCargando();
                Swal.fire("Actualizado", "Registro modificado correctamente", "success");
            }
        }
    };

    // --- MEJORA: VER Y DESCARGAR PDF/IMAGEN ---
    window.verPDF = (base64, folio) => {
        const byteCharacters = atob(base64.split(',')[1]);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) { byteNumbers[i] = byteCharacters.charCodeAt(i); }
        const byteArray = new Uint8Array(byteNumbers);
        const type = base64.split(';')[0].split(':')[1];
        const blob = new Blob([byteArray], { type: type });
        const url = URL.createObjectURL(blob);
        
        const w = window.open();
        w.document.write(`
            <div style="font-family:sans-serif; text-align:center; padding: 10px; background: #f8f9fa; border-bottom: 1px solid #ddd;">
                <strong>Archivo Folio: ${folio}</strong> | 
                <a href="${url}" download="ARCHIVO_${folio}" style="background:#198754; color:white; padding:5px 15px; text-decoration:none; border-radius:5px; font-size:14px;">⬇️ Descargar Archivo</a>
            </div>
            <iframe src="${url}" style="width:100%;height:90vh;border:none;"></iframe>
        `);
    };

    // Funciones de lógica de negocio (mantienen lógica original)
    window.guardarSolicitud = async () => {
        const emp = document.getElementById("empresa").value;
        const zon = document.getElementById("zona").value;
        const suc = document.getElementById("sucursal").value;
        const arc = document.getElementById("archivo").files[0];
        if (!emp || !zon || !suc || !arc) return Swal.fire("Error", "Campos incompletos", "error");
        
        window.mostrarCargando();
        const reader = new FileReader();
        reader.onload = async () => {
            try {
                const key = `TEC_${emp}_${zon}`.toUpperCase();
                const rFolio = ref(database, "folios/" + key);
                const sFolio = await get(rFolio);
                let n = sFolio.exists() ? sFolio.val() + 1 : 1;
                await set(rFolio, n);
                const fol = `TEC-${emp}-${zon}-${n.toString().padStart(4, "0")}`.toUpperCase();
                
                const nuevaSolicitud = {
                    folio: fol, empresa: emp.toUpperCase(), zona: zon.toUpperCase(),
                    soporte: window.nombreSesion, sucursal: suc.toUpperCase(),
                    archivoData: reader.result, status: "PENDIENTE", 
                    fechaEnvio: new Date().toLocaleString(), fechaISO: new Date().toISOString(),
                    usuario: window.usuarioSesion, eliminado: false
                };
                await push(solicitudesRef, nuevaSolicitud);
                document.getElementById("formTec").reset();
                document.getElementById("preview-container").innerHTML = `<small class="text-muted">Sin archivo seleccionado</small>`;
                Swal.fire("Éxito", "Solicitud Guardada", "success");
            } catch (e) { Swal.fire("Error", "No se pudo guardar", "error"); } finally { window.ocultarCargando(); }
        };
        reader.readAsDataURL(arc);
    };

    window.irSeguimiento = f => location.href = "seguimiento.html?folio=" + encodeURIComponent(f);
    window.verHistorialFolio = fol => {
        const segs = globalSeguimientos.filter(x => x.folio === fol).sort((a,b) => new Date(a.fechaRegistro) - new Date(b.fechaRegistro));
        let html = `<div class="table-responsive"><table class="table table-sm mt-3"><thead><tr class="table-dark"><th>Fecha</th><th>Status</th><th>Usuario</th><th>Comentarios</th><th>Evidencia</th></tr></thead><tbody>${segs.map(h => `<tr><td>${h.fechaRegistro}</td><td>${h.status}</td><td>${h.usuario}</td><td>${h.comentarios||''}</td><td>${h.fotoEvidencia ? `<button class="btn btn-sm btn-info" onclick="window.verPDF('${h.fotoEvidencia}', '${fol}')">📸</button>` : '-'}</td></tr>`).join('')}</tbody></table></div>`;
        Swal.fire({ title: `Historial: ${fol}`, html: html, width: '850px' });
    };

    function calcularTranscurrido(f) {
        const d = new Date(f); if (isNaN(d)) return "N/A";
        const dif = new Date() - d;
        return `${Math.floor(dif / 3600000)}h`;
    }
</script>
<script>
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.onkeydown = function(e) {
        if(e.keyCode == 123) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false;
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
    };
</script>
</body>
</html>
