<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Tecnología</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#f2f4f7; }
.card { border-radius:20px; }
.action-btn { cursor:pointer; font-size:22px; margin-right:10px; }
.table thead { background:#0d6efd; color:white; }
.btn-rounded { border-radius:50px; }
#btnRegresar {
    cursor:pointer;
    font-size:40px;
    position:fixed;
    top:20px;
    left:20px;
    color:#0d6efd;
}
td:last-child { display:flex; justify-content:center; }
.list-group-item { position:relative; }
.btn-delete {
    position:absolute;
    right:15px;
    top:15px;
    cursor:pointer;
    color:#dc3545;
}
</style>
</head>

<body class="p-4">

<span id="btnRegresar" onclick="irLogin()">🔙</span>

<div class="container">
<h2 class="text-center mb-4 fw-bold">Solicitud de Tecnología</h2>

<!-- FORMULARIO Y TABLA (SIN CAMBIOS) -->
<!-- …………… (idéntico a lo que ya tenías) …………… -->

<!-- ===== MODAL HISTORIAL ===== -->
<div class="modal fade" id="modalHistorial" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">📜 Historial de Seguimiento</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <!-- NUEVO SEGUIMIENTO -->
        <div class="card p-3 mb-3">
          <h6 class="fw-bold text-primary mb-2">➕ Agregar seguimiento</h6>

          <select id="nuevoStatus" class="form-select mb-2">
            <option value="">Seleccione status</option>
            <option>ENVIADO A COMPRAS</option>
            <option>ENVIADO A ZONA</option>
            <option>PENDIENTE POR AUTORIZAR</option>
            <option>EN SISTEMAS</option>
          </select>

          <input id="nuevaObs" class="form-control mb-2 text-uppercase"
                 placeholder="Observaciones">

          <button class="btn btn-primary btn-sm" onclick="agregarSeguimiento()">
            Guardar seguimiento
          </button>
        </div>

        <!-- HISTORIAL -->
        <ul class="list-group" id="listaHistorial"></ul>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>

    </div>
  </div>
</div>

<script type="module">
import { database, ref, push, get, remove } from "./firebase.js";

const seguimientoRef = ref(database,"seguimiento");
let folioActual = "";

/* ===== ABRIR HISTORIAL ===== */
window.verHistorial = async (folio)=>{
    folioActual = folio;
    listaHistorial.innerHTML = "";

    const snap = await get(seguimientoRef);
    let existe = false;

    snap.forEach(h=>{
        const d = h.val();
        if(d.folio === folio){
            existe = true;
            listaHistorial.innerHTML += `
              <li class="list-group-item">
                <span class="btn-delete" onclick="eliminarSeguimiento('${h.key}')">🗑️</span>
                <div class="fw-bold text-primary">${d.status}</div>
                <div>${d.observaciones || "Sin observaciones"}</div>
                <small class="text-muted">
                  ${d.fechaRegistro} · ${d.solicito || "Usuario"}
                </small>
              </li>`;
        }
    });

    if(!existe){
        listaHistorial.innerHTML = `
          <li class="list-group-item text-center text-muted">
            Sin historial registrado
          </li>`;
    }

    new bootstrap.Modal(
        document.getElementById("modalHistorial")
    ).show();
};

/* ===== AGREGAR SEGUIMIENTO ===== */
window.agregarSeguimiento = async ()=>{
    if(!nuevoStatus.value){
        alert("Seleccione un status");
        return;
    }

    await push(seguimientoRef,{
        folio: folioActual,
        status: nuevoStatus.value,
        observaciones: nuevaObs.value.toUpperCase(),
        fechaRegistro: new Date().toLocaleString(),
        solicito: localStorage.getItem("usuario") || "Sistema"
    });

    nuevoStatus.value = "";
    nuevaObs.value = "";

    verHistorial(folioActual);
};

/* ===== ELIMINAR SEGUIMIENTO ===== */
window.eliminarSeguimiento = async (id)=>{
    if(confirm("¿Eliminar este seguimiento?")){
        await remove(ref(database,"seguimiento/"+id));
        verHistorial(folioActual);
    }
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
