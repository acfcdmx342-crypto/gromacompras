<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Tecnología</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("0aHlArLgvHrj2Xbk8"); 
        })();
    </script>
    <style>
        body { background:#f2f4f7; }
        .card { border-radius:20px; }
        .action-btn { cursor:pointer; font-size:22px; transition: 0.2s; display: inline-block; }
        .action-btn:hover { transform: scale(1.2); }
        .action-disabled { color:#adb5bd; cursor:not-allowed; opacity: 0.5; filter: grayscale(1); }
        .table thead { background:#0d6efd; color:white; }
        .btn-rounded { border-radius:50px; }
        .user-info-box { background: white; padding: 10px 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: inline-block; }
        .aviso-devolucion { background: #fff3cd; border-left: 5px solid #ffc107; padding: 10px 15px; border-radius: 10px; font-size: 0.85rem; color: #856404; max-width: 600px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .acciones { display:flex; justify-content:center; gap:10px; }
        .dropdown-menu { border-radius: 15px; border: none; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 10px; z-index: 1050; }
        .dropdown-item { border-radius: 8px; margin-bottom: 2px; font-weight: 500; }
        .st-compras { background-color: #0d6efd !important; color: white; } 
        .st-zona { background-color: #ffc107 !important; color: black; }    
        .st-pendiente { background-color: #dc3545 !important; color: white; } 
        .st-sistemas { background-color: #198754 !important; color: white; }  
        .st-devolucion { background-color: #6f42c1 !important; color: white; }
        .st-default { background-color: #6c757d !important; color: white; }   
        .tiempo-badge { font-size: 0.75rem; font-weight: bold; color: #555; }
        
        #loader { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.9); z-index: 9999; justify-content: center; 
            align-items: center; flex-direction: column; 
        }
    </style>
</head>
<body class="p-4">

<div id="loader">
    <div style="animation: pulse 1.5s infinite;">
        <img src="https://gruporoma.com/wp-content/uploads/2023/06/cropped-cropped-procomex-pachuca-logo-350-%C3%97-100-px-1.png" style="width: 250px;">
    </div>
    <div class="mt-3">
        <div class="spinner-border text-primary" role="status"></div>
        <span class="ms-2 fw-bold">Procesando...</span>
    </div>
</div>

<script>
    const sesionRaw = localStorage.getItem("usuarioLogueado");
    if (!sesionRaw) {
        location.href = "index.html";
    } else {
        const sesion = JSON.parse(sesionRaw);
        window.usuarioSesion = sesion.usuario;
        window.nombreSesion = sesion.nombre;
        window.puestoSesion = (sesion.puesto || "").toUpperCase();
        const puestosPrivilegiados = ["GERENTE DE SISTEMAS", "JEFE DE INFRAESTRUCTURA Y SOPORTE TECNICO", "COORDINADOR DE SOPORTE TECNICO", "SOPORTE TECNICO", "SOPORTE TECNICO SR", "BECARIO DE SISTEMAS", "BECARIO"];
        window.esSoporteJR = window.puestoSesion === "SOPORTE TECNICO JR";
        window.puedeVerBase = puestosPrivilegiados.includes(window.puestoSesion);
    }
    window.mostrarCargando = () => { document.getElementById("loader").style.display = "flex"; };
    window.ocultarCargando = () => { document.getElementById("loader").style.display = "none"; };
    window.cerrarSesion = () => { localStorage.clear(); location.href = "index.html"; };
</script>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <div class="user-info-box border-start border-primary border-4">
                <div class="fw-bold text-primary">👤 <span id="usuarioActivo"></span></div>
                <div class="text-muted small">Puesto: <span id="puestoActivo"></span></div>
            </div>
            <div class="aviso-devolucion d-none d-md-block">
                <strong>⚠️ Aviso:</strong> Empaques intactos para devoluciones.
            </div>
        </div>
        
        <div class="dropdown">
            <button class="btn btn-primary btn-rounded dropdown-toggle fw-bold px-4 shadow-sm" type="button" id="menuBtn" data-bs-toggle="dropdown" aria-expanded="false">
                ☰ Menú
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="menuBtn">
                <li><a class="dropdown-item" href="historial.html">📜 Ver Historial</a></li>
                <li id="liBase"></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">🚪 Cerrar Sesión</a></li>
            </ul>
        </div>
    </div>

    <h2 class="text-center fw-bold mb-4">Solicitud de Tecnología</h2>

    <div class="card shadow p-4 mb-4 border-0">
        <h5 class="fw-bold mb-3 border-bottom pb-2 text-secondary">Registrar Solicitud</h5>
        <form id="formTec" class="row g-3">
            <div class="col-md-3"><label class="small fw-bold">Empresa</label><input id="empresa" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="small fw-bold">Zona</label><input id="zona" class="form-control text-uppercase"></div>
            <div class="col-md-3"><label class="small fw-bold">Soporte Zona</label><input id="soporte" class="form-control text-uppercase" readonly></div>
            <div class="col-md-3"><label class="small fw-bold">Sucursal</label><input id="sucursal" class="form-control text-uppercase"></div>
            <div class="col-md-6"><label class="small fw-bold">Requisición</label><input id="archivo" type="file" class="form-control"></div>
            <div class="col-12 mt-4">
                <button type="button" class="btn btn-primary btn-rounded px-5 shadow" onclick="guardarSolicitud()">💾 Guardar Solicitud</button>
            </div>
        </form>
    </div>

    <div class="card shadow p-4 border-0">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-secondary">Solicitudes en Proceso</h5>
            <div id="contenerdorExportar"></div>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center bg-white">
                <thead class="table-primary">
                    <tr><th>Folio</th><th>Empresa</th><th>Zona</th><th>Soporte</th><th>Sucursal</th><th>Archivo</th><th>Status</th><th>Tiempo</th><th>Fecha</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaTecBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { database, ref, push, set, get, onValue, update } from "./firebase.js";

    document.getElementById("usuarioActivo").textContent = window.nombreSesion;
    document.getElementById("puestoActivo").textContent = window.puestoSesion;
    document.getElementById("soporte").value = window.nombreSesion;

    if (window.puedeVerBase) {
        document.getElementById("liBase").innerHTML = '<a class="dropdown-item" href="base.html">🏠 Página Base (Usuarios)</a>';
    }

    const solicitudesRef = ref(database, "tecnologia");
    const seguimientoRef = ref(database, "seguimiento");
    let globalSeguimientos = [];

    onValue(seguimientoRef, snap => {
        globalSeguimientos = [];
        snap.forEach(c => { globalSeguimientos.push({ ...c.val(), id: c.key }); });
        renderTable(); 
    });

    function renderTable() {
        onValue(solicitudesRef, snap => {
            const tbody = document.getElementById("tablaTecBody");
            tbody.innerHTML = "";
            snap.forEach(c => {
                const s = c.val();
                const idKey = c.key;
                const segsDelFolio = globalSeguimientos.filter(x => x.folio === s.folio).sort((a,b) => new Date(b.fechaRegistro) - new Date(a.fechaRegistro));
                const statusActual = segsDelFolio.length > 0 ? segsDelFolio[0].status : (s.status || "PENDIENTE");

                if (s.eliminado || statusActual === "CONFIRMADO") return;

                if(window.puedeVerBase || s.usuario === window.usuarioSesion) {
                    const colores = {"ENVIADO A COMPRAS":"st-compras", "ENVIADO A ZONA":"st-zona", "PENDIENTE POR AUTORIZAR":"st-pendiente", "EN SISTEMAS":"st-sistemas", "DEVOLUCION": "st-devolucion"};
                    const claseColor = colores[statusActual] || "st-default";

                    tbody.innerHTML += `
                        <tr>
                            <td><small class="fw-bold">${s.folio}</small></td>
                            <td>${s.empresa}</td>
                            <td>${s.zona}</td>
                            <td>${s.soporte}</td>
                            <td>${s.sucursal}</td>
                            <td><button class="btn btn-sm btn-success" onclick="window.verPDF('${s.archivoData}')">👁️</button></td>
                            <td><span class="badge ${claseColor} p-2 w-100">${statusActual}</span></td>
                            <td class="tiempo-badge">${calcularTranscurrido(s.fechaISO || s.fechaEnvio)}</td>
                            <td><small>${s.fechaEnvio}</small></td>
                            <td>
                                <div class="acciones">
                                    <span class="action-btn" onclick="window.verHistorialFolio('${s.folio}')" title="Historial">📜</span>
                                    ${window.esSoporteJR && statusActual === "ENVIADO A ZONA" ? `
                                        <span class="action-btn text-success" onclick="window.confirmarEntrega('${s.folio}')">✅</span>
                                        <span class="action-btn text-warning" onclick="window.enviarDevolucion('${s.folio}')">🔄</span>
                                    ` : `
                                        <span class="action-btn ${window.esSoporteJR ? 'action-disabled' : ''}" onclick="${window.esSoporteJR ? '' : `window.irSeguimiento('${s.folio}')`}">📋</span>
                                    `}
                                    ${window.puedeVerBase ? `<span class="action-btn" onclick="window.eliminarSolicitud('${idKey}')">🗑️</span>` : ``}
                                </div>
                            </td>
                        </tr>`;
                }
            });
        });
    }

    // --- FUNCION DE DEVOLUCION SOLICITADA ---
    window.enviarDevolucion = async (fol) => {
        const snap = await get(solicitudesRef);
        let idPrincipal = null;
        snap.forEach(d => { if(d.val().folio === fol) idPrincipal = d.key; });

        const { value: formValues } = await Swal.fire({
            title: 'Motivo de Devolución',
            html: `
                <textarea id="swal-motivo" class="form-control mb-2" placeholder="Escriba el motivo..."></textarea>
                <label class="small fw-bold">Evidencia (Imagen):</label>
                <input type="file" id="swal-img" class="form-control" accept="image/*">
            `,
            preConfirm: () => {
                const m = document.getElementById('swal-motivo').value;
                const i = document.getElementById('swal-img').files[0];
                if(!m || !i) return Swal.showValidationMessage('Motivo e imagen obligatorios');
                return { m, i };
            }
        });

        if (formValues) {
            window.mostrarCargando();
            const reader = new FileReader();
            reader.onload = async () => {
                await push(seguimientoRef, { 
                    folio: fol, status: "DEVOLUCION", comentarios: formValues.m.toUpperCase(), 
                    fotoEvidencia: reader.result, fechaRegistro: new Date().toLocaleString(), 
                    usuario: window.nombreSesion 
                });
                await update(ref(database, `tecnologia/${idPrincipal}`), { status: "DEVOLUCION" });
                window.ocultarCargando();
                Swal.fire("Devuelto", "Estatus actualizado a devolución", "success");
            };
            reader.readAsDataURL(formValues.i);
        }
    };

    // Funciones de apoyo
    window.verPDF = d => { const w = window.open(); w.document.write(`<iframe src="${d}" style="width:100%;height:100%;"></iframe>`); };
    window.verHistorialFolio = fol => {
        const segs = globalSeguimientos.filter(x => x.folio === fol).sort((a,b) => new Date(a.fechaRegistro) - new Date(b.fechaRegistro));
        let html = `<div class="table-responsive"><table class="table table-sm swal-table mt-3">
            <thead><tr class="table-dark"><th>Fecha</th><th>Status</th><th>Usuario</th><th>Comentarios</th><th>Evidencia</th></tr></thead>
            <tbody>${segs.map(h => `<tr><td>${h.fechaRegistro}</td><td>${h.status}</td><td>${h.usuario}</td><td>${h.comentarios||''}</td><td>${h.fotoEvidencia ? `<button class="btn btn-sm btn-info" onclick="window.verPDF('${h.fotoEvidencia}')">📸</button>` : '-'}</td></tr>`).join('')}</tbody>
            </table></div>`;
        Swal.fire({ title: `Historial: ${fol}`, html: html, width: '850px' });
    };

    function calcularTranscurrido(f) {
        const d = new Date(f); if (isNaN(d)) return "N/A";
        const dif = new Date() - d;
        const horas = Math.floor(dif / 3600000);
        return `${horas}h`;
    }
</script>
</body>
</html>
