<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Seguimiento</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#eef1f5}
.card{border-radius:20px}
.table thead{background:#0d6efd;color:white}
.action-btn{cursor:pointer;font-size:20px}
</style>
</head>

<body class="p-4">

<div class="container">

<h3 class="fw-bold mb-3 text-center">Seguimiento de Solicitudes</h3>

<div class="card shadow p-4 mb-4">
<form id="formSeg" class="row g-3">

<div class="col-md-3">
<label class="fw-bold">Folio</label>
<select id="folio" class="form-select"></select>
</div>

<div class="col-md-3">
<label class="fw-bold">Solicitó</label>
<input id="solicito" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Sucursal</label>
<input id="sucursal" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Archivo</label>
<button id="btnArchivo" type="button" class="btn btn-secondary w-100" disabled>Ver Archivo</button>
</div>

<div class="col-md-3">
<label class="fw-bold">Fecha Compras</label>
<input id="fechaCompras" class="form-control" readonly>
</div>

<div class="col-md-9">
<label class="fw-bold">Descripción</label>
<input id="descripcion" class="form-control text-uppercase">
</div>

<div class="col-12">
<button type="button" class="btn btn-primary btn-lg" onclick="guardarSeguimiento()">Guardar</button>
</div>

</form>
</div>

<div class="card shadow p-4">
<table class="table table-bordered">
<thead>
<tr>
<th>Folio</th>
<th>Solicitó</th>
<th>Descripción</th>
<th>Fecha</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaSegBody"></tbody>
</table>
</div>

</div>

<script type="module">
import { database, ref, get } from "./firebase.js";

/* ================= VARIABLES ================= */
const selectFolio = document.getElementById("folio");
const folioURL = new URLSearchParams(location.search).get("folio");
const solicitudesRef = ref(database,"tecnologia");

let seguimiento = JSON.parse(localStorage.getItem("seguimientoLS")||"[]");
let archivoActual = null;

/* ================= CARGAR FOLIOS ================= */
async function cargarFolios(){
  selectFolio.innerHTML = "<option value=''>Seleccione</option>";

  const snap = await get(solicitudesRef);
  if(!snap.exists()) return;

  snap.forEach(c=>{
    const s = c.val();
    selectFolio.innerHTML += `<option value="${s.folio}">${s.folio}</option>`;
  });

  // 🔥 AQUÍ ESTÁ LA CLAVE
  if(folioURL){
    selectFolio.value = folioURL;
    selectFolio.dispatchEvent(new Event("change"));
  }
}

/* ================= CHANGE ================= */
selectFolio.addEventListener("change", async ()=>{
  if(!selectFolio.value) return;

  const snap = await get(solicitudesRef);
  snap.forEach(c=>{
    const s = c.val();
    if(s.folio === selectFolio.value){
      solicito.value = s.soporte || "";
      sucursal.value = s.sucursal || "";
      archivoActual = s.archivoData || null;
      btnArchivo.disabled = !archivoActual;
    }
  });
});

/* ================= ARCHIVO ================= */
btnArchivo.onclick = ()=>{
  if(archivoActual) window.open(archivoActual,"_blank");
};

/* ================= FECHA ================= */
fechaCompras.value = new Date().toLocaleString();

/* ================= GUARDAR ================= */
window.guardarSeguimiento = ()=>{
  if(!folio.value) return alert("Seleccione folio");

  seguimiento.push({
    folio:folio.value,
    solicito:solicito.value,
    descripcion:descripcion.value,
    fecha:fechaCompras.value
  });

  localStorage.setItem("seguimientoLS",JSON.stringify(seguimiento));
  actualizarTabla();
  formSeg.reset();
};

/* ================= TABLA ================= */
function actualizarTabla(){
  tablaSegBody.innerHTML="";
  seguimiento.forEach((s,i)=>{
    tablaSegBody.innerHTML+=`
    <tr>
      <td>${s.folio}</td>
      <td>${s.solicito}</td>
      <td>${s.descripcion}</td>
      <td>${s.fecha}</td>
      <td><span class="action-btn" onclick="eliminar(${i})">🗑️</span></td>
    </tr>`;
  });
}

window.eliminar = i=>{
  seguimiento.splice(i,1);
  localStorage.setItem("seguimientoLS",JSON.stringify(seguimiento));
  actualizarTabla();
};

cargarFolios();
actualizarTabla();
</script>

</body>
</html>
