<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{ background:#eef1f5; }
.card{ border-radius:20px; }
fieldset:disabled{ opacity:.6; }
</style>
</head>

<body class="p-4">

<div class="container">

<h3 class="fw-bold text-center mb-2">Seguimiento de Solicitud</h3>

<div class="text-end mb-3 fw-bold text-primary">
👤 <span id="infoUsuario"></span>
</div>

<a href="tecnologia.html" class="btn btn-dark mb-3">
Volver a Tecnología
</a>

<div class="card p-4 shadow">

<form id="formSeg" class="row g-3">

<div class="col-md-3">
<label class="fw-bold">Folio</label>
<input id="folio" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Solicitó</label>
<input id="solicito" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Sucursal</label>
<input id="sucursal" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Archivo</label>
<button type="button" id="btnArchivo" class="btn btn-secondary w-100" disabled>
Ver archivo
</button>
</div>

<div class="col-12 mt-4">
<button type="button" class="btn btn-primary btn-lg" onclick="guardarSeguimiento()">
Guardar Seguimiento
</button>
</div>

</form>
</div>
</div>

<script type="module">
import { database, ref, get, push } from "./firebase.js";

// 👤 Usuario
document.getElementById("infoUsuario").textContent =
`${localStorage.getItem("nombreCompleto")} | ${localStorage.getItem("puesto")}`;

// Referencias
const folio = document.getElementById("folio");
const solicito = document.getElementById("solicito");
const sucursal = document.getElementById("sucursal");
const btnArchivo = document.getElementById("btnArchivo");

const params = new URLSearchParams(window.location.search);
const folioParam = params.get("folio");
folio.value = folioParam;

let archivoActual = null;

// Cargar datos
const tecnologiaRef = ref(database,"tecnologia");

async function cargarDetalle(){
  const snap = await get(tecnologiaRef);
  snap.forEach(c=>{
    const d = c.val();
    if(d.folio === folioParam){
      solicito.value = d.soporte;
      sucursal.value = d.sucursal;
      archivoActual = d.archivoData;
      btnArchivo.disabled = !archivoActual;
    }
  });
}

cargarDetalle();

btnArchivo.onclick = ()=>{
  if(archivoActual) window.open(archivoActual,"_blank");
};

window.guardarSeguimiento = async ()=>{
  await push(ref(database,"seguimiento"),{
    folio: folio.value,
    solicito: solicito.value,
    sucursal: sucursal.value,
    usuarioSeguimiento: localStorage.getItem("nombreCompleto"),
    puesto: localStorage.getItem("puesto"),
    fecha: new Date().toLocaleString()
  });

  alert("Seguimiento guardado");
};
</script>

</body>
</html>
