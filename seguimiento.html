<!DOCTYPE html> <html lang="es"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Seguimiento de Solicitudes</title> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <style> body { background:#eef1f5; } .card { border-radius:20px; } .table thead { background:#0d6efd; color:white; } .action-btn { cursor:pointer; font-size:22px; margin-right:10px; } .status-compras { background:#0d6efd !important; color:white !important; } .status-zona { background:#ffc107 !important; color:#000 !important; } .status-pendiente { background:#dc3545 !important; color:white !important; } .status-sistemas { background:#198754 !important; color:white !important; } </style> </head> <body class="p-4"> <div class="container"> <h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2> <div class="text-end mb-3"> <a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a> </div> <!-- ================= FORMULARIO ================= --> <div class="card shadow p-4 mb-4"> <h4 class="fw-bold mb-3">Registrar Seguimiento</h4> <form id="formSeg" class="row g-3"> <div class="col-md-3"> <label class="form-label fw-bold">Folio</label> <select id="folio" class="form-select"></select> </div> <div class="col-md-3"> <label class="form-label fw-bold">Solicitó</label> <input id="solicito" class="form-control" readonly> </div> <div class="col-md-3"> <label class="form-label fw-bold">Sucursal</label> <input id="sucursal" class="form-control" readonly> </div> <div class="col-md-3"> <label class="form-label fw-bold">Archivo</label> <button type="button" class="btn btn-secondary w-100" id="btnArchivo" disabled> Ver Archivo </button> </div> <div class="col-md-3"> <label class="form-label fw-bold">Fecha Solicitud a Compras</label> <input id="fechaCompras" class="form-control" readonly> </div> <div class="col-md-9"> <label class="form-label fw-bold">Descripción del Artículo</label> <input id="descripcion" class="form-control text-uppercase"> </div> <div class="col-md-3"> <label class="form-label fw-bold">Folio Cotización</label> <input id="folioCot" class="form-control text-uppercase"> </div> <div class="col-md-3"> <label class="form-label fw-bold">Fecha Cotización</label> <input id="fechaCot" type="date" class="form-control"> </div> <div class="col-md-3"> <label class="form-label fw-bold">Quien Autoriza</label> <input id="autoriza" class="form-control text-uppercase"> </div> <div class="col-md-3"> <label class="form-label fw-bold">Fecha Autorización</label> <input id="fechaAuto" type="date" class="form-control"> </div> <div class="col-md-4"> <label class="form-label fw-bold">Quien Recibe</label> <input id="recibe" class="form-control text-uppercase"> </div> <div class="col-md-4"> <label class="form-label fw-bold">Fecha Entrega</label> <input id="fechaEntrega" type="date" class="form-control"> </div> <div class="col-md-4"> <label class="form-label fw-bold">Folio Factura</label> <input id="folioFactura" class="form-control text-uppercase"> </div> <div class="col-md-4"> <label class="form-label fw-bold">Quien Envía</label> <input id="envia" class="form-control text-uppercase"> </div> <div class="col-md-4"> <label class="form-label fw-bold">Fecha Envío</label> <input id="fechaEnvio" type="date" class="form-control"> </div> <div class="col-md-4"> <label class="form-label fw-bold">Status</label> <select id="status" class="form-select"> <option>ENVIADO A COMPRAS</option> <option>ENVIADO A ZONA</option> <option>PENDIENTE POR AUTORIZAR</option> <option>EN SISTEMAS</option> </select> </div> <div class="col-12"> <label class="form-label fw-bold">Comentarios</label> <textarea id="comentarios" class="form-control text-uppercase"></textarea> </div> <div class="col-12 mt-3"> <button type="button" class="btn btn-primary btn-lg" onclick="guardarSeguimiento()"> Guardar Seguimiento </button> </div> </form> </div> <!-- ================= TABLA ================= --> <div class="card shadow p-4"> <h4 class="fw-bold mb-3">Tabla de Seguimiento</h4> <table class="table table-bordered"> <thead> <tr> <th>Folio</th> <th>Solicitó</th> <th>Descripción</th> <th>Folio Cot.</th> <th>Status</th> <th>Fecha Compras</th> <th>Acciones</th> </tr> </thead> <tbody id="tablaSegBody"></tbody> </table> </div> </div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- ================= SCRIPT ================= --> <script type="module"> import { database, ref, get } from "./firebase.js"; /* ===== VARIABLES ===== */ let seguimiento = JSON.parse(localStorage.getItem("seguimientoLS") || "[]"); let archivoActual = null; const selectFolio = document.getElementById("folio"); const folioURL = new URLSearchParams(window.location.search).get("folio"); const solicitudesRef = ref(database,"tecnologia"); /* ===== FECHA AUTOMÁTICA ===== */ fechaCompras.value = new Date().toLocaleString(); /* ===== CARGAR FOLIOS ===== */ async function cargarFolios(){ selectFolio.innerHTML = "<option value=''>Seleccione un folio</option>"; const snap = await get(solicitudesRef); if(!snap.exists()) return; snap.forEach(c=>{ const s = c.val(); selectFolio.innerHTML += <option value="${s.folio}">${s.folio}</option>; }); // 🔑 ESTA ES LA CLAVE if(folioURL){ selectFolio.value = folioURL; selectFolio.dispatchEvent(new Event("change")); } } /* ===== CHANGE DEL SELECT ===== */ selectFolio.addEventListener("change", async ()=>{ if(!selectFolio.value) return; const snap = await get(solicitudesRef); snap.forEach(c=>{ const s = c.val(); if(s.folio === selectFolio.value){ solicito.value = s.soporte || ""; sucursal.value = s.sucursal || ""; archivoActual = s.archivoData || null; btnArchivo.disabled = !archivoActual; } }); }); /* ===== VER ARCHIVO ===== */ btnArchivo.onclick = ()=>{ if(!archivoActual){ alert("No hay archivo"); return; } window.open(archivoActual,"_blank"); }; /* ===== GUARDAR ===== */ window.guardarSeguimiento = ()=>{ if(!folio.value){ alert("Seleccione un folio"); return; } if(seguimiento.some(s=>s.folio===folio.value)){ alert("Este folio ya tiene seguimiento"); return; } seguimiento.push({ folio:folio.value, solicito:solicito.value, descripcion:descripcion.value.toUpperCase(), folioCot:folioCot.value.toUpperCase(), status:status.value, fechaCompras:fechaCompras.value }); localStorage.setItem("seguimientoLS",JSON.stringify(seguimiento)); actualizarTabla(); formSeg.reset(); btnArchivo.disabled=true; }; /* ===== TABLA ===== */ function aplicarColorStatus(t){ if(t==="ENVIADO A COMPRAS")return"status-compras"; if(t==="ENVIADO A ZONA")return"status-zona"; if(t==="PENDIENTE POR AUTORIZAR")return"status-pendiente"; if(t==="EN SISTEMAS")return"status-sistemas"; return""; } function actualizarTabla(){ tablaSegBody.innerHTML=""; seguimiento.forEach((s,i)=>{ tablaSegBody.innerHTML+= <tr> <td>${s.folio}</td> <td>${s.solicito}</td> <td>${s.descripcion}</td> <td>${s.folioCot}</td> <td class="${aplicarColorStatus(s.status)} fw-bold">${s.status}</td> <td>${s.fechaCompras}</td> <td> <span class="action-btn text-danger" onclick="eliminar(${i})">🗑️</span> </td> </tr>; }); } window.eliminar = i=>{ if(confirm("¿Eliminar seguimiento?")){ seguimiento.splice(i,1); localStorage.setItem("seguimientoLS",JSON.stringify(seguimiento)); actualizarTabla(); } }; /* ===== INIT ===== */ cargarFolios(); actualizarTabla(); </script> </body> </html>
