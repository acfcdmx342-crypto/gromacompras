<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Solicitudes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#eef1f5; }
.card { border-radius:20px; }
.table thead { background:#0d6efd; color:white; }
.action-btn { cursor:pointer; font-size:20px; margin-right:8px; }

.status-compras { background:#0d6efd; color:white; }
.status-zona { background:#ffc107; color:black; }
.status-pendiente { background:#dc3545; color:white; }
.status-sistemas { background:#198754; color:white; }
</style>
</head>

<body class="p-4">
<div class="container">

<h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2>

<div class="text-end mb-3">
<a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a>
</div>

<div class="card shadow p-4 mb-4">
<form id="formSeg" class="row g-3">

<h5 class="fw-bold text-primary">Detalles del Seguimiento</h5>

<div class="col-md-3">
<label class="fw-bold">Folio</label>
<select id="folio" class="form-select"></select>
</div>

<div class="col-md-3">
<label class="fw-bold">Solicitó</label>
<input id="solicito" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Sucursal</label>
<input id="sucursal" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Archivo Solicitud</label>
<button id="btnArchivo" type="button" class="btn btn-secondary w-100" disabled>
Ver Archivo
</button>
</div>

<hr>

<h5 class="fw-bold text-primary">Seguimiento Sistemas</h5>

<div class="col-md-3">
<label class="fw-bold">Fecha solicitud a compras</label>
<input id="fechaCompras" class="form-control" readonly>
</div>

<div class="col-md-9">
<label class="fw-bold">Descripción</label>
<input id="descripcion" class="form-control text-uppercase">
</div>

<hr>

<h5 class="fw-bold text-primary">Seguimiento Compras</h5>

<div class="col-md-6">
<label class="fw-bold">Archivo cotización</label>
<input type="file" id="archivoCotizacion" class="form-control">
</div>

<hr>

<h5 class="fw-bold text-primary">Seguimiento Entrega</h5>

<div class="col-md-3">
<label class="fw-bold">Fecha entrega</label>
<input id="fechaEntrega" type="date" class="form-control">
</div>

<div class="col-md-3">
<label class="fw-bold">Quién recibe</label>
<input id="recibe" class="form-control text-uppercase">
</div>

<div class="col-md-6">
<label class="fw-bold">Archivo factura</label>
<input type="file" id="archivoFactura" class="form-control">
</div>

<hr>

<h5 class="fw-bold text-primary">Status</h5>

<div class="col-md-3">
<select id="status" class="form-select">
<option>ENVIADO A COMPRAS</option>
<option>ENVIADO A ZONA</option>
<option>PENDIENTE POR AUTORIZAR</option>
<option>EN SISTEMAS</option>
</select>
</div>

<div class="col-12 mt-3">
<button type="button" class="btn btn-primary btn-lg" onclick="guardarSeguimiento()">
Guardar Seguimiento
</button>
</div>

</form>
</div>

<div class="card shadow p-4">
<h4 class="fw-bold mb-3">Tabla de Seguimiento</h4>

<table class="table table-bordered">
<thead>
<tr>
<th>Folio</th>
<th>Solicitó</th>
<th>Descripción</th>
<th>Status</th>
<th>Fecha Compras</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaSegBody"></tbody>
</table>
</div>

</div>

<script type="module">
import { database, ref, get } from "./firebase.js";
import { storage } from "./firebase.js";
import { ref as sRef, uploadBytes, getDownloadURL }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const folio = document.getElementById("folio");
const solicito = document.getElementById("solicito");
const sucursal = document.getElementById("sucursal");
const btnArchivo = document.getElementById("btnArchivo");
const fechaCompras = document.getElementById("fechaCompras");
const descripcion = document.getElementById("descripcion");
const status = document.getElementById("status");
const tablaSegBody = document.getElementById("tablaSegBody");
const formSeg = document.getElementById("formSeg");
const archivoCotizacion = document.getElementById("archivoCotizacion");
const archivoFactura = document.getElementById("archivoFactura");

let seguimiento = JSON.parse(localStorage.getItem("seguimientoLS") || "[]");
let archivoActual = null;

const solicitudesRef = ref(database, "tecnologia");

document.addEventListener("DOMContentLoaded", async ()=>{
  fechaCompras.value = new Date().toLocaleString();
  await cargarFolios();
  actualizarTabla();
});

async function cargarFolios(){
  const snap = await get(solicitudesRef);
  folio.innerHTML = "<option value=''>Seleccione</option>";
  if(!snap.exists()) return;

  snap.forEach(c=>{
    const s = c.val();
    folio.innerHTML += `<option value="${s.folio}">${s.folio}</option>`;
  });
}

async function cargarDatosFolio(f){
  if(!f) return;
  const snap = await get(solicitudesRef);

  snap.forEach(c=>{
    const s = c.val();
    if(s.folio === f){
      solicito.value = s.soporte || "";
      sucursal.value = s.sucursal || "";
      archivoActual = s.archivoData || null;
      btnArchivo.disabled = !archivoActual;
    }
  });
}

folio.addEventListener("change", ()=> cargarDatosFolio(folio.value));
btnArchivo.onclick = ()=> archivoActual && window.open(archivoActual,"_blank");

async function subirArchivo(file,carpeta){
  const r = sRef(storage,`${carpeta}/${folio.value}_${Date.now()}_${file.name}`);
  await uploadBytes(r,file);
  return getDownloadURL(r);
}

window.guardarSeguimiento = async ()=>{
  if(!folio.value){ alert("Seleccione un folio"); return; }

  const cot = archivoCotizacion.files[0]
    ? await subirArchivo(archivoCotizacion.files[0],"cotizaciones")
    : "";

  const fac = archivoFactura.files[0]
    ? await subirArchivo(archivoFactura.files[0],"facturas")
    : "";

  seguimiento.push({
    folio: folio.value,
    solicito: solicito.value,
    descripcion: descripcion.value,
    fechaCompras: fechaCompras.value,
    status: status.value,
    archivoCotizacion: cot,
    archivoFactura: fac
  });

  localStorage.setItem("seguimientoLS",JSON.stringify(seguimiento));
  actualizarTabla();

  const f = folio.value;
  formSeg.reset();
  fechaCompras.value = new Date().toLocaleString();
  folio.value = f;
  cargarDatosFolio(f);
};

function aplicarColor(s){
  return s==="EN SISTEMAS"?"status-sistemas":
         s==="ENVIADO A ZONA"?"status-zona":
         s==="PENDIENTE POR AUTORIZAR"?"status-pendiente":
         "status-compras";
}

function actualizarTabla(){
  tablaSegBody.innerHTML="";
  seguimiento.forEach((s,i)=>{
    tablaSegBody.innerHTML+=`
    <tr>
      <td>${s.folio}</td>
      <td>${s.solicito}</td>
      <td>${s.descripcion}</td>
      <td class="${aplicarColor(s.status)} fw-bold">${s.status}</td>
      <td>${s.fechaCompras}</td>
      <td>
        ${s.archivoCotizacion?`<span class="action-btn" onclick="window.open('${s.archivoCotizacion}')">📄</span>`:""}
        ${s.archivoFactura?`<span class="action-btn" onclick="window.open('${s.archivoFactura}')">🧾</span>`:""}
        <span class="action-btn text-danger" onclick="eliminar(${i})">🗑️</span>
      </td>
    </tr>`;
  });
}

window.eliminar = i=>{
  if(confirm("¿Eliminar seguimiento?")){
    seguimiento.splice(i,1);
    localStorage.setItem("seguimientoLS",JSON.stringify(seguimiento));
    actualizarTabla();
  }
};
</script>

</body>
</html>
