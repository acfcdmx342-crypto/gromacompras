<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Solicitudes - ACF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef1f5; font-family: sans-serif; }
        .card { border-radius: 15px; border: none; margin-bottom: 20px; }
        .section-title { 
            background: #0d6efd; color: white; padding: 10px 15px; 
            border-radius: 8px; margin-bottom: 15px; font-weight: bold;
        }
        .form-label { font-weight: bold; font-size: 0.85rem; color: #444; }
        .bg-locked { background-color: #f8f9fa !important; color: #6c757d; font-weight: bold; }
        input[type="text"], textarea { text-transform: uppercase; }
        .status-compras { background:#0d6efd !important; color:white; }
        .status-zona { background:#ffc107 !important; color:black; }
        .status-pendiente { background:#dc3545 !important; color:white; }
        .status-sistemas { background:#198754 !important; color:white; }
    </style>
</head>
<body class="p-4">

<div class="container">
    <h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2>

    <div class="text-end mb-3">
        <a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a>
    </div>

    <form id="formSeg">
        <div class="card shadow p-4">
            <div class="section-title">Detalles del Seguimiento (Datos Registrados)</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Folio</label>
                    <input id="folio" class="form-control bg-locked" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Solicitó</label>
                    <input id="solicito" class="form-control bg-locked" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Sucursal</label>
                    <input id="sucursal" class="form-control bg-locked" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Archivo Origen</label>
                    <button type="button" id="btnArchivoOrigen" class="btn btn-secondary w-100" disabled>Ver Solicitud Original</button>
                </div>
            </div>
        </div>

        <div class="card shadow p-4">
            <div class="section-title">Seguimiento Depto. Sistemas</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Fecha Solicitud a Compras</label>
                    <input id="fechaCompras" type="date" class="form-control">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Descripción del Artículo</label>
                    <input id="descripcion" type="text" class="form-control" placeholder="INGRESE TEXTO, NÚMEROS O SÍMBOLOS">
                </div>
            </div>
        </div>

        <div class="card shadow p-4">
            <div class="section-title">Seguimiento Compras</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Fecha de Cotización</label>
                    <input id="fechaCot" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Folio de Cotización</label>
                    <input id="folioCot" type="text" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Adjuntar Archivo de Cotización</label>
                    <input id="fileCot" type="file" class="form-control">
                </div>
            </div>
        </div>

        <div class="card shadow p-4">
            <div class="section-title">Seguimiento de Autorización</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Quién Autoriza</label>
                    <input id="autoriza" type="text" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Fecha de Autorización</label>
                    <input id="fechaAuto" type="date" class="form-control">
                </div>
            </div>
        </div>

        <div class="card shadow p-4">
            <div class="section-title">Seguimiento de Entrega</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Fecha de Entrega</label>
                    <input id="fechaEntrega" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quién Recibe</label>
                    <input id="recibe" type="text" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Folio de Factura</label>
                    <input id="folioFactura" type="text" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Adjuntar Factura</label>
                    <input id="fileFactura" type="file" class="form-control">
                </div>
            </div>
        </div>

        <div class="card shadow p-4">
            <div class="section-title">Seguimiento de Envío</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Fecha de Envío</label>
                    <input id="fechaEnvio" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quién Envía</label>
                    <input id="envia" type="text" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">A donde se envía (Maps)</label>
                    <input id="adonde" type="text" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select id="status" class="form-select">
                        <option>ENVIADO A COMPRAS</option>
                        <option>ENVIADO A ZONA</option>
                        <option>PENDIENTE POR AUTORIZAR</option>
                        <option>EN SISTEMAS</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Comentarios</label>
                    <textarea id="comentarios" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <div class="mt-4">
                <button type="button" class="btn btn-primary btn-lg w-100" onclick="guardarSeguimiento()">Guardar Todo el Seguimiento</button>
            </div>
        </div>
    </form>
</div>

<script type="module">
    import { database, ref, get, push, onValue, query, orderByChild, equalTo } from "./firebase.js";

    const params = new URLSearchParams(window.location.search);
    const folioURL = params.get("folio");
    
    // Referencias HTML
    const fInput = document.getElementById("folio");
    const sInput = document.getElementById("solicito");
    const sucInput = document.getElementById("sucursal");
    const btnOri = document.getElementById("btnArchivoOrigen");

    let urlOriginal = null;

    // === 1. CARGAR DATOS AUTOMÁTICAMENTE AL ENTRAR ===
    async function cargarDatosBase() {
        if (!folioURL) {
            alert("No se encontró un folio válido.");
            return;
        }

        fInput.value = folioURL;

        // Buscar en el nodo 'tecnologia' de Firebase
        const q = query(ref(database, "tecnologia"), orderByChild("folio"), equalTo(folioURL));
        const snap = await get(q);

        if (snap.exists()) {
            const data = Object.values(snap.val())[0];
            sInput.value = data.soporte || "N/A";
            sucInput.value = data.sucursal || "N/A";
            urlOriginal = data.archivoData || null;

            if (urlOriginal) {
                btnOri.disabled = false;
                btnOri.classList.replace("btn-secondary", "btn-success");
                btnOri.onclick = () => window.open(urlOriginal, "_blank");
            }
        } else {
            console.error("No se encontró el folio en la base de datos.");
        }
    }

    // Convertidor de archivos
    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    // === 2. GUARDAR SEGUIMIENTO ===
    window.guardarSeguimiento = async () => {
        const fileCot = document.getElementById("fileCot").files[0];
        const fileFac = document.getElementById("fileFactura").files[0];

        const nuevoSeg = {
            folio: fInput.value,
            solicito: sInput.value,
            sucursal: sucInput.value,
            fechaCompras: document.getElementById("fechaCompras").value,
            descripcion: document.getElementById("descripcion").value.toUpperCase(),
            fechaCot: document.getElementById("fechaCot").value,
            folioCot: document.getElementById("folioCot").value.toUpperCase(),
            cotizacionData: fileCot ? await toBase64(fileCot) : null,
            autoriza: document.getElementById("autoriza").value.toUpperCase(),
            fechaAuto: document.getElementById("fechaAuto").value,
            fechaEntrega: document.getElementById("fechaEntrega").value,
            recibe: document.getElementById("recibe").value.toUpperCase(),
            folioFactura: document.getElementById("folioFactura").value.toUpperCase(),
            facturaData: fileFac ? await toBase64(fileFac) : null,
            fechaEnvio: document.getElementById("fechaEnvio").value,
            envia: document.getElementById("envia").value.toUpperCase(),
            adonde: document.getElementById("adonde").value.toUpperCase(),
            status: document.getElementById("status").value,
            comentarios: document.getElementById("comentarios").value.toUpperCase(),
            fechaRegistro: new Date().toLocaleString()
        };

        await push(ref(database, "seguimiento"), nuevoSeg);
        alert("Seguimiento guardado correctamente.");
        window.location.href = "tecnologia.html";
    };

    // Iniciar carga
    cargarDatosBase();
</script>
</body>
</html>
