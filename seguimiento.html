<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Solicitudes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background: #eef1f5; }
.card { border-radius: 20px; }
.table thead { background:#0d6efd; color:white; }
.action-btn { cursor:pointer; font-size:22px; margin-right:10px; }

.status-compras { background:#0d6efd; color:white; }
.status-zona { background:#ffc107; color:black; }
.status-pendiente { background:#dc3545; color:white; }
.status-sistemas { background:#198754; color:white; }
</style>
</head>

<body class="p-4">

<div class="container">
<h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2>

<div class="text-end mb-3">
<a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a>
</div>

<div class="card shadow p-4 mb-4">
<h4 class="fw-bold mb-3">Registrar Seguimiento</h4>

<form id="formSeg" class="row g-3">

<div class="col-md-3">
<label class="fw-bold">Folio</label>
<select id="folio" class="form-select" required>
<option value="">Seleccione un folio</option>
</select>
</div>

<div class="col-md-3">
<label class="fw-bold">Solicitó</label>
<input id="solicito" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Sucursal</label>
<input id="sucursal" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Archivo</label>
<button type="button" class="btn btn-secondary w-100" id="btnArchivo" onclick="verArchivo()" disabled>
Ver Archivo
</button>
</div>

<div class="col-md-3">
<label class="fw-bold">Fecha Solicitud a Compras</label>
<input id="fechaCompras" class="form-control" readonly>
</div>

<div class="col-md-6">
<label class="fw-bold">Descripción del Artículo</label>
<input id="descripcion" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Folio Cotización</label>
<input id="folioCot" class="form-control text-uppercase">
</div>

<div class="col-md-4">
<label class="fw-bold">Status</label>
<select id="status" class="form-select">
<option>ENVIADO A COMPRAS</option>
<option>ENVIADO A ZONA</option>
<option>PENDIENTE POR AUTORIZAR</option>
<option>EN SISTEMAS</option>
</select>
</div>

<div class="col-12">
<label class="fw-bold">Comentarios</label>
<textarea id="comentarios" class="form-control text-uppercase"></textarea>
</div>

<div class="col-12 mt-3">
<button type="button" class="btn btn-primary btn-lg" onclick="guardarSeguimiento()">
Guardar Seguimiento
</button>
</div>

</form>
</div>

<div class="card shadow p-4">
<h4 class="fw-bold mb-3">Tabla de Seguimiento</h4>

<table class="table table-bordered">
<thead>
<tr>
<th>Folio</th>
<th>Solicitó</th>
<th>Descripción</th>
<th>Folio Cot.</th>
<th>Status</th>
<th>Fecha Compras</th>
</tr>
</thead>
<tbody id="tablaSegBody"></tbody>
</table>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { database, ref, onValue, push } from "./firebase.js";

/* ===== REFERENCIAS ===== */
const tecnologiaRef = ref(database, "tecnologia");
const seguimientoRef = ref(database, "seguimiento");

/* ===== ELEMENTOS ===== */
const folioSelect = document.getElementById("folio");
const btnArchivo = document.getElementById("btnArchivo");
const tablaSegBody = document.getElementById("tablaSegBody");

/* ===== VARIABLES ===== */
let archivoActual = null;

/* ===== FECHA AUTOMÁTICA ===== */
document.getElementById("fechaCompras").value = new Date().toLocaleString();

/* ===== CARGAR FOLIOS ===== */
onValue(tecnologiaRef, snapshot => {

  folioSelect.innerHTML = `<option value="">Seleccione un folio</option>`;

  snapshot.forEach(child => {
    const data = child.val();
    if (data.folio) {
      const opt = document.createElement("option");
      opt.value = data.folio;
      opt.textContent = data.folio;
      folioSelect.appendChild(opt);
    }
  });
});

/* ===== AL SELECCIONAR FOLIO ===== */
folioSelect.addEventListener("change", () => {

  const folioSel = folioSelect.value;

  solicito.value = "";
  sucursal.value = "";
  archivoActual = null;
  btnArchivo.disabled = true;

  if (!folioSel) return;

  onValue(tecnologiaRef, snapshot => {
    snapshot.forEach(child => {
      const data = child.val();
      if (data.folio === folioSel) {
        solicito.value = data.soporte || "";
        sucursal.value = data.sucursal || "";
        archivoActual = data.archivo || null;
        btnArchivo.disabled = !archivoActual;
      }
    });
  }, { onlyOnce: true });
});

/* ===== VER ARCHIVO ===== */
window.verArchivo = function(){
  if (!archivoActual) {
    alert("No hay archivo adjunto");
    return;
  }
  window.open(archivoActual, "_blank");
};

/* ===== GUARDAR SEGUIMIENTO ===== */
window.guardarSeguimiento = async function(){

  if (!folio.value || !descripcion.value) {
    alert("Campos obligatorios");
    return;
  }

  await push(seguimientoRef,{
    folio: folio.value,
    solicito: solicito.value,
    sucursal: sucursal.value,
    descripcion: descripcion.value.toUpperCase(),
    folioCot: folioCot.value.toUpperCase(),
    status: status.value,
    comentarios: comentarios.value.toUpperCase(),
    fechaCompras: fechaCompras.value
  });

  formSeg.reset();
  btnArchivo.disabled = true;
};

/* ===== TABLA EN TIEMPO REAL ===== */
onValue(seguimientoRef, snapshot => {

  tablaSegBody.innerHTML = "";

  snapshot.forEach(child => {
    const s = child.val();
    tablaSegBody.innerHTML += `
      <tr>
        <td>${s.folio}</td>
        <td>${s.solicito}</td>
        <td>${s.descripcion}</td>
        <td>${s.folioCot || "-"}</td>
        <td class="fw-bold">${s.status}</td>
        <td>${s.fechaCompras}</td>
      </tr>
    `;
  });
});
</script>

</body>
</html>
