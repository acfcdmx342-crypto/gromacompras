<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Solicitudes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body { background: #a2a4a6; }
    .card { border-radius: 20px; }
    .table thead { background:#0d6efd; color:white; }
    .action-btn { cursor:pointer; font-size:22px; margin-right:10px; }

    /* COLORES AUTOMÁTICOS */
    .status-compras { background:#0d6efd !important; color:white !important; }
    .status-zona { background:#ffc107 !important; color:#000 !important; }
    .status-pendiente { background:#dc3545 !important; color:white !important; }
    .status-sistemas { background:#198754 !important; color:white !important; }
</style>
</head>

<body class="p-4">

<div class="container">
    <h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2>

    <div class="text-end mb-3">
        <a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a>
    </div>

    <div class="card shadow p-4 mb-4">
        <h4 class="fw-bold mb-3">Registrar Seguimiento</h4>

        <form id="formSeg" class="row g-3">
            <div class="col-md-3">
                <label class="form-label fw-bold">Folio</label>
                <input id="folio" class="form-control bg-light" readonly placeholder="Cargando folio...">
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Solicitó</label>
                <input id="solicito" class="form-control bg-light" readonly>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Sucursal</label>
                <input id="sucursal" class="form-control bg-light" readonly>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Archivo</label>
                <button type="button" class="btn btn-secondary w-100" id="btnArchivo" disabled>Ver Archivo Original</button>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Fecha Solicitud a Compras</label>
                <input id="fechaCompras" class="form-control bg-light" readonly>
            </div>

            <div class="col-md-9">
                <label class="form-label fw-bold">Descripción del Artículo</label>
                <input id="descripcion" class="form-control text-uppercase">
            </div>

            <div class="col-md-4">
                <label class="form-label fw-bold">Status</label>
                <select id="status" class="form-select">
                    <option>ENVIADO A COMPRAS</option>
                    <option>ENVIADO A ZONA</option>
                    <option>PENDIENTE POR AUTORIZAR</option>
                    <option>EN SISTEMAS</option>
                </select>
            </div>

            <div class="col-12 mt-3">
                <button id="btnGuardar" type="button" class="btn btn-primary btn-lg">Guardar Seguimiento</button>
            </div>
        </form>
    </div>

    <div class="card shadow p-4">
        <h4 class="fw-bold mb-3">Historial de este Folio</h4>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Solicitó</th>
                    <th>Descripción</th>
                    <th>Status</th>
                    <th>Fecha Registro</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaSegBody"></tbody>
        </table>
    </div>
</div>
<script type="module">
    // Importamos las funciones necesarias (incluyendo query y equalTo para la búsqueda)
    import { database, ref, get, push, onValue, query, orderByChild, equalTo, remove } from "./firebase.js";

    // 1. Obtener el folio de la URL
    const params = new URLSearchParams(window.location.search);
    const folioURL = params.get("folio");
    
    // Elementos del formulario
    const fInput = document.getElementById("folio");
    const sInput = document.getElementById("solicito");
    const sucInput = document.getElementById("sucursal");
    const btnArc = document.getElementById("btnArchivo");
    const fCompras = document.getElementById("fechaCompras");

    let archivoOriginalURL = null;

    // 2. FUNCIÓN PARA LLENAR TODOS LOS CAMPOS
    async function cargarDatosDesdeFirebase() {
        if (!folioURL) {
            fInput.value = "Folio no encontrado";
            return;
        }

        // Ponemos el folio inmediatamente
        fInput.value = folioURL;
        fCompras.value = new Date().toLocaleString();

        try {
            // Buscamos en la carpeta 'tecnologia' el registro que tenga ese folio
            const consulta = query(ref(database, "tecnologia"), orderByChild("folio"), equalTo(folioURL));
            const snapshot = await get(consulta);

            if (snapshot.exists()) {
                // Firebase devuelve un objeto con una clave aleatoria, extraemos el primer resultado
                const data = snapshot.val();
                const idFirebase = Object.keys(data)[0];
                const registro = data[idFirebase];

                // LLENADO DE CAMPOS REPLICADOS
                sInput.value = registro.soporte || "";  // 'soporte' en la BD es quien 'solicitó'
                sucInput.value = registro.sucursal || "";
                
                // Guardamos la URL del archivo (archivoData es como lo tienes en tecnologia.html)
                archivoOriginalURL = registro.archivoData || null;

                if (archivoOriginalURL) {
                    btnArc.disabled = false;
                    btnArc.className = "btn btn-success w-100";
                    btnArc.textContent = "Ver Archivo Solicitud";
                }
            } else {
                console.error("No se encontró información original para el folio: " + folioURL);
            }
        } catch (error) {
            console.error("Error al obtener datos:", error);
        }
    }

    // Acción para ver el archivo original
    btnArc.onclick = () => {
        if (archivoOriginalURL) {
            const ventana = window.open("");
            ventana.document.write(`
                <html>
                <title>Archivo Solicitud - ${folioURL}</title>
                <body style="margin:0;">
                    <iframe src="${archivoOriginalURL}" frameborder="0" style="width:100%; height:100vh;"></iframe>
                </body>
                </html>
            `);
        }
    };

    // 3. GUARDAR EL SEGUIMIENTO
    window.guardarSeguimiento = async () => {
        const desc = document.getElementById("descripcion").value;
        if (!desc) return alert("Escribe una descripción");

        const nuevoRegistro = {
            folio: fInput.value,
            solicito: sInput.value,
            sucursal: sucInput.value,
            descripcion: desc.toUpperCase(),
            status: document.getElementById("status").value,
            fechaCompras: fCompras.value,
            // Aquí agregas los demás campos (folioCot, fechaCot, etc.) si los necesitas guardar
            fechaRegistro: new Date().toLocaleString()
        };

        await push(ref(database, "seguimiento"), nuevoRegistro);
        alert("Seguimiento registrado");
        location.reload(); // Recarga para ver el historial actualizado
    };

    // 4. HISTORIAL DE ESTE FOLIO
    onValue(ref(database, "seguimiento"), (snap) => {
        const tbody = document.getElementById("tablaSegBody");
        tbody.innerHTML = "";
        
        snap.forEach(child => {
            const s = child.val();
            // Solo mostrar si el folio coincide
            if (s.folio === folioURL) {
                const colorClase = s.status === "ENVIADO A COMPRAS" ? "status-compras" : 
                                   s.status === "ENVIADO A ZONA" ? "status-zona" : 
                                   s.status === "PENDIENTE POR AUTORIZAR" ? "status-pendiente" : "status-sistemas";

                tbody.innerHTML += `
                    <tr>
                        <td>${s.folio}</td>
                        <td>${s.solicito}</td>
                        <td>${s.descripcion}</td>
                        <td>${s.status}</td>
                        <td>${s.fechaRegistro}</td>
                        <td>
                            <span class="action-btn text-danger" onclick="eliminarFila('${child.key}')">🗑️</span>
                        </td>
                    </tr>`;
            }
        });
    });

    // Función para borrar del historial
    window.eliminarFila = async (key) => {
        if(confirm("¿Eliminar este registro?")) {
            await remove(ref(database, "seguimiento/" + key));
        }
    };

    // Lanzar la carga al iniciar
    cargarDatosDesdeFirebase();
</script>

</body>
</html>
