<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Solicitudes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#eef1f5; }
.card { border-radius:20px; }
.table thead { background:#0d6efd; color:white; }
.action-btn { cursor:pointer; font-size:22px; margin-right:10px; }
</style>
</head>

<body class="p-4">

<div class="container">
<h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2>

<div class="text-end mb-3">
<a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a>
</div>

<div class="card shadow p-4 mb-4">
<h4 class="fw-bold mb-3">Detalle del Folio</h4>

<form id="formSeg" class="row g-3">

<div class="col-md-3">
<label class="fw-bold">Folio</label>
<input id="folio" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Solicitó</label>
<input id="solicito" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Sucursal</label>
<input id="sucursal" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Archivo</label>
<button type="button" id="btnArchivo" class="btn btn-secondary w-100" onclick="verArchivo()" disabled>Ver Archivo</button>
</div>

<div class="col-md-6">
<label class="fw-bold">Descripción</label>
<input id="descripcion" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Status</label>
<select id="status" class="form-select">
<option>ENVIADO A COMPRAS</option>
<option>ENVIADO A ZONA</option>
<option>PENDIENTE POR AUTORIZAR</option>
<option>EN SISTEMAS</option>
</select>
</div>

<div class="col-md-3">
<label class="fw-bold">Fecha</label>
<input id="fechaCompras" class="form-control" readonly>
</div>

<div class="col-12">
<button type="button" class="btn btn-primary btn-lg" onclick="guardarSeguimiento()">Guardar Seguimiento</button>
</div>

</form>
</div>
</div>

<script type="module">
import { database, ref, get, push } from "./firebase.js";

const params = new URLSearchParams(window.location.search);
const folioParam = params.get("folio");

const tecnologiaRef = ref(database,"tecnologia");
const seguimientoRef = ref(database,"seguimiento");

let archivoActual=null;

fechaCompras.value=new Date().toLocaleString();
folio.value=folioParam;

const snap = await get(tecnologiaRef);
snap.forEach(c=>{
    const d=c.val();
    if(d.folio===folioParam){
        solicito.value=d.soporte;
        sucursal.value=d.sucursal;
        archivoActual=d.archivoData;
        btnArchivo.disabled=!archivoActual;
    }
});

window.verArchivo=()=>{
    if(archivoActual) window.open(archivoActual,"_blank");
};

window.guardarSeguimiento=async()=>{
    await push(seguimientoRef,{
        folio: folio.value,
        solicito: solicito.value,
        sucursal: sucursal.value,
        descripcion: descripcion.value.toUpperCase(),
        status: status.value,
        fechaCompras: fechaCompras.value
    });
    alert("Seguimiento guardado");
    formSeg.reset();
};
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
