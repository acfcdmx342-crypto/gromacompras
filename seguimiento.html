<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#eef1f5; }
.card { border-radius:20px; }
</style>
</head>

<body class="p-4">

<div class="container">
<h2 class="fw-bold text-center mb-4">Seguimiento de Solicitud</h2>

<div class="card shadow p-4 mb-4">
<form id="formSeg" class="row g-3">

<div class="col-md-3">
<label>Folio</label>
<input id="folio" class="form-control" readonly>
</div>

<div class="col-md-3">
<label>Solicitó</label>
<input id="solicito" class="form-control" readonly>
</div>

<div class="col-md-3">
<label>Sucursal</label>
<input id="sucursal" class="form-control" readonly>
</div>

<div class="col-md-3">
<label>Archivo</label>
<button type="button" class="btn btn-secondary w-100"
id="btnArchivo" onclick="verArchivo()" disabled>Ver</button>
</div>

<div class="col-md-12">
<label>Descripción</label>
<input id="descripcion" class="form-control">
</div>

<div class="col-md-4">
<label>Status</label>
<select id="status" class="form-select">
<option>ENVIADO A COMPRAS</option>
<option>ENVIADO A ZONA</option>
<option>EN SISTEMAS</option>
</select>
</div>

<div class="col-12">
<button type="button" class="btn btn-primary"
onclick="guardarSeguimiento()">Guardar Seguimiento</button>
</div>

</form>
</div>
</div>

<script type="module">
import { database, ref, get, push } from "./firebase.js";

const tecnologiaRef = ref(database,"tecnologia");
const seguimientoRef = ref(database,"seguimiento");
let archivoActual = null;

/* ===== OBTENER FOLIO URL ===== */
const params = new URLSearchParams(window.location.search);
const folioURL = params.get("folio");

/* ===== CARGAR DATOS ===== */
if(folioURL){
  const snap = await get(tecnologiaRef);
  snap.forEach(child => {
    const d = child.val();
    if(d.folio === folioURL){
      folio.value = d.folio;
      solicito.value = d.soporte;
      sucursal.value = d.sucursal;
      archivoActual = d.archivoData;
      btnArchivo.disabled = !archivoActual;
    }
  });
}

/* ===== VER ARCHIVO ===== */
window.verArchivo = function(){
  if(archivoActual){
    window.open(archivoActual,"_blank");
  }
};

/* ===== GUARDAR ===== */
window.guardarSeguimiento = async function(){
  await push(seguimientoRef,{
    folio: folio.value,
    solicito: solicito.value,
    sucursal: sucursal.value,
    descripcion: descripcion.value,
    status: status.value,
    fecha: new Date().toLocaleString()
  });

  alert("Seguimiento guardado");
  formSeg.reset();
};
</script>

</body>
</html>
