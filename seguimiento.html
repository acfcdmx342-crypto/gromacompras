<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#eef1f5; }
.card { border-radius:20px; }
.table thead { background:#0d6efd; color:white; }
.status-compras { background:#0d6efd; color:white; }
.status-zona { background:#ffc107; }
.status-pendiente { background:#dc3545; color:white; }
.status-sistemas { background:#198754; color:white; }
.action-btn { cursor:pointer; font-size:22px; }
</style>
</head>

<body class="p-4">

<div class="container">
<h2 class="text-center fw-bold mb-4">Seguimiento</h2>

<div class="card shadow p-4 mb-4">
<h5 class="fw-bold">Registrar Seguimiento</h5>

<form id="formSeg" class="row g-3">

<div class="col-md-4">
<label>Folio</label>
<select id="folio" class="form-select"></select>
</div>

<div class="col-md-4">
<label>Sucursal</label>
<input id="sucursal" class="form-control" readonly>
</div>

<div class="col-md-4">
<label>Archivo</label>
<button type="button" id="btnArchivo" class="btn btn-secondary w-100" onclick="verArchivo()" disabled>Ver</button>
</div>

<div class="col-md-6">
<label>Descripción</label>
<input id="descripcion" class="form-control text-uppercase">
</div>

<div class="col-md-6">
<label>Status</label>
<select id="status" class="form-select">
<option>ENVIADO A COMPRAS</option>
<option>ENVIADO A ZONA</option>
<option>PENDIENTE POR AUTORIZAR</option>
<option>EN SISTEMAS</option>
</select>
</div>

<div class="col-12">
<button type="button" class="btn btn-primary" onclick="guardarSeguimiento()">Guardar</button>
</div>

</form>
</div>

<div class="card shadow p-4">
<h5 class="fw-bold">Seguimiento del Folio</h5>

<table class="table table-bordered">
<thead>
<tr>
<th>Folio</th>
<th>Descripción</th>
<th>Status</th>
<th>Fecha</th>
</tr>
</thead>
<tbody id="tablaSegBody"></tbody>
</table>
</div>
</div>

<script type="module">
import { database, ref, get, push, onValue } from "./firebase.js";

const params = new URLSearchParams(window.location.search);
const folioURL = params.get("folio");

const solicitudesRef = ref(database,"tecnologia");
const seguimientoRef = ref(database,"seguimiento");

let archivoActual = null;
let solicitudes = [];

onValue(solicitudesRef,snap=>{
  solicitudes=[];
  snap.forEach(c=>solicitudes.push(c.val()));
  cargarFolios();
});

function cargarFolios(){
  folio.innerHTML="";
  solicitudes.forEach(s=>{
    folio.innerHTML+=`<option value="${s.folio}">${s.folio}</option>`;
  });

  if(folioURL){
    folio.value = folioURL;
    cargarDatos();
  }
}

folio.addEventListener("change",cargarDatos);

function cargarDatos(){
  const data = solicitudes.find(s=>s.folio===folio.value);
  if(!data) return;
  sucursal.value = data.sucursal;
  archivoActual = data.archivoData;
  btnArchivo.disabled = !archivoActual;
  actualizarTabla();
}

window.verArchivo = ()=>{
  if(archivoActual) window.open(archivoActual,"_blank");
};

window.guardarSeguimiento = async ()=>{
  await push(seguimientoRef,{
    folio: folio.value,
    descripcion: descripcion.value.toUpperCase(),
    status: status.value,
    fechaRegistro: new Date().toLocaleString()
  });
  descripcion.value="";
  actualizarTabla();
};

function aplicarColor(t){
  if(t==="ENVIADO A COMPRAS") return "status-compras";
  if(t==="ENVIADO A ZONA") return "status-zona";
  if(t==="PENDIENTE POR AUTORIZAR") return "status-pendiente";
  if(t==="EN SISTEMAS") return "status-sistemas";
  return "";
}

function actualizarTabla(){
  tablaSegBody.innerHTML="";
  onValue(seguimientoRef,snap=>{
    tablaSegBody.innerHTML="";
    snap.forEach(c=>{
      const s = c.val();
      if(s.folio===folio.value){
        tablaSegBody.innerHTML+=`
        <tr>
          <td>${s.folio}</td>
          <td>${s.descripcion}</td>
          <td class="${aplicarColor(s.status)} fw-bold">${s.status}</td>
          <td>${s.fechaRegistro}</td>
        </tr>`;
      }
    });
  });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
