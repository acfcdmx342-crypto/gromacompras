<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Solicitudes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background:#eef1f5; }
.card { border-radius:20px; }
.table thead { background:#0d6efd; color:white; }
.action-btn { cursor:pointer; font-size:20px; margin-right:8px; }

.status-compras { background:#0d6efd; color:white; }
.status-zona { background:#ffc107; color:black; }
.status-pendiente { background:#dc3545; color:white; }
.status-sistemas { background:#198754; color:white; }
</style>
</head>

<body class="p-4">
<div class="container">

<h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2>

<div class="text-end mb-3">
<a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a>
</div>

<div class="card shadow p-4 mb-4">
<form id="formSeg" class="row g-3">

<h5 class="fw-bold text-primary">Detalles del Seguimiento</h5>

<div class="col-md-3">
<label class="fw-bold">Folio</label>
<select id="folio" class="form-select"></select>
</div>

<div class="col-md-3">
<label class="fw-bold">Solicitó</label>
<input id="solicito" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Sucursal</label>
<input id="sucursal" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Archivo Solicitud</label>
<button id="btnArchivo" type="button" class="btn btn-secondary w-100" disabled>
Ver Archivo
</button>
</div>

<hr>

<h5 class="fw-bold text-primary">Seguimiento Depto. Sistemas</h5>

<div class="col-md-3">
<label class="fw-bold">Fecha solicitud a compras</label>
<input id="fechaCompras" class="form-control" readonly>
</div>

<div class="col-md-9">
<label class="fw-bold">Descripción del artículo</label>
<input id="descripcion" class="form-control text-uppercase">
</div>

<hr>

<h5 class="fw-bold text-primary">Seguimiento Compras</h5>

<div class="col-md-3">
<label class="fw-bold">Fecha cotización</label>
<input id="fechaCot" type="date" class="form-control">
</div>

<div class="col-md-3">
<label class="fw-bold">Folio cotización</label>
<input id="folioCot" class="form-control text-uppercase">
</div>

<div class="col-md-6">
<label class="fw-bold">Archivo cotización</label>
<input type="file" id="archivoCotizacion" class="form-control">
</div>

<hr>

<h5 class="fw-bold text-primary">Seguimiento Autorización</h5>

<div class="col-md-6">
<label class="fw-bold">Quién autoriza</label>
<input id="autoriza" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Fecha autorización</label>
<input id="fechaAuto" type="date" class="form-control">
</div>

<hr>

<h5 class="fw-bold text-primary">Seguimiento Entrega</h5>

<div class="col-md-3">
<label class="fw-bold">Fecha entrega</label>
<input id="fechaEntrega" type="date" class="form-control">
</div>

<div class="col-md-3">
<label class="fw-bold">Quién recibe</label>
<input id="recibe" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Folio factura</label>
<input id="folioFactura" class="form-control text-uppercase">
</div>

<div class="col-md-6">
<label class="fw-bold">Archivo factura</label>
<input type="file" id="archivoFactura" class="form-control">
</div>

<hr>

<h5 class="fw-bold text-primary">Seguimiento Envío</h5>

<div class="col-md-3">
<label class="fw-bold">Fecha envío</label>
<input id="fechaEnvio" type="date" class="form-control">
</div>

<div class="col-md-3">
<label class="fw-bold">Quién envía</label>
<input id="envia" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">A dónde se envía</label>
<input id="destino" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Status</label>
<select id="status" class="form-select">
<option>ENVIADO A COMPRAS</option>
<option>ENVIADO A ZONA</option>
<option>PENDIENTE POR AUTORIZAR</option>
<option>EN SISTEMAS</option>
</select>
</div>

<hr>

<h5 class="fw-bold text-primary">Comentarios</h5>

<div class="col-12">
<textarea id="comentarios" class="form-control text-uppercase"></textarea>
</div>

<div class="col-12 mt-3">
<button type="button" class="btn btn-primary btn-lg" onclick="guardarSeguimiento()">
Guardar Seguimiento
</button>
</div>

</form>
</div>

<div class="card shadow p-4">
<h4 class="fw-bold mb-3">Tabla de Seguimiento</h4>

<table class="table table-bordered">
<thead>
<tr>
<th>Folio</th>
<th>Solicitó</th>
<th>Descripción</th>
<th>Status</th>
<th>Fecha Compras</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaSegBody"></tbody>
</table>
</div>

</div>
<script type="module">
    import { database, ref, get, query, orderByChild, equalTo, onValue, push } from "./firebase.js";

    // 1. Obtener folio de la URL
    const params = new URLSearchParams(window.location.search);
    const folioURL = params.get("folio");

    const fInput = document.getElementById("folio");
    const sInput = document.getElementById("solicito");
    const sucInput = document.getElementById("sucursal");
    const btnArc = document.getElementById("btnArchivo");
    let dataArchivo = null;

    // 2. Cargar datos originales de 'tecnologia'
    async function cargarDatosOriginales() {
        if (!folioURL) return;

        const q = query(ref(database, "tecnologia"), orderByChild("folio"), equalTo(folioURL));
        const snap = await get(q);

        if (snap.exists()) {
            const data = snap.val();
            const key = Object.keys(data)[0];
            const item = data[key];

            fInput.value = item.folio || "";
            sInput.value = item.soporte || ""; // Soporte es quien solicitó
            sucInput.value = item.sucursal || "";
            dataArchivo = item.archivoData;

            if (dataArchivo) {
                btnArc.disabled = false;
                btnArc.className = "btn btn-success w-100";
            }
        }
    }

    // Ver archivo
    btnArc.onclick = () => {
        if (dataArchivo) {
            const win = window.open("");
            win.document.write(`<iframe src="${dataArchivo}" frameborder="0" style="width:100%; height:100%;"></iframe>`);
        }
    };

    // Guardar seguimiento sin alterar registros previos
    window.guardarSeguimiento = async () => {
        const desc = document.getElementById("descripcion").value;
        if (!desc) return alert("Ingrese una descripción");

        await push(ref(database, "seguimiento"), {
            folio: fInput.value,
            descripcion: desc.toUpperCase(),
            status: document.getElementById("status").value,
            fecha: new Date().toLocaleString()
        });

        alert("Seguimiento guardado");
        location.reload();
    };

    // Cargar tabla de historial
    onValue(ref(database, "seguimiento"), (snap) => {
        const tbody = document.getElementById("tablaSegBody");
        tbody.innerHTML = "";
        snap.forEach(child => {
            const s = child.val();
            if (s.folio === folioURL) {
                tbody.innerHTML += `<tr><td>${s.folio}</td><td>${s.descripcion}</td><td>${s.status}</td><td>${s.fecha}</td></tr>`;
            }
        });
    });

    cargarDatosOriginales();
</script>

</body>
</html>
