<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Solicitudes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#eef1f5;}
.card{border-radius:20px;}
.table thead{background:#0d6efd;color:white;}
.status-compras{background:#0d6efd;color:white;}
.status-zona{background:#ffc107;color:black;}
.status-pendiente{background:#dc3545;color:white;}
.status-sistemas{background:#198754;color:white;}
</style>
</head>

<body class="p-4">
<div class="container">
    <h3 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h3>
    <div class="card shadow p-4 mb-4">
        <form id="formSeg" class="row g-3">
            <h6 class="fw-bold text-primary">Detalles del Seguimiento</h6>
            <div class="col-md-3"><label>Folio</label><input id="folio" class="form-control" readonly></div>
            <div class="col-md-3"><label>Solicitó</label><input id="solicito" class="form-control" readonly></div>
            <div class="col-md-3"><label>Sucursal</label><input id="sucursal" class="form-control" readonly></div>
            <div class="col-md-3"><label>Archivo Solicitud</label><button id="btnArchivo" type="button" class="btn btn-secondary w-100" disabled>Ver Archivo</button></div>
            <hr>
            <div class="col-md-3"><label>Fecha solicitud a compras</label><input id="fechaCompras" class="form-control" readonly></div>
            <div class="col-md-9"><label>Descripción del artículo</label><input id="descripcion" class="form-control text-uppercase"></div>
            <div class="col-12 mt-3"><button id="btnGuardar" type="button" class="btn btn-primary">Guardar Seguimiento</button></div>
        </form>
    </div>
    <div class="card shadow p-4">
        <h5 class="fw-bold">Historial</h5>
        <table class="table table-bordered">
            <thead><tr><th>Folio</th><th>Descripción</th><th>Fecha</th></tr></thead>
            <tbody id="tablaSegBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { database, ref, get, push, onValue, query, orderByChild, equalTo } from "./firebase.js";

    const params = new URLSearchParams(window.location.search);
    const folioURL = params.get("folio");
    const fInput = document.getElementById("folio");
    const sInput = document.getElementById("solicito");
    const sucInput = document.getElementById("sucursal");
    const btnArc = document.getElementById("btnArchivo");
    let dataArchivo = null;

    async function cargarSolicitud() {
        if (!folioURL) return;
        const q = query(ref(database, "tecnologia"), orderByChild("folio"), equalTo(folioURL));
        const snap = await get(q);
        if (snap.exists()) {
            const data = snap.val();
            const s = data[Object.keys(data)[0]];
            fInput.value = s.folio;
            sInput.value = s.soporte; // Se asigna 'soporte' al campo Solicitó
            sucInput.value = s.sucursal;
            dataArchivo = s.archivoData;
            btnArc.disabled = false;
            btnArc.className = "btn btn-success w-100";
        }
    }

    btnArc.onclick = () => {
        const v = window.open("");
        v.document.write(`<iframe src="${dataArchivo}" frameborder="0" style="width:100%; height:100%;"></iframe>`);
    };

    document.getElementById("btnGuardar").onclick = async () => {
        await push(ref(database, "seguimiento"), {
            folio: fInput.value,
            descripcion: document.getElementById("descripcion").value,
            fecha: new Date().toLocaleString()
        });
        alert("Guardado");
        location.reload();
    };

    cargarSolicitud();
</script>
</body>
</html>
