<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        .section-header { 
            background: #ffffff; 
            padding: 12px; 
            border-left: 6px solid #0d6efd; 
            font-weight: 700; 
            margin-bottom: 20px;
            color: #333;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .btn-modern {
            border-radius: 50px;
            padding: 12px 35px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            letter-spacing: 0.5px;
        }

        .btn-save {
            background: linear-gradient(45deg, #0d6efd, #0046af);
            color: white;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 110, 253, 0.4);
            color: white;
        }

        .btn-nav {
            border: 2px solid #343a40;
            background: transparent;
            color: #343a40;
        }

        .btn-nav:hover {
            background: #343a40;
            color: white;
            transform: scale(1.05);
        }

        .btn-action-table {
            border-radius: 8px;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .status-compras { background:#e7f1ff !important; color:#0d6efd !important; border-radius: 20px; }
        .status-zona { background:#fff9e6 !important; color:#ffc107 !important; border-radius: 20px; }
        .status-pendiente { background:#fff2f4 !important; color:#dc3545 !important; border-radius: 20px; }
        .status-sistemas { background:#e6fcf5 !important; color:#198754 !important; border-radius: 20px; }
        
        input[type="text"], input[type="date"], textarea, .form-select { 
            border-radius: 10px; 
            border: 1px solid #dee2e6;
            padding: 10px;
            text-transform: uppercase;
        }

        /* Estilo para campos bloqueados */
        .field-locked {
            background-color: #e9ecef !important;
            cursor: not-allowed;
            pointer-events: none;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body class="p-4">
<div class="container">
    
    <div class="header-container">
        <h2 class="fw-bold m-0 text-dark"><i class="fa-solid fa-clipboard-check me-2 text-primary"></i>Seguimiento</h2>
        <a href="tecnologia.html" class="btn btn-modern btn-nav">
            <i class="fa-solid fa-arrow-left me-2"></i>Ir a Tecnología
        </a>
    </div>

    <div class="card shadow p-4 mb-5">
        <h4 class="fw-bold mb-4 text-secondary">Registrar Nuevo Seguimiento</h4>

        <form id="formSeg" class="row g-3">
            <div class="section-header"><i class="fa-solid fa-info-circle me-2"></i>Origen de la Solicitud</div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">FOLIO</label>
                <select id="folio" class="form-select"></select>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">SOLICITÓ</label>
                <input id="solicito" class="form-control" readonly>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">SUCURSAL</label>
                <input id="sucursal" class="form-control" readonly>
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">DOCUMENTO ORIGEN</label>
                <button type="button" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center" id="btnArchivo" disabled style="height: 45px;">
                    <i class="fa-solid fa-file-pdf me-2"></i>Ver PDF
                </button>
            </div>

            <div class="section-header"><i class="fa-solid fa-laptop-code me-2"></i>Depto. de Sistemas</div>
            <div class="col-md-4">
                <label class="form-label fw-bold small">FECHA SOLICITUD COMPRAS</label>
                <input id="fechaCompras" type="date" class="form-control">
            </div>
            <div class="col-md-8">
                <label class="form-label fw-bold small">DESCRIPCIÓN DEL ARTÍCULO</label>
                <input id="descripcion" type="text" class="form-control" placeholder="EJ. MONITOR DELL 24''">
            </div>

            <div class="section-header"><i class="fa-solid fa-cart-shopping me-2"></i>Seguimiento Compras</div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">FECHA COTIZACIÓN</label>
                <input id="fechaCot" type="date" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">FOLIO COTIZACIÓN</label>
                <input id="folioCot" type="text" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold small">SUBIR COTIZACIÓN</label>
                <input id="fileCot" type="file" class="form-control">
            </div>

            <div class="section-header"><i class="fa-solid fa-user-check me-2"></i>Autorización</div>
            <div class="col-md-6">
                <label class="form-label fw-bold small">QUIEN AUTORIZA</label>
                <input id="autoriza" type="text" class="form-control">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold small">FECHA AUTORIZACIÓN</label>
                <input id="fechaAuto" type="date" class="form-control">
            </div>

            <div class="section-header"><i class="fa-solid fa-box me-2"></i>Entrega y Facturación</div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">FECHA ENTREGA</label>
                <input id="fechaEntrega" type="date" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">QUIEN RECIBE</label>
                <input id="recibe" type="text" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">FOLIO FACTURA</label>
                <input id="folioFactura" type="text" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label fw-bold small">SUBIR FACTURA</label>
                <input id="fileFactura" type="file" class="form-control">
            </div>

            <div class="section-header"><i class="fa-solid fa-truck-fast me-2"></i>Envío a Destino</div>
            <div class="col-md-4">
                <label class="form-label fw-bold small">FECHA ENVÍO</label>
                <input id="fechaEnvio" type="date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold small">QUIEN ENVÍA</label>
                <input id="envia" type="text" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label fw-bold small">DESTINO (MAPS)</label>
                <input id="adonde" type="text" class="form-control">
            </div>

            <div class="section-header"><i class="fa-solid fa-flag-checkered me-2"></i>Finalización</div>
            <div class="col-md-4">
                <label class="form-label fw-bold small">STATUS ACTUAL</label>
                <select id="status" class="form-select">
                    <option>ENVIADO A COMPRAS</option>
                    <option>ENVIADO A ZONA</option>
                    <option>PENDIENTE POR AUTORIZAR</option>
                    <option>EN SISTEMAS</option>
                </select>
            </div>
            <div class="col-md-8">
                <label class="form-label fw-bold small">COMENTARIOS ADICIONALES</label>
                <textarea id="comentarios" class="form-control" rows="2"></textarea>
            </div>

            <div class="col-12 text-center mt-5">
                <button id="btnGuardar" type="button" class="btn btn-modern btn-save">
                    <i class="fa-solid fa-cloud-arrow-up me-2"></i>GUARDAR SEGUIMIENTO COMPLETO
                </button>
            </div>
        </form>
    </div>

    <div class="card shadow p-4">
        <h4 class="fw-bold mb-4 text-secondary"><i class="fa-solid fa-list-ul me-2"></i>Historial de Movimientos</h4>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Folio</th>
                        <th>Descripción</th>
                        <th>Status</th>
                        <th>Docs</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaSegBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
    import { database, ref, get, push, onValue, query, orderByChild, equalTo, remove } from "./firebase.js";

    const params = new URLSearchParams(window.location.search);
    const folioURL = params.get("folio");
    
    const selectFolio = document.getElementById("folio");
    const solInput = document.getElementById("solicito");
    const sucInput = document.getElementById("sucursal");
    const btnArc = document.getElementById("btnArchivo");

    let dataArchivoActual = null;

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    // --- FUNCIÓN PARA CARGAR Y BLOQUEAR CAMPOS SEGÚN REGLAS ---
    window.cargarParaContinuar = (dataString) => {
        const data = JSON.parse(decodeURIComponent(dataString));
        
        const campos = [
            "folio", "fechaCompras", "descripcion", "fechaCot", "folioCot", 
            "autoriza", "fechaAuto", "fechaEntrega", "recibe", "folioFactura", 
            "fechaEnvio", "envia", "adonde", "status", "comentarios"
        ];

        campos.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;

            // 1. Llenamos el valor si existe en el registro
            if (data[id]) {
                el.value = data[id];
                
                // 2. Aplicamos bloqueo si:
                // - El campo tiene datos
                // - NO es el folio (select principal)
                // - NO es el status ni comentarios (siempre editables)
                if (id !== "folio" && id !== "status" && id !== "comentarios") {
                    el.readOnly = true;
                    el.classList.add("field-locked");
                    // Para los input de tipo archivo o selects que no deben tocarse
                    if (el.tagName === "SELECT") el.disabled = true;
                }
            } else {
                // Si el campo está vacío en el registro, lo habilitamos para completar
                el.readOnly = false;
                el.disabled = false;
                el.classList.remove("field-locked");
            }
        });

        // Caso especial: El status y comentarios siempre deben ser editables para "continuar"
        document.getElementById("status").disabled = false;
        document.getElementById("status").classList.remove("field-locked");
        document.getElementById("comentarios").readOnly = false;
        document.getElementById("comentarios").classList.remove("field-locked");

        cargarInfoPorFolio(data.folio);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    onValue(ref(database, "tecnologia"), (snap) => {
        selectFolio.innerHTML = '<option value="">Seleccione un folio</option>';
        snap.forEach(child => {
            const d = child.val();
            const option = document.createElement("option");
            option.value = d.folio;
            option.textContent = d.folio;
            selectFolio.appendChild(option);
        });
        if (folioURL) {
            selectFolio.value = folioURL;
            cargarInfoPorFolio(folioURL);
        }
    });

    async function cargarInfoPorFolio(fol) {
        if (!fol) return;
        const q = query(ref(database, "tecnologia"), orderByChild("folio"), equalTo(fol));
        const snap = await get(q);
        if (snap.exists()) {
            const data = snap.val();
            const item = Object.values(data)[0];
            solInput.value = item.soporte || "";
            sucInput.value = item.sucursal || "";
            dataArchivoActual = item.archivoData || null;
            btnArc.disabled = !dataArchivoActual;
            btnArc.className = dataArchivoActual ? "btn btn-success w-100" : "btn btn-outline-secondary w-100";
        }
    }

    selectFolio.addEventListener("change", (e) => cargarInfoPorFolio(e.target.value));

    btnArc.onclick = () => {
        if (dataArchivoActual) {
            const win = window.open("");
            win.document.write(`<iframe src="${dataArchivoActual}" frameborder="0" style="width:100%; height:100%;"></iframe>`);
        }
    };

    document.getElementById("btnGuardar").onclick = async () => {
        if (!selectFolio.value) return alert("Seleccione un folio");

        const fCot = document.getElementById("fileCot").files[0];
        const fFac = document.getElementById("fileFactura").files[0];

        const getVal = (id) => document.getElementById(id).value;

        const dataGuardar = {
            folio: getVal("folio"),
            solicito: solInput.value,
            sucursal: sucInput.value,
            fechaCompras: getVal("fechaCompras"),
            descripcion: getVal("descripcion").toUpperCase(),
            fechaCot: getVal("fechaCot"),
            folioCot: getVal("folioCot").toUpperCase(),
            archivoCot: fCot ? await toBase64(fCot) : null,
            autoriza: getVal("autoriza").toUpperCase(),
            fechaAuto: getVal("fechaAuto"),
            fechaEntrega: getVal("fechaEntrega"),
            recibe: getVal("recibe").toUpperCase(),
            folioFactura: getVal("folioFactura").toUpperCase(),
            archivoFac: fFac ? await toBase64(fFac) : null,
            fechaEnvio: getVal("fechaEnvio"),
            envia: getVal("envia").toUpperCase(),
            adonde: getVal("adonde").toUpperCase(),
            status: getVal("status"),
            comentarios: getVal("comentarios").toUpperCase(),
            fechaRegistro: new Date().toLocaleString()
        };

        await push(ref(database, "seguimiento"), dataGuardar);
        alert("Seguimiento actualizado/guardado exitosamente");
        location.reload();
    };

    onValue(ref(database, "seguimiento"), (snap) => {
        const tbody = document.getElementById("tablaSegBody");
        tbody.innerHTML = "";
        snap.forEach(child => {
            const s = child.val();
            const colorClass = s.status === "ENVIADO A COMPRAS" ? "status-compras" : 
                               s.status === "ENVIADO A ZONA" ? "status-zona" : 
                               s.status === "PENDIENTE POR AUTORIZAR" ? "status-pendiente" : "status-sistemas";

            const dataString = encodeURIComponent(JSON.stringify(s));

            tbody.innerHTML += `
                <tr>
                    <td class="fw-bold">${s.folio}</td>
                    <td class="small text-muted">${s.descripcion}</td>
                    <td><span class="px-3 py-1 fw-bold small ${colorClass}">${s.status}</span></td>
                    <td>
                        <div class="d-flex gap-1 justify-content-center">
                            ${s.archivoCot ? `<button class="btn btn-sm btn-light btn-action-table text-primary" onclick="window.open('${s.archivoCot}')" title="Ver Cotización"><i class="fa-solid fa-file-invoice"></i></button>` : ''}
                            ${s.archivoFac ? `<button class="btn btn-sm btn-light btn-action-table text-danger" onclick="window.open('${s.archivoFac}')" title="Ver Factura"><i class="fa-solid fa-file-signature"></i></button>` : ''}
                        </div>
                    </td>
                    <td>
                         <div class="d-flex gap-1">
                            <button class="btn btn-sm btn-light btn-action-table text-primary" onclick="cargarParaContinuar('${dataString}')" title="Continuar Registro">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button class="btn btn-sm btn-light btn-action-table text-danger" onclick="eliminarSeg('${child.key}')" title="Eliminar">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                         </div>
                    </td>
                </tr>`;
        });
    });

    window.eliminarSeg = async (key) => {
        if(confirm("¿Desea eliminar permanentemente este registro de seguimiento?")) await remove(ref(database, "seguimiento/" + key));
    };
</script>
</body>
</html>
