<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Solicitudes - ACF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #eef1f5; font-family: sans-serif; }
        .card { border-radius: 15px; border: none; }
        .section-title { 
            background: #0d6efd; color: white; padding: 8px 15px; 
            border-radius: 8px; margin-bottom: 15px; font-weight: bold;
        }
        .form-label { font-weight: bold; font-size: 0.9rem; margin-bottom: 2px; }
        .status-compras { background:#0d6efd !important; color:white; }
        .status-zona { background:#ffc107 !important; color:black; }
        .status-pendiente { background:#dc3545 !important; color:white; }
        .status-sistemas { background:#198754 !important; color:white; }
        .bg-locked { background-color: #e9ecef !important; }
        input[type="text"], textarea { text-transform: uppercase; }
    </style>
</head>
<body class="p-4">

<div class="container">
    <h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2>

    <div class="text-end mb-3">
        <a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a>
    </div>

    <form id="formSeg">
        <div class="card shadow p-4 mb-3">
            <div class="section-title">Detalles del Seguimiento (Origen)</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Folio</label>
                    <input id="folio" class="form-control bg-locked" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Solicitó</label>
                    <input id="solicito" class="form-control bg-locked" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Sucursal</label>
                    <input id="sucursal" class="form-control bg-locked" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Archivo Origen</label>
                    <button type="button" id="btnArchivoOrigen" class="btn btn-secondary w-100" disabled>Ver PDF Original</button>
                </div>
            </div>
        </div>

        <div class="card shadow p-4 mb-3">
            <div class="section-title">Seguimiento Depto. Sistemas</div>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Fecha Solicitud a Compras</label>
                    <input id="fechaCompras" type="date" class="form-control">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Descripción del Artículo</label>
                    <input id="descripcion" type="text" class="form-control" placeholder="TEXTO, NÚMEROS Y SÍMBOLOS">
                </div>
            </div>
        </div>

        <div class="card shadow p-4 mb-3">
            <div class="section-title">Seguimiento Compras</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Fecha de Cotización</label>
                    <input id="fechaCot" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Folio de Cotización</label>
                    <input id="folioCot" type="text" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Adjuntar Archivo de Cotización</label>
                    <input id="fileCot" type="file" class="form-control">
                </div>
            </div>
        </div>

        <div class="card shadow p-4 mb-3">
            <div class="section-title">Seguimiento de Autorización</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Quién Autoriza</label>
                    <input id="autoriza" type="text" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Fecha de Autorización</label>
                    <input id="fechaAuto" type="date" class="form-control">
                </div>
            </div>
        </div>

        <div class="card shadow p-4 mb-3">
            <div class="section-title">Seguimiento de Entrega</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Fecha de Entrega</label>
                    <input id="fechaEntrega" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quién Recibe</label>
                    <input id="recibe" type="text" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Folio de Factura</label>
                    <input id="folioFactura" type="text" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Adjuntar Factura</label>
                    <input id="fileFactura" type="file" class="form-control">
                </div>
            </div>
        </div>

        <div class="card shadow p-4 mb-4">
            <div class="section-title">Seguimiento de Envío y Status</div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Fecha de Envío</label>
                    <input id="fechaEnvio" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Quién Envía</label>
                    <input id="envia" type="text" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">A dónde se envía (Maps/Dirección)</label>
                    <input id="adonde" type="text" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select id="status" class="form-select">
                        <option>ENVIADO A COMPRAS</option>
                        <option>ENVIADO A ZONA</option>
                        <option>PENDIENTE POR AUTORIZAR</option>
                        <option>EN SISTEMAS</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Comentarios</label>
                    <textarea id="comentarios" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <div class="mt-4">
                <button type="button" class="btn btn-primary btn-lg w-100" onclick="guardarTodo()">Guardar Seguimiento Completo</button>
            </div>
        </div>
    </form>

    <div class="card shadow p-4">
        <h4 class="fw-bold mb-3">Historial de Seguimientos</h4>
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center">
                <thead class="table-primary">
                    <tr>
                        <th>Folio</th>
                        <th>Sucursal</th>
                        <th>Descripción</th>
                        <th>Status</th>
                        <th>Docs</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaSegBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { database, ref, get, push, onValue, query, orderByChild, equalTo, remove } from "./firebase.js";

    const params = new URLSearchParams(window.location.search);
    const folioURL = params.get("folio");
    let urlArchivoOrigen = null;

    // Cargar datos del folio al iniciar
    async function init() {
        if (!folioURL) return;
        document.getElementById("folio").value = folioURL;

        const q = query(ref(database, "tecnologia"), orderByChild("folio"), equalTo(folioURL));
        const snap = await get(q);
        if (snap.exists()) {
            const data = Object.values(snap.val())[0];
            document.getElementById("solicito").value = data.soporte;
            document.getElementById("sucursal").value = data.sucursal;
            urlArchivoOrigen = data.archivoData;
            if(urlArchivoOrigen) {
                const btn = document.getElementById("btnArchivoOrigen");
                btn.disabled = false;
                btn.classList.replace("btn-secondary", "btn-success");
                btn.onclick = () => window.open(urlArchivoOrigen, "_blank");
            }
        }
    }

    // Helper para convertir archivos a Base64
    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    window.guardarTodo = async () => {
        if(!folioURL) return alert("No hay folio cargado");

        const fileCot = document.getElementById("fileCot").files[0];
        const fileFac = document.getElementById("fileFactura").files[0];

        const data = {
            folio: folioURL,
            solicito: document.getElementById("solicito").value,
            sucursal: document.getElementById("sucursal").value,
            fechaCompras: document.getElementById("fechaCompras").value,
            descripcion: document.getElementById("descripcion").value.toUpperCase(),
            fechaCot: document.getElementById("fechaCot").value,
            folioCot: document.getElementById("folioCot").value.toUpperCase(),
            cotizacionData: fileCot ? await toBase64(fileCot) : null,
            autoriza: document.getElementById("autoriza").value.toUpperCase(),
            fechaAuto: document.getElementById("fechaAuto").value,
            fechaEntrega: document.getElementById("fechaEntrega").value,
            recibe: document.getElementById("recibe").value.toUpperCase(),
            folioFactura: document.getElementById("folioFactura").value.toUpperCase(),
            facturaData: fileFac ? await toBase64(fileFac) : null,
            fechaEnvio: document.getElementById("fechaEnvio").value,
            envia: document.getElementById("envia").value.toUpperCase(),
            adonde: document.getElementById("adonde").value.toUpperCase(),
            status: document.getElementById("status").value,
            comentarios: document.getElementById("comentarios").value.toUpperCase(),
            fechaRegistro: new Date().toLocaleString()
        };

        await push(ref(database, "seguimiento"), data);
        alert("Seguimiento guardado exitosamente");
        document.getElementById("formSeg").reset();
        init(); // Recargar datos base
    };

    onValue(ref(database, "seguimiento"), (snap) => {
        const tbody = document.getElementById("tablaSegBody");
        tbody.innerHTML = "";
        snap.forEach(child => {
            const s = child.val();
            const color = s.status === "ENVIADO A COMPRAS" ? "status-compras" : 
                          s.status === "ENVIADO A ZONA" ? "status-zona" : 
                          s.status === "PENDIENTE POR AUTORIZAR" ? "status-pendiente" : "status-sistemas";

            tbody.innerHTML += `
                <tr>
                    <td>${s.folio}</td>
                    <td>${s.sucursal}</td>
                    <td>${s.descripcion || '---'}</td>
                    <td class="${color} fw-bold">${s.status}</td>
                    <td>
                        ${s.cotizacionData ? `<button class="btn btn-sm btn-outline-primary" onclick="window.open('${s.cotizacionData}')">Cot</button>` : ''}
                        ${s.facturaData ? `<button class="btn btn-sm btn-outline-danger" onclick="window.open('${s.facturaData}')">Fac</button>` : ''}
                    </td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="eliminarSeg('${child.key}')">🗑️</button>
                    </td>
                </tr>`;
        });
    });

    window.eliminarSeg = async (key) => {
        if(confirm("¿Eliminar registro?")) await remove(ref(database, "seguimiento/" + key));
    };

    init();
</script>
</body>
</html>
