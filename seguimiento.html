<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Solicitudes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body { background: #eef1f5; }
    .card { border-radius: 20px; }
    .table thead { background:#0d6efd; color:white; }
    .action-btn { cursor:pointer; font-size:22px; margin-right:10px; }

    /* COLORES AUTOMÁTICOS */
    .status-compras { background:#0d6efd !important; color:white !important; }
    .status-zona { background:#ffc107 !important; color:#000 !important; }
    .status-pendiente { background:#dc3545 !important; color:white !important; }
    .status-sistemas { background:#198754 !important; color:white !important; }
</style>
</head>

<body class="p-4">

<div class="container">
    <h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2>

    <div class="text-end mb-3">
        <a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a>
    </div>

    <div class="card shadow p-4 mb-4">
        <h4 class="fw-bold mb-3">Registrar Seguimiento</h4>

        <form id="formSeg" class="row g-3">
            <div class="col-md-3">
                <label class="form-label fw-bold">Folio</label>
                <input id="folio" class="form-control bg-light" readonly placeholder="Cargando folio...">
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Solicitó</label>
                <input id="solicito" class="form-control bg-light" readonly>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Sucursal</label>
                <input id="sucursal" class="form-control bg-light" readonly>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Archivo</label>
                <button type="button" class="btn btn-secondary w-100" id="btnArchivo" disabled>Ver Archivo Original</button>
            </div>

            <div class="col-md-3">
                <label class="form-label fw-bold">Fecha Solicitud a Compras</label>
                <input id="fechaCompras" class="form-control bg-light" readonly>
            </div>

            <div class="col-md-9">
                <label class="form-label fw-bold">Descripción del Artículo</label>
                <input id="descripcion" class="form-control text-uppercase">
            </div>

            <div class="col-md-4">
                <label class="form-label fw-bold">Status</label>
                <select id="status" class="form-select">
                    <option>ENVIADO A COMPRAS</option>
                    <option>ENVIADO A ZONA</option>
                    <option>PENDIENTE POR AUTORIZAR</option>
                    <option>EN SISTEMAS</option>
                </select>
            </div>

            <div class="col-12 mt-3">
                <button id="btnGuardar" type="button" class="btn btn-primary btn-lg">Guardar Seguimiento</button>
            </div>
        </form>
    </div>

    <div class="card shadow p-4">
        <h4 class="fw-bold mb-3">Historial de este Folio</h4>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Solicitó</th>
                    <th>Descripción</th>
                    <th>Status</th>
                    <th>Fecha Registro</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaSegBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { database, ref, get, push, onValue, query, orderByChild, equalTo, remove } from "./firebase.js";

    // 1. Obtener el folio de la URL (enviado desde tecnologia.html)
    const params = new URLSearchParams(window.location.search);
    const folioURL = params.get("folio");
    
    // Elementos del DOM
    const folioInput = document.getElementById("folio");
    const solInput = document.getElementById("solicito");
    const sucInput = document.getElementById("sucursal");
    const btnArc = document.getElementById("btnArchivo");
    const fCompras = document.getElementById("fechaCompras");

    let dataArchivoOriginal = null; // Para guardar la URL del archivo

    // 2. CARGA AUTOMÁTICA AL ABRIR LA PÁGINA
    async function cargarInformacionBase() {
        if (!folioURL) {
            folioInput.value = "SIN FOLIO";
            return;
        }

        // Ponemos el folio en el input
        folioInput.value = folioURL;
        fCompras.value = new Date().toLocaleString();

        try {
            // Buscamos en el nodo 'tecnologia' los datos de este folio
            const q = query(ref(database, "tecnologia"), orderByChild("folio"), equalTo(folioURL));
            const snap = await get(q);

            if (snap.exists()) {
                const data = snap.val();
                const key = Object.keys(data)[0];
                const registro = data[key];

                // REPLICANDO DATOS AUTOMÁTICAMENTE:
                solInput.value = registro.soporte || ""; // Soporte de la base -> Solicitó
                sucInput.value = registro.sucursal || "";
                dataArchivoOriginal = registro.archivoData || null;

                // Si hay archivo, habilitamos el botón verde
                if (dataArchivoOriginal) {
                    btnArc.disabled = false;
                    btnArc.className = "btn btn-success w-100";
                    btnArc.textContent = "Ver Archivo Original";
                }
            } else {
                console.warn("No se encontraron datos originales para este folio.");
            }
        } catch (error) {
            console.error("Error al conectar con Firebase:", error);
        }
    }

    // Acción del botón Ver Archivo
    btnArc.onclick = () => {
        if (dataArchivoOriginal) {
            const win = window.open("");
            // Creamos un iframe para ver el PDF/Imagen directamente
            win.document.write(`
                <title>Vista de Archivo - ${folioURL}</title>
                <body style="margin:0;">
                    <iframe src="${dataArchivoOriginal}" frameborder="0" style="width:100%; height:100vh;"></iframe>
                </body>
            `);
        }
    };

    // 3. GUARDAR EL NUEVO SEGUIMIENTO
    window.guardarSeguimiento = async () => {
        const desc = document.getElementById("descripcion").value;
        if (!desc) return alert("Por favor, ingrese la descripción del artículo.");

        const nuevoSeg = {
            folio: folioInput.value,
            solicito: solInput.value,
            sucursal: sucInput.value,
            descripcion: desc.toUpperCase(),
            status: document.getElementById("status").value,
            fechaCompras: fCompras.value,
            fechaRegistro: new Date().toLocaleString()
            // Aquí puedes agregar los demás campos: folioCot, fechaCot, etc.
        };

        try {
            await push(ref(database, "seguimiento"), nuevoSeg);
            alert("Seguimiento guardado correctamente.");
            document.getElementById("descripcion").value = "";
        } catch (e) {
            alert("Error al guardar.");
        }
    };

    // 4. TABLA DE HISTORIAL (Solo de este folio)
    onValue(ref(database, "seguimiento"), (snap) => {
        const tbody = document.getElementById("tablaSegBody");
        tbody.innerHTML = "";
        
        snap.forEach(child => {
            const s = child.val();
            if (s.folio === folioURL) {
                const claseStatus = s.status === "ENVIADO A COMPRAS" ? "status-compras" : 
                                   s.status === "ENVIADO A ZONA" ? "status-zona" : 
                                   s.status === "PENDIENTE POR AUTORIZAR" ? "status-pendiente" : "status-sistemas";

                tbody.innerHTML += `
                    <tr>
                        <td>${s.folio}</td>
                        <td>${s.solicito}</td>
                        <td>${s.descripcion}</td>
                        <td>${s.folioCot || 'N/A'}</td>
                        <td class="${claseStatus} fw-bold">${s.status}</td>
                        <td>${s.fechaCompras}</td>
                        <td>
                            <span class="action-btn text-danger" onclick="eliminarSeg('${child.key}')">🗑️</span>
                        </td>
                    </tr>`;
            }
        });
    });

    window.eliminarSeg = async (key) => {
        if(confirm("¿Eliminar este registro de historial?")) {
            await remove(ref(database, "seguimiento/" + key));
        }
    };

    // Iniciar carga al cargar la página
    cargarInformacionBase();
</script>
</body>
</html>
