<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Solicitudes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background: #eef1f5; }
.card { border-radius: 20px; }
.table thead { background:#0d6efd; color:white; }
.action-btn { cursor:pointer; font-size:20px; margin-right:8px; }

.status-compras { background:#0d6efd !important; color:white !important; }
.status-zona { background:#ffc107 !important; color:#000 !important; }
.status-pendiente { background:#dc3545 !important; color:white !important; }
.status-sistemas { background:#198754 !important; color:white !important; }
</style>
</head>

<body class="p-4">
<div class="container">

<h2 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h2>

<div class="text-end mb-3">
<a href="tecnologia.html" class="btn btn-dark">Ir a Tecnología</a>
</div>

<!-- FORMULARIO -->
<div class="card shadow p-4 mb-4">
<h4 class="fw-bold mb-3">Registrar Seguimiento</h4>

<form id="formSeg" class="row g-3">

<div class="col-md-3">
<label class="fw-bold">Folio</label>
<select id="folio" class="form-select"></select>
</div>

<div class="col-md-3">
<label class="fw-bold">Solicitó</label>
<input id="solicito" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Sucursal</label>
<input id="sucursal" class="form-control" readonly>
</div>

<div class="col-md-3">
<label class="fw-bold">Archivo Solicitud</label>
<button type="button" class="btn btn-secondary w-100" onclick="verArchivo()" id="btnArchivo" disabled>Ver</button>
</div>

<div class="col-md-3">
<label class="fw-bold">Fecha Solicitud a Compras</label>
<input id="fechaCompras" class="form-control" readonly>
</div>

<div class="col-md-6">
<label class="fw-bold">Descripción del Artículo</label>
<input id="descripcion" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Folio Cotización</label>
<input id="folioCot" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Fecha Cotización</label>
<input id="fechaCot" type="date" class="form-control">
</div>

<div class="col-md-6">
<label class="fw-bold">Archivo Cotización</label>
<input type="file" id="archivoCotizacion" class="form-control">
</div>

<div class="col-md-3">
<label class="fw-bold">Autoriza</label>
<input id="autoriza" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Fecha Autorización</label>
<input id="fechaAuto" type="date" class="form-control">
</div>

<div class="col-md-4">
<label class="fw-bold">Recibe</label>
<input id="recibe" class="form-control text-uppercase">
</div>

<div class="col-md-4">
<label class="fw-bold">Fecha Entrega</label>
<input id="fechaEntrega" type="date" class="form-control">
</div>

<div class="col-md-4">
<label class="fw-bold">Folio Factura</label>
<input id="folioFactura" class="form-control text-uppercase">
</div>

<div class="col-md-6">
<label class="fw-bold">Archivo Factura</label>
<input type="file" id="archivoFactura" class="form-control">
</div>

<div class="col-md-3">
<label class="fw-bold">Envía</label>
<input id="envia" class="form-control text-uppercase">
</div>

<div class="col-md-3">
<label class="fw-bold">Fecha Envío</label>
<input id="fechaEnvio" type="date" class="form-control">
</div>

<div class="col-md-3">
<label class="fw-bold">Status</label>
<select id="status" class="form-select">
<option>ENVIADO A COMPRAS</option>
<option>ENVIADO A ZONA</option>
<option>PENDIENTE POR AUTORIZAR</option>
<option>EN SISTEMAS</option>
</select>
</div>

<div class="col-12">
<label class="fw-bold">Comentarios</label>
<textarea id="comentarios" class="form-control text-uppercase"></textarea>
</div>

<div class="col-12">
<button type="button" class="btn btn-primary btn-lg" onclick="guardarSeguimiento()">Guardar Seguimiento</button>
</div>

</form>
</div>

<!-- TABLA -->
<div class="card shadow p-4">
<h4 class="fw-bold mb-3">Tabla de Seguimiento</h4>

<table class="table table-bordered">
<thead>
<tr>
<th>Folio</th>
<th>Solicitó</th>
<th>Descripción</th>
<th>Status</th>
<th>Fecha Compras</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaSegBody"></tbody>
</table>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
import { database, ref, get } from "./firebase.js";
import { storage } from "./firebase.js";
import { ref as sRef, uploadBytes, getDownloadURL } from
"https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

let seguimiento = JSON.parse(localStorage.getItem("seguimientoLS")||"[]");
let archivoActual=null;

const solicitudesRef = ref(database,"tecnologia");
fechaCompras.value = new Date().toLocaleString();

/* ================= CARGAR FOLIOS ================= */
async function cargarFolios(){
  const snap = await get(solicitudesRef);
  folio.innerHTML="<option value=''>Seleccione</option>";
  if(!snap.exists())return;
  snap.forEach(c=>{
    folio.innerHTML+=`<option>${c.val().folio}</option>`;
  });
}
folio.addEventListener("change",()=>cargarDatosFolio(folio.value));

async function cargarDatosFolio(f){
  const snap=await get(solicitudesRef);
  snap.forEach(c=>{
    if(c.val().folio===f){
      solicito.value=c.val().soporte;
      sucursal.value=c.val().sucursal;
      archivoActual=c.val().archivoData||null;
      btnArchivo.disabled=!archivoActual;
    }
  });
}

window.verArchivo=()=> archivoActual && window.open(archivoActual);

/* ================= SUBIR ARCHIVO ================= */
async function subirArchivo(file,carpeta,folio){
  const r=sRef(storage,`${carpeta}/${folio}_${Date.now()}_${file.name}`);
  await uploadBytes(r,file);
  return await getDownloadURL(r);
}

/* ================= GUARDAR ================= */
window.guardarSeguimiento=async()=>{
  let urlCot="", urlFac="";
  if(archivoCotizacion.files[0]) urlCot=await subirArchivo(archivoCotizacion.files[0],"cotizaciones",folio.value);
  if(archivoFactura.files[0]) urlFac=await subirArchivo(archivoFactura.files[0],"facturas",folio.value);

  seguimiento.push({
    folio:folio.value,
    solicito:solicito.value,
    descripcion:descripcion.value,
    fechaCompras:fechaCompras.value,
    status:status.value,
    archivoCotizacion:urlCot,
    archivoFactura:urlFac
  });

  localStorage.setItem("seguimientoLS",JSON.stringify(seguimiento));
  actualizarTabla();
  formSeg.reset();
};

/* ================= TABLA ================= */
function aplicarColor(s){
  return s==="EN SISTEMAS"?"status-sistemas":
         s==="ENVIADO A ZONA"?"status-zona":
         s==="PENDIENTE POR AUTORIZAR"?"status-pendiente":
         "status-compras";
}

function actualizarTabla(){
  tablaSegBody.innerHTML="";
  seguimiento.forEach((s,i)=>{
    tablaSegBody.innerHTML+=`
    <tr>
      <td>${s.folio}</td>
      <td>${s.solicito}</td>
      <td>${s.descripcion}</td>
      <td class="${aplicarColor(s.status)} fw-bold">${s.status}</td>
      <td>${s.fechaCompras}</td>
      <td>
        ${s.archivoCotizacion ? `<span class="action-btn" title="Ver Cotización" onclick="window.open('${s.archivoCotizacion}')">📄</span>` : ``}
        ${s.archivoFactura ? `<span class="action-btn" title="Ver Factura" onclick="window.open('${s.archivoFactura}')">🧾</span>` : ``}
        <span class="action-btn text-danger" onclick="eliminarSeguimiento(${i})">🗑️</span>
      </td>
    </tr>`;
  });
}

window.eliminarSeguimiento=i=>{
  if(confirm("¿Eliminar seguimiento?")){
    seguimiento.splice(i,1);
    localStorage.setItem("seguimientoLS",JSON.stringify(seguimiento));
    actualizarTabla();
  }
};

cargarFolios();
actualizarTabla();
</script>
</body>
</html>
