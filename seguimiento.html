<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Solicitudes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#eef1f5;}
        .card{border-radius:20px;}
        .table thead{background:#0d6efd;color:white;}
    </style>
</head>
<body class="p-4">
<div class="container">
    <h3 class="fw-bold text-center mb-4">Seguimiento de Solicitudes</h3>
    <div class="card shadow p-4 mb-4">
        <form id="formSeg" class="row g-3">
            <h6 class="fw-bold text-primary">Detalles del Seguimiento</h6>
            <div class="col-md-3">
                <label>Folio</label>
                <input id="folio" class="form-control" readonly>
            </div>
            <div class="col-md-3">
                <label>Solicitó</label>
                <input id="solicito" class="form-control" readonly>
            </div>
            <div class="col-md-3">
                <label>Sucursal</label>
                <input id="sucursal" class="form-control" readonly>
            </div>
            <div class="col-md-3">
                <label>Archivo Solicitud</label>
                <button id="btnArchivo" type="button" class="btn btn-secondary w-100" disabled>Ver Archivo</button>
            </div>
            <hr>
            <h6 class="fw-bold text-primary">Seguimiento Depto. Sistemas</h6>
            <div class="col-md-3">
                <label>Fecha solicitud a compras</label>
                <input id="fechaCompras" class="form-control" readonly>
            </div>
            <div class="col-md-9">
                <label>Descripción del artículo</label>
                <input id="descripcion" class="form-control text-uppercase">
            </div>
            <hr>
            <h6 class="fw-bold text-primary">Seguimiento Compras</h6>
            <div class="col-md-3">
                <label>Fecha cotización</label>
                <input id="fechaCot" type="date" class="form-control">
            </div>
            <div class="col-md-3">
                <label>Folio cotización</label>
                <input id="folioCot" class="form-control text-uppercase">
            </div>
            <div class="col-md-6">
                <label>Archivo cotización</label>
                <input type="file" id="archivoCotizacion" class="form-control">
            </div>
            <hr>
            <h6 class="fw-bold text-primary">Seguimiento Entrega</h6>
            <div class="col-md-3">
                <label>Fecha entrega</label>
                <input id="fechaEntrega" type="date" class="form-control">
            </div>
            <div class="col-md-3">
                <label>Quién recibe</label>
                <input id="recibe" class="form-control text-uppercase">
            </div>
            <div class="col-md-6">
                <label>Archivo factura</label>
                <input type="file" id="archivoFactura" class="form-control">
            </div>
            <hr>
            <h6 class="fw-bold text-primary">Seguimiento Envío</h6>
            <div class="col-md-3">
                <label>Fecha envío</label>
                <input id="fechaEnvio" type="date" class="form-control">
            </div>
            <div class="col-md-3">
                <label>Quién envía</label>
                <input id="envia" class="form-control text-uppercase">
            </div>
            <div class="col-md-3">
                <label>A dónde se envía</label>
                <input id="destino" class="form-control text-uppercase">
            </div>
            <div class="col-md-3">
                <label>Status</label>
                <select id="status" class="form-select">
                    <option>ENVIADO A COMPRAS</option>
                    <option>ENVIADO A ZONA</option>
                    <option>PENDIENTE POR AUTORIZAR</option>
                    <option>EN SISTEMAS</option>
                </select>
            </div>
            <hr>
            <div class="col-12">
                <label>Comentarios</label>
                <textarea id="comentarios" class="form-control text-uppercase"></textarea>
            </div>
            <div class="col-12 mt-3">
                <button type="button" class="btn btn-primary" onclick="guardarSeguimiento()">Guardar Seguimiento</button>
            </div>
        </form>
    </div>
    <div class="card shadow p-4">
        <h5 class="fw-bold">Tabla de Seguimiento</h5>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Folio</th>
                    <th>Descripción</th>
                    <th>Status</th>
                    <th>Fecha</th>
                    <th>Archivos</th>
                </tr>
            </thead>
            <tbody id="tablaSegBody"></tbody>
        </table>
    </div>
</div>

<script type="module">
import { database, ref, get, push, onValue, query, orderByChild, equalTo } from "./firebase.js";
import { storage } from "./firebase.js";
import { ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

// 1. Obtener el folio de la URL
const params = new URLSearchParams(window.location.search);
const folioURL = params.get("folio");

// 2. Referencias a los elementos del formulario
const folioInput = document.getElementById("folio");
const solicitoInput = document.getElementById("solicito");
const sucursalInput = document.getElementById("sucursal");
const btnArchivo = document.getElementById("btnArchivo");
const fechaCompras = document.getElementById("fechaCompras");
const tablaSegBody = document.getElementById("tablaSegBody");

let archivoSolicitudData = null;

// Referencias a Firebase
const solicitudesRef = ref(database, "tecnologia");
const seguimientoRef = ref(database, "seguimiento");

// Fecha automática
fechaCompras.value = new Date().toLocaleString();

async function cargarSolicitud() {
    if (!folioURL) {
        console.error("No se detectó ningún folio en la URL. Asegúrate de que la URL sea: seguimiento.html?folio=VALOR");
        return;
    }

    console.log("Iniciando búsqueda del folio:", folioURL);

    try {
        // Usamos una consulta filtrada (Query) para encontrar el folio exacto
        const consulta = query(solicitudesRef, orderByChild("folio"), equalTo(folioURL));
        const snap = await get(consulta);

        if (snap.exists()) {
            console.log("¡Folio encontrado en Firebase!");
            
            // Firebase devuelve un objeto con IDs únicos, extraemos el contenido
            const datos = snap.val();
            const idFirebase = Object.keys(datos)[0];
            const s = datos[idFirebase];

            // ASIGNACIÓN DE DATOS A LOS INPUTS
            folioInput.value = s.folio || "Sin Folio";
            solicitoInput.value = s.soporte || "Sin Solicitante";
            sucursalInput.value = s.sucursal || "Sin Sucursal";
            archivoSolicitudData = s.archivoData || null;

            if (archivoSolicitudData) {
                btnArchivo.disabled = false;
                btnArchivo.className = "btn btn-success w-100";
            }
        } else {
            console.warn("No existe ningún registro con el folio:", folioURL);
            alert("No se encontró la solicitud original.");
        }
    } catch (error) {
        console.error("Error crítico al cargar solicitud:", error);
    }
}

// Evento para el botón de ver archivo
btnArchivo.onclick = () => {
    if (archivoSolicitudData) {
        const win = window.open();
        win.document.write(`<iframe src="${archivoSolicitudData}" frameborder="0" style="border:0; width:100%; height:100%;" allowfullscreen></iframe>`);
    }
};

// Guardar nuevo seguimiento
window.guardarSeguimiento = async () => {
    // ... (Tu lógica de guardar se mantiene igual)
    const descripcion = document.getElementById("descripcion").value;
    const status = document.getElementById("status").value;

    if (!folioInput.value) {
        alert("Error: No hay un folio cargado para asociar el seguimiento.");
        return;
    }

    await push(seguimientoRef, {
        folio: folioInput.value,
        descripcion: descripcion,
        status: status,
        fecha: new Date().toLocaleString()
    });

    alert("Seguimiento guardado");
    location.reload();
};

// Cargar la tabla de historial
onValue(seguimientoRef, snap => {
    tablaSegBody.innerHTML = "";
    snap.forEach(c => {
        const s = c.val();
        if (s.folio === folioURL) {
            tablaSegBody.innerHTML += `
            <tr>
                <td>${s.folio}</td>
                <td>${s.descripcion}</td>
                <td>${s.status}</td>
                <td>${s.fecha}</td>
                <td>-</td>
            </tr>`;
        }
    });
});

// EJECUCIÓN INICIAL
cargarSolicitud();

</script>
</body>
</html>
