<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Base - Registro de Personal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="p-4 bg-light">

<h2>Registro de Personal</h2>

<div class="card p-4 shadow">
<form id="formPersonal" class="row g-3">

  <div class="col-md-4">
    <label>Empresa</label>
    <input id="empresa" class="form-control">
  </div>

  <div class="col-md-4">
    <label>Zona</label>
    <input id="zona" class="form-control">
  </div>

  <div class="col-md-4">
    <label>Puesto</label>
    <input id="puesto" class="form-control">
  </div>

  <div class="col-md-6">
    <label>Nombre</label>
    <input id="nombre" class="form-control">
  </div>

  <div class="col-md-6">
    <label>Correo</label>
    <input id="correo" class="form-control">
  </div>

  <div class="col-md-6">
    <label>Usuario</label>
    <input id="usuario" class="form-control">
  </div>

  <div class="col-md-6">
    <label>Contraseña</label>
    <input id="contrasena" type="password" class="form-control">
  </div>

  <div class="col-12">
    <button type="button" class="btn btn-success" onclick="guardarPersonal()">Guardar</button>
    <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">Regresar</button>
  </div>

</form>
</div>

<hr>

<h4>Usuarios Registrados</h4>
<table class="table table-bordered">
<thead class="table-dark">
<tr>
<th>Empresa</th><th>Zona</th><th>Nombre</th><th>Puesto</th><th>Usuario</th><th>Status</th>
</tr>
</thead>
<tbody id="tablaBody"></tbody>
</table>

<script type="module">
import { database, ref, set, onValue } from "./firebase.js";

window.guardarPersonal = function(){
  const data = {
    empresa: empresa.value,
    zona: zona.value,
    nombre: nombre.value.toUpperCase(),
    correo: correo.value,
    puesto: puesto.value,
    usuario: usuario.value.toUpperCase(),
    contrasena: contrasena.value,
    bloqueado: false
  };

  if(!data.usuario || !data.contrasena){
    alert("Usuario y contraseña obligatorios");
    return;
  }

  set(ref(database, "usuarios/" + data.usuario), data)
    .then(()=>{
      alert("Usuario guardado");
      formPersonal.reset();
    });
};

onValue(ref(database, "usuarios"), snapshot=>{
  tablaBody.innerHTML = "";
  snapshot.forEach(child=>{
    const u = child.val();
    tablaBody.innerHTML += `
      <tr>
        <td>${u.empresa}</td>
        <td>${u.zona}</td>
        <td>${u.nombre}</td>
        <td>${u.puesto}</td>
        <td>${u.usuario}</td>
        <td>${u.bloqueado ? "Inactivo" : "Activo"}</td>
      </tr>`;
  });
});
</script>

</body>
</html>
