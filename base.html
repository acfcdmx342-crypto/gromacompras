<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Base - Registro de Personal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<style>
.action-btn{
  cursor:pointer;
  font-size:18px;
  margin-right:10px;
}
</style>
</head>

<body class="p-4 bg-light">

<h2>Registro de Personal</h2>

<!-- ================= FORMULARIO ================= -->
<div class="card p-4 shadow">
<form id="formPersonal" class="row g-3">

  <div class="col-md-4">
    <label>Empresa</label>
    <input id="empresa" class="form-control">
  </div>

  <div class="col-md-4">
    <label>Zona</label>
    <input id="zona" class="form-control">
  </div>

  <div class="col-md-4">
    <label>Puesto</label>
    <input id="puesto" class="form-control">
  </div>

  <div class="col-md-6">
    <label>Nombre</label>
    <input id="nombre" class="form-control">
  </div>

  <div class="col-md-6">
    <label>Correo</label>
    <input id="correo" class="form-control">
  </div>

  <div class="col-md-6">
    <label>Usuario</label>
    <input id="usuario" class="form-control">
  </div>

  <div class="col-md-6">
    <label>Contraseña</label>
    <input id="contrasena" type="password" class="form-control">
  </div>

  <div class="col-12">
    <button type="button" class="btn btn-success" onclick="guardarPersonal()">Guardar</button>
    <button type="button" class="btn btn-secondary" onclick="location.href='index.html'">Regresar</button>
  </div>

</form>
</div>

<hr>

<!-- ================= TABLA ================= -->
<h4>Usuarios Registrados</h4>

<table class="table table-bordered table-striped">
<thead class="table-dark">
<tr>
<th>Empresa</th>
<th>Zona</th>
<th>Nombre</th>
<th>Puesto</th>
<th>Usuario</th>
<th>Contraseña</th>
<th>Status</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaBody"></tbody>
</table>

<!-- ================= MODAL EDITAR ================= -->
<div class="modal fade" id="modalEditar" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Editar Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label class="fw-bold">Usuario</label>
          <input id="editUsuario" class="form-control">
        </div>

        <div class="mb-3">
          <label class="fw-bold">Contraseña</label>
          <input id="editContrasena" type="password" class="form-control">
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarEdicion()">Guardar cambios</button>
      </div>

    </div>
  </div>
</div>

<!-- ================= FIREBASE ================= -->
<script type="module">
import { database, ref, set, onValue, update, remove, get } from "./firebase.js";

let usuarioActual = null;
let modal;

/* ===== GUARDAR ===== */
window.guardarPersonal = function(){
  const data = {
    empresa: empresa.value,
    zona: zona.value,
    nombre: nombre.value.toUpperCase(),
    correo: correo.value,
    puesto: puesto.value,
    usuario: usuario.value.toUpperCase(),
    contrasena: contrasena.value,
    bloqueado: false
  };

  if(!data.usuario || !data.contrasena){
    alert("Usuario y contraseña obligatorios");
    return;
  }

  set(ref(database,"usuarios/"+data.usuario),data)
    .then(()=>{
      alert("Usuario guardado");
      formPersonal.reset();
    });
};

/* ===== LISTAR ===== */
onValue(ref(database,"usuarios"),snapshot=>{
  tablaBody.innerHTML="";
  snapshot.forEach(child=>{
    const u=child.val();
    tablaBody.innerHTML+=`
      <tr>
        <td>${u.empresa}</td>
        <td>${u.zona}</td>
        <td>${u.nombre}</td>
        <td>${u.puesto}</td>
        <td>${u.usuario}</td>
        <td>${u.contrasena}</td>
        <td>${u.bloqueado?"Inactivo":"Activo"}</td>
        <td>
          <i class="fa-solid fa-pen action-btn text-primary"
             onclick="abrirModal('${u.usuario}')"></i>

          <i class="fa-solid fa-ban action-btn text-warning"
             onclick="bloquearUsuario('${u.usuario}',${u.bloqueado})"></i>

          <i class="fa-solid fa-trash action-btn text-danger"
             onclick="eliminarUsuario('${u.usuario}')"></i>
        </td>
      </tr>
    `;
  });
});

/* ===== ABRIR MODAL ===== */
window.abrirModal = async function(usuario){
  usuarioActual = usuario;

  const snap = await get(ref(database,"usuarios/"+usuario));
  if(!snap.exists()) return;

  const u = snap.val();
  editUsuario.value = u.usuario;
  editContrasena.value = u.contrasena;

  modal = new bootstrap.Modal(document.getElementById("modalEditar"));
  modal.show();
};

/* ===== GUARDAR EDICIÓN ===== */
window.guardarEdicion = async function(){
  const nuevoUsuario = editUsuario.value.toUpperCase();
  const nuevaPass = editContrasena.value;

  if(!nuevoUsuario || !nuevaPass){
    alert("Campos obligatorios");
    return;
  }

  const refActual = ref(database,"usuarios/"+usuarioActual);
  const snap = await get(refActual);
  const data = snap.val();

  data.usuario = nuevoUsuario;
  data.contrasena = nuevaPass;

  if(nuevoUsuario !== usuarioActual){
    await set(ref(database,"usuarios/"+nuevoUsuario),data);
    await remove(refActual);
  } else {
    await update(refActual,{contrasena:nuevaPass});
  }

  modal.hide();
  alert("Usuario actualizado");
};

/* ===== BLOQUEAR ===== */
window.bloquearUsuario = function(usuario,estado){
  update(ref(database,"usuarios/"+usuario),{
    bloqueado:!estado
  });
};

/* ===== ELIMINAR ===== */
window.eliminarUsuario = function(usuario){
  if(confirm("¿Eliminar usuario definitivamente?")){
    remove(ref(database,"usuarios/"+usuario));
  }
};
</script>

</body>
</html>
