<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Visitas IT</title>
    <style>
        :root {
            --primary: #003366;
            --secondary: #f4f7f6;
            --accent: #27ae60;
            --danger: #e74c3c;
            --border: #d1d8e0;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--secondary); padding: 20px; color: #333; }
        
        .card { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h2 { margin: 0; color: var(--primary); }

        /* Botón Regresar / Nueva Evaluación */
        .btn-nav {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }
        .btn-nav:hover { background: #002244; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid var(--border); text-align: left; }
        th { background: #f8f9fa; color: var(--primary); font-size: 14px; }
        
        .btn-ver { 
            background: var(--danger); 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            cursor: pointer; 
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-ver:hover { opacity: 0.8; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
        .modal-content { background: white; margin: 5% auto; padding: 25px; width: 50%; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .close { float: right; cursor: pointer; font-size: 28px; font-weight: bold; color: #999; }
        .close:hover { color: #333; }

        .fail-item { 
            padding: 12px; 
            border-left: 4px solid var(--danger); 
            background: #fff5f5; 
            margin-bottom: 8px; 
            border-bottom: 1px solid #eee;
        }
        .fail-item b { color: #2c3e50; display: block; margin-bottom: 3px; }
        .badge-resp { 
            font-size: 10px; 
            background: #e0e0e0; 
            padding: 2px 6px; 
            border-radius: 10px; 
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-flex">
        <h2>Historial de Visitas IT</h2>
        <a href="checklist.html" class="btn-nav">+ Nueva Evaluación</a>
    </div>

    <table id="tablaVisitas">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Sucursal</th>
                <th>Folio</th>
                <th>Cumplimiento</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<div id="modalPendientes" class="modal">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal()">&times;</span>
        <h3 id="modalTitulo" style="color: var(--primary);">Pendientes Identificados</h3>
        <hr>
        <div id="listaPendientes" style="max-height: 400px; overflow-y: auto; margin-top: 15px;"></div>
    </div>
</div>

<script>
    function cargarHistorial() {
        const historial = JSON.parse(localStorage.getItem('visitasIT')) || [];
        const tbody = document.querySelector('#tablaVisitas tbody');
        tbody.innerHTML = "";

        // Ordenar por fecha (más reciente primero)
        historial.reverse().forEach(visita => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${visita.fecha || 'N/A'}</td>
                <td>${visita.sucursal}</td>
                <td><small>${visita.folio}</small></td>
                <td style="font-weight:bold; color: var(--accent)">${visita.cumplimiento}</td>
                <td>
                    <button class="btn-ver" onclick="verPendientes(${visita.id})">Ver Fallos</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        if(historial.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No hay registros en el historial.</td></tr>";
        }
    }

    function verPendientes(id) {
        const historial = JSON.parse(localStorage.getItem('visitasIT')) || [];
        const visita = historial.find(v => v.id === id);
        const lista = document.getElementById('listaPendientes');
        const modal = document.getElementById('modalPendientes');
        
        if(!visita) return;

        document.getElementById('modalTitulo').innerText = `${visita.sucursal} - Folio: ${visita.folio}`;
        lista.innerHTML = "";

        let hayPendientes = false;
        
        // Recorremos el detalle guardado
        if(visita.detalleEvaluacion) {
            for (let key in visita.detalleEvaluacion) {
                const item = visita.detalleEvaluacion[key];
                if (item.cumple === false) {
                    hayPendientes = true;
                    const div = document.createElement('div');
                    div.className = "fail-item";
                    div.innerHTML = `
                        <b>${item.titulo}</b>
                        <span class="badge-resp">Resp: ${item.responsable}</span>
                    `;
                    lista.appendChild(div);
                }
            }
        }

        if (!hayPendientes) {
            lista.innerHTML = "<div style='text-align:center; padding:20px;'>✅ Todo se encontraba en orden en esta visita.</div>";
        }

        modal.style.display = "block";
    }

    function cerrarModal() {
        document.getElementById('modalPendientes').style.display = "none";
    }

    // Cerrar modal al hacer clic fuera de él
    window.onclick = (event) => {
        const modal = document.getElementById('modalPendientes');
        if (event.target == modal) cerrarModal();
    }

    window.onload = cargarHistorial;
</script>

</body>
</html>
