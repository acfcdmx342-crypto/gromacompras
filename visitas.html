<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Visitas IT</title>
    <style>
        :root {
            --primary: #003366;
            --secondary: #f4f7f6;
            --accent: #27ae60;
            --danger: #e74c3c;
            --border: #d1d8e0;
            --warning: #f39c12;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--secondary); padding: 20px; color: #333; }
        
        .card { 
            max-width: 1300px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h2 { margin: 0; color: var(--primary); }

        .btn-nav {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }
        .btn-nav:hover { background: #002244; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { padding: 10px; border: 1px solid var(--border); text-align: left; }
        th { background: #f8f9fa; color: var(--primary); }
        
        .actions-cell { display: flex; gap: 5px; flex-wrap: wrap; }

        .btn-action { 
            border: none; 
            padding: 6px 8px; 
            cursor: pointer; 
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            color: white;
            transition: opacity 0.2s;
            text-transform: uppercase;
        }

        .btn-view { background: var(--primary); }
        .btn-note { background: var(--warning); }
        .btn-delete { background: var(--danger); }
        .btn-action:hover { opacity: 0.8; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
        .modal-content { background: white; margin: 5% auto; padding: 25px; width: 50%; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .close { float: right; cursor: pointer; font-size: 28px; font-weight: bold; color: #999; }

        .fail-item { 
            padding: 12px; 
            border-left: 4px solid var(--danger); 
            background: #fff5f5; 
            margin-bottom: 8px; 
        }
        .fail-item b { color: #2c3e50; display: block; }
        .badge-resp { font-size: 10px; background: #ddd; padding: 2px 6px; border-radius: 10px; }
        
        .obs-text { max-width: 250px; white-space: normal; word-wrap: break-word; font-style: italic; color: #555; line-height: 1.4; }
        .nota-adicional { color: var(--primary); font-weight: bold; display: block; margin-top: 4px; border-top: 1px dashed #ccc; padding-top: 2px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-flex">
        <h2>Historial de Visitas IT</h2>
        <a href="Checklist.html" class="btn-nav">+ Nueva Evaluación</a>
    </div>

    <table id="tablaVisitas">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Empresa</th>
                <th>Zona</th>
                <th>Sucursal</th>
                <th>Folio</th>
                <th>%</th>
                <th>Fecha Tentativa</th>
                <th>Observaciones</th>
                <th style="width: 180px;">Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div id="modalPendientes" class="modal">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal()">&times;</span>
        <h3 id="modalTitulo">Detalles de la Visita</h3>
        <hr>
        <div id="listaPendientes" style="max-height: 400px; overflow-y: auto; margin-top: 15px;"></div>
    </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    databaseURL: "https://mydbu-fbc33-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function cargarHistorial() {
    const visitasRef = ref(db, 'visitasIT');

    onValue(visitasRef, (snapshot) => {
        const data = snapshot.val() || {};
        const historial = Object.entries(data).map(([id, val]) => ({
            id,
            ...val
        }));

        pintarTabla(historial);
    });
}

function pintarTabla(historial) {
    const tbody = document.querySelector('#tablaVisitas tbody');
    tbody.innerHTML = "";

    historial.reverse().forEach((visita) => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
            <td>${visita.fecha || 'N/A'}</td>
            <td>${visita.empresa || '-'}</td>
            <td>${visita.zona || '-'}</td>
            <td>${visita.sucursal || '-'}</td>
            <td>${visita.folio || '-'}</td>
            <td><b>${visita.cumplimiento || '0%'}</b></td>
            <td>${visita.fechaSolucion || '-'}</td>
            <td>${visita.observaciones || ''}</td>
            <td>
                <button onclick="verPendientes('${visita.id}')">VER</button>
                <button onclick="agregarNota('${visita.id}')">NOTA</button>
                <button onclick="eliminarRegistro('${visita.id}')">BORRAR</button>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

// ================== FUNCIONES ==================
window.verPendientes = function(id) {
    const visitasRef = ref(db, 'visitasIT/' + id);

    onValue(visitasRef, (snap) => {
        const visita = snap.val();
        if(!visita) return;

        const lista = document.getElementById('listaPendientes');
        lista.innerHTML = "";

        let hay = false;

        for (let key in visita.detalleEvaluacion) {
            const item = visita.detalleEvaluacion[key];
            if (item.cumple === false) {
                hay = true;
                const div = document.createElement('div');
                div.innerHTML = `<b>${item.titulo}</b> - ${item.responsable}`;
                lista.appendChild(div);
            }
        }

        if (!hay) lista.innerHTML = "Sin pendientes";

        document.getElementById('modalPendientes').style.display = "block";
    }, { onlyOnce: true });
};

window.eliminarRegistro = function(id) {
    if(confirm("¿Eliminar registro?")) {
        remove(ref(db, 'visitasIT/' + id));
    }
};

window.agregarNota = function(id) {
    const nota = prompt("Escribe la nota:");
    if(!nota) return;

    const refVisita = ref(db, 'visitasIT/' + id);

    onValue(refVisita, (snap) => {
        const data = snap.val();
        const nuevaObs = (data.observaciones || "") + "\n[NOTA]: " + nota;

        update(refVisita, { observaciones: nuevaObs });
    }, { onlyOnce: true });
};

window.cerrarModal = function() {
    document.getElementById('modalPendientes').style.display = "none";
};

window.onload = cargarHistorial;
</script>
</body>
</html>
