<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Visitas IT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #003366;
            --secondary: #f4f7f6;
            --accent: #27ae60;
            --danger: #e74c3c;
            --border: #d1d8e0;
            --warning: #f39c12;
            --dark: #34495e;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--secondary); padding: 20px; color: #333; }
        
        .card { 
            max-width: 1300px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h2 { margin: 0; color: var(--primary); }

        .btn-nav {
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }
        .btn-nav:hover { background: #002244; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { padding: 10px; border: 1px solid var(--border); text-align: left; }
        th { background: #f8f9fa; color: var(--primary); }
        
        .btn-action { 
            border: none; 
            padding: 5px 8px; 
            cursor: pointer; 
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            color: white;
            margin-right: 2px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .btn-view { background: var(--primary); }
        .btn-pdf { background: var(--dark); }
        .btn-note { background: var(--warning); }
        .btn-delete { background: var(--danger); }
        
        #pdf-template { display: none; background: white; }
        
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
        .modal-content { background: white; margin: 5% auto; padding: 25px; width: 50%; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .close { float: right; cursor: pointer; font-size: 28px; font-weight: bold; color: #999; }
        
        .fail-item { border-left: 4px solid var(--danger); padding: 8px; margin-bottom: 5px; background: #fff5f5; font-size: 13px; }
        .badge-resp { background: #eee; padding: 2px 5px; border-radius: 3px; font-size: 11px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-flex">
        <h2>Historial de Visitas IT</h2>
        <a href="Checklist.html" class="btn-nav">+ Nueva Evaluación</a>
    </div>

    <table id="tablaVisitas">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Empresa</th>
                <th>Zona</th>
                <th>Sucursal</th>
                <th>Folio</th>
                <th>%</th>
                <th>Fecha Solución</th>
                <th>Observaciones</th>
                <th style="width: 220px;">Acciones</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div id="pdf-template"></div>

<div id="modalPendientes" class="modal">
    <div class="modal-content">
        <span class="close" onclick="cerrarModal()">&times;</span>
        <h3 id="modalTitulo">Detalles de la Visita</h3>
        <hr>
        <div id="listaPendientes" style="max-height: 400px; overflow-y: auto; margin-top: 15px;"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    databaseURL: "https://mydbu-fbc33-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function cargarHistorial() {
    const visitasRef = ref(db, 'visitasIT');
    onValue(visitasRef, (snapshot) => {
        const data = snapshot.val() || {};
        const historial = Object.entries(data).map(([id, val]) => ({
            id,
            ...val
        }));
        pintarTabla(historial);
    });
}

function pintarTabla(historial) {
    const tbody = document.querySelector('#tablaVisitas tbody');
    tbody.innerHTML = "";

    historial.reverse().forEach((visita) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${visita.fecha || 'N/A'}</td>
            <td>${visita.empresa || '-'}</td>
            <td>${visita.zona || '-'}</td>
            <td>${visita.sucursal || '-'}</td>
            <td>${visita.folio || '-'}</td>
            <td><b>${visita.cumplimiento || '0%'}</b></td>
            <td>${visita.fechaSolucion || '-'}</td>
            <td>${visita.observaciones || ''}</td>
            <td>
                <button class="btn-action btn-view" onclick="verPendientes('${visita.id}')">Ver</button>
                <button class="btn-action btn-pdf" onclick="recuperarPDF('${visita.id}')">PDF</button>
                <button class="btn-action btn-note" onclick="agregarNota('${visita.id}')">Nota</button>
                <button class="btn-action btn-delete" onclick="eliminarRegistro('${visita.id}')">Borrar</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// ================== FUNCIÓN RECUPERAR PDF COMPLETO ==================
window.recuperarPDF = async function(id) {
    const snap = await get(ref(db, 'visitasIT/' + id));
    if(!snap.exists()) return alert("No se encontraron datos");
    
    const v = snap.val();
    const temp = document.getElementById('pdf-template');
    
    let detalleCompletoHTML = "";
    
    for(let key in v.detalleEvaluacion) {
        const item = v.detalleEvaluacion[key];
        const statusText = item.cumple ? "CUMPLE" : "NO CUMPLE";
        const statusColor = item.cumple ? "#27ae60" : "#e74c3c";
        
        // ✅ FIX: SOPORTE PARA ARRAY DE IMÁGENES
        let imagenesHTML = `
            <div style="width: 100px; height: 75px; background: #f9f9f9; border: 1px dashed #ccc; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #999;">
                Sin Evidencia
            </div>
        `;

        if (item.evidencia && item.evidencia.length > 0) {
            imagenesHTML = `
                <div style="display:flex; flex-wrap:wrap; gap:5px; max-width:110px;">
                    ${item.evidencia.map(img => `
                        <img src="${img}" style="width: 48px; height: 36px; object-fit: cover; border: 1px solid #ccc; border-radius: 4px;">
                    `).join('')}
                </div>
            `;
        }

        detalleCompletoHTML += `
            <div style="margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 10px; page-break-inside: avoid; break-inside: avoid;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <span style="font-size: 11px; font-weight: bold; color: #333;">${item.titulo}</span>
                    <span style="font-size: 10px; font-weight: bold; color: ${statusColor}; border: 1px solid ${statusColor}; padding: 2px 6px; border-radius: 3px;">${statusText}</span>
                </div>
                <div style="display: flex; gap: 15px;">
                    ${imagenesHTML}
                    <div style="font-size: 10px; color: #555; flex: 1;">
                        <p style="margin: 2px 0;"><b>Responsable:</b> ${item.responsable || 'No asignado'}</p>
                        <p style="margin: 2px 0;"><b>Notas:</b> ${item.nota || 'Sin comentarios adicionales.'}</p>
                    </div>
                </div>
            </div>
        `;
    }

    temp.innerHTML = `<div style="padding:30px;">${detalleCompletoHTML}</div>`;

    html2pdf().from(temp).save();
};

window.onload = cargarHistorial;
</script>

</body>
</html>
