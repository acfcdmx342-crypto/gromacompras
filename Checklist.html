<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Sucursales - Reporte IT</title>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        :root {
            --primary: #003366;
            --secondary: #f4f7f6;
            --accent: #27ae60;
            --danger: #e74c3c;
            --border: #d1d8e0;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--secondary); margin: 0; color: #333; }
        .container { max-width: 850px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        
        .section { display: none; padding: 30px; animation: fadeIn 0.4s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; }
        .logo-placeholder { width: 140px; height: 50px; border: 1px dashed #ccc; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: var(--primary); }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 15px; transition: border 0.3s; }
        select:focus, input:focus { border-color: var(--primary); outline: none; }

        .rubro-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 15px; page-break-inside: avoid; }
        .rubro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .rubro-title { font-weight: bold; font-size: 15px; color: #2c3e50; }
        
        .status-badge { display: flex; gap: 8px; }
        .status-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; background: #fdfdfd; color: #7f8c8d; }
        .status-btn.selected-cumple { background: var(--accent) !important; color: white !important; border-color: var(--accent); }
        .status-btn.selected-nocumple { background: var(--danger) !important; color: white !important; border-color: var(--danger); }

        .rubro-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
        .img-preview { max-width: 150px; margin-top: 10px; border-radius: 5px; border: 1px solid #ddd; display: none; }

        .sig-container { border: 1px solid var(--border); background: #fafafa; margin-top: 5px; border-radius: 4px; }
        canvas { width: 100%; height: 120px; touch-action: none; }

        .btn { padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; transition: opacity 0.3s; }
        .btn-next { background: var(--primary); color: white; }
        .btn-save { background: #2ecc71; color: white; margin-top: 25px; }
        .btn-clear { background: #f1f2f6; color: #57606f; font-size: 11px; padding: 4px 10px; width: auto; border: 1px solid #ced4da; margin-top: 5px; }
        .btn:hover { opacity: 0.9; }

        .score-display { text-align: center; margin: 20px 0; }
        .score-circle { font-size: 48px; font-weight: 800; color: var(--accent); }

        @media print {
            body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .container { box-shadow: none; width: 100%; padding: 0; margin: 0; }
            .section { display: block !important; padding: 10px 0; border: none; page-break-inside: auto; }
            #sec1, .btn, .btn-clear, .logo-placeholder, input[type="file"] { display: none !important; }
            
            .status-btn:not(.selected-cumple):not(.selected-nocumple) { display: none !important; }
            .status-btn { 
                border: 2px solid black !important; 
                color: black !important; 
                font-weight: bold !important; 
                text-transform: uppercase;
                background: transparent !important;
                padding: 4px 8px !important;
            }
            
            header { border-bottom: 2px solid #333; margin-bottom: 15px; }
            .rubro-card { border: none; border-bottom: 1px solid #eee; padding: 10px 0; margin-bottom: 5px; }
            .rubro-title { font-size: 13px; color: black; }
            .img-preview { display: block !important; max-width: 200px; }
            
            label { font-size: 11px; color: #000; font-weight: bold; }
            input, select, textarea { border: none !important; font-size: 12px; padding: 0; color: black !important; }
            .sig-container { border: 1px solid #000; height: 100px; }
        }
    </style>
</head>
<body>

<div class="container">
    <section id="sec1" class="section active">
        <header>
            <div class="logo-placeholder">LOGOTIPO EMPRESA</div>
            <h2>Evaluación Inicial de Sucursal</h2>
        </header>
        <div class="form-group">
            <label>Fecha y Hora del Reporte</label>
            <input type="text" id="fecha_inicio" readonly>
        </div>
        <div class="form-group">
            <label>Empresa</label>
            <select id="selEmpresa" onchange="cargarZonas()">
                <option value="">Cargando empresas...</option>
            </select>
        </div>
        <div class="form-group">
            <label>Zona</label>
            <select id="selZona" onchange="cargarSucursales()" disabled>
                <option value="">Seleccione Zona...</option>
            </select>
        </div>
        <div class="form-group">
            <label>Sucursal</label>
            <select id="selSucursal" disabled>
                <option value="">Seleccione Sucursal...</option>
            </select>
        </div>
        <button class="btn btn-next" onclick="validarSiguiente(1, 2)">Iniciar Evaluación</button>
    </section>

    <div id="dynamic-sections"></div>

    <section id="sec-final" class="section">
        <header><h2>Cierre y Firmas</h2></header>
        
        <div class="score-display">
            <label>Cumplimiento General</label>
            <div class="score-circle" id="final-score">0%</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Folio de Soporte (Obligatorio)</label>
                <input type="text" id="folio_soporte" placeholder="Ej. TK-2026-001">
            </div>
            <div class="form-group">
                <label>Fecha Tentativa Solución (Obligatorio)</label>
                <input type="date" id="fecha_solucion">
            </div>
        </div>

        <div class="form-group">
            <label>Hallazgos / Observaciones del Encargado</label>
            <textarea id="obs_encargado" rows="3" placeholder="Detalle cualquier incidencia relevante..."></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            <div class="form-group">
                <label>Firma Encargado de Sucursal</label>
                <div class="sig-container"><canvas id="pad-encargado"></canvas></div>
                <button class="btn-clear" onclick="sigEncargado.clear()">Borrar Firma</button>
            </div>
            <div class="form-group">
                <label>Firma Técnico de Sistemas</label>
                <div class="sig-container"><canvas id="pad-sistemas"></canvas></div>
                <button class="btn-clear" onclick="sigSistemas.clear()">Borrar Firma</button>
            </div>
        </div>

        <button class="btn btn-save" onclick="finalizarReporte()">FINALIZAR Y GENERAR REPORTE PDF</button>
    </section>
</div>

<script>
    let catalogoReal = [];
    let evaluaciones = {};
    let sigEncargado, sigSistemas;

    const rubrosPorSeccion = [
        { titulo: "1- Sistema Punto de Venta", items: ["Personal Capacitado", "TPV Limpia", "Impresora Funcional", "Terminales Bancarias", "No Break", "Cables Organizados", "XStore", "Comex TV", "Línea Telmex", "WhatsApp Empresas", "Módem Configurado", "Instalación Eléctrica", "IP Estática", "Marcadores de Navegador"] },
        { titulo: "2- Color Center (PC)", items: ["CPU Libre de Polvo", "Periféricos Limpios", "Protección de Voltaje", "Organización de Cables", "Impresora de Etiquetas", "Archivo Host OK", "Software Licenciado", "USB Restringidos", "Base de Datos OK", "Actualizaciones Windows", "Respaldos Locales", "Monitor Funcional"] },
        { titulo: "3- Maquinaria (Dosificadora)", items: ["Humedad de Esponja", "Limpieza de Boquillas", "Válvulas Check", "Contenedores Limpios", "Motores de Agitación", "Cableado Protegido"] },
        { titulo: "4- Maquinaria (Revolvedora)", items: ["Estado de Cortina", "Engranajes Lubricados", "Estado de Maneral", "Baleros y Bandas", "Limpieza General"] },
        { titulo: "5- Seguridad (CCTV)", items: ["Grabación Continua", "Cámaras Alineadas", "DVR en Resguardo", "UPS de Respaldo", "Audio Operativo"] }
    ];

    window.onload = async () => {
        document.getElementById('fecha_inicio').value = new Date().toLocaleString();
        await cargarBaseDatos();
        generarSecciones();
        sigEncargado = new SignaturePad(document.getElementById('pad-encargado'));
        sigSistemas = new SignaturePad(document.getElementById('pad-sistemas'));
    };

    async function cargarBaseDatos() {
        try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
            const { getDatabase, ref, get } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js");
            const config = { databaseURL: "https://mydbu-fbc33-default-rtdb.firebaseio.com/" };
            const app = initializeApp(config);
            const db = getDatabase(app);
            const snap = await get(ref(db, 'sucursales'));
            if(snap.exists()) {
                catalogoReal = Object.values(snap.val()).map(i => ({
                    empresa: i.empresa.toUpperCase(),
                    zona: i.zona.toUpperCase(),
                    nombre: i.nombre.toUpperCase()
                }));
                const sel = document.getElementById('selEmpresa');
                sel.innerHTML = '<option value="">Seleccione Empresa...</option>';
                [...new Set(catalogoReal.map(c => c.empresa))].sort().forEach(e => sel.add(new Option(e, e)));
            }
        } catch (e) { alert("Error de conexión con la base de datos."); }
    }

    function cargarZonas() {
        const emp = document.getElementById('selEmpresa').value;
        const selZ = document.getElementById('selZona');
        selZ.innerHTML = '<option value="">Seleccione Zona...</option>';
        selZ.disabled = !emp;
        if(emp) [...new Set(catalogoReal.filter(c => c.empresa === emp).map(c => c.zona))].sort().forEach(z => selZ.add(new Option(z, z)));
    }

    function cargarSucursales() {
        const zona = document.getElementById('selZona').value;
        const selS = document.getElementById('selSucursal');
        selS.innerHTML = '<option value="">Seleccione Sucursal...</option>';
        selS.disabled = !zona;
        if(zona) catalogoReal.filter(c => c.zona === zona).sort((a,b) => a.nombre.localeCompare(b.nombre)).forEach(s => selS.add(new Option(s.nombre, s.nombre)));
    }

    function generarSecciones() {
        const container = document.getElementById('dynamic-sections');
        rubrosPorSeccion.forEach((sec, idx) => {
            const num = idx + 2;
            const s = document.createElement('section');
            s.id = `sec${num}`;
            s.className = 'section';
            let html = `<header><h2>${sec.titulo}</h2></header>`;
            sec.items.forEach((item, i) => {
                const id = `r_${num}_${i}`;
                evaluaciones[id] = { titulo: item, cumple: null, responsable: 'Tienda' };
                html += `
                <div class="rubro-card">
                    <div class="rubro-header">
                        <span class="rubro-title">${item}</span>
                        <div class="status-badge">
                            <div class="status-btn" id="c_${id}" onclick="updateStatus('${id}', true, this)">Cumple</div>
                            <div class="status-btn" id="n_${id}" onclick="updateStatus('${id}', false, this)">No Cumple</div>
                        </div>
                    </div>
                    <div class="rubro-footer">
                        <div><label>Resp.</label><select onchange="evaluaciones['${id}'].responsable=this.value"><option>Tienda</option><option>Soporte</option><option>Supervisor</option></select></div>
                        <div><label>Evidencia</label><input type="file" accept="image/*" onchange="previewImg(this, 'img_${id}')">
                        <img id="img_${id}" class="img-preview"></div>
                    </div>
                </div>`;
            });
            html += `<button class="btn btn-next" onclick="validarSiguiente(${num}, ${num + 1})">${idx === 4 ? 'Finalizar Evaluación' : 'Continuar'}</button>`;
            s.innerHTML = html;
            container.appendChild(s);
        });
    }

    function previewImg(input, imgId) {
        const reader = new FileReader();
        reader.onload = (e) => { 
            const img = document.getElementById(imgId);
            img.src = e.target.result;
            img.style.display = 'block';
        };
        if(input.files[0]) reader.readAsDataURL(input.files[0]);
    }

    function updateStatus(id, val, btn) {
        evaluaciones[id].cumple = val;
        btn.parentElement.querySelectorAll('.status-btn').forEach(b => b.classList.remove('selected-cumple', 'selected-nocumple'));
        btn.classList.add(val ? 'selected-cumple' : 'selected-nocumple');
    }

    function validarSiguiente(actual, sig) {
        if(actual === 1 && !document.getElementById('selSucursal').value) return alert("Seleccione sucursal");
        if(sig > 6) {
            calcularYMostrarResumen();
        } else {
            document.getElementById(`sec${actual}`).classList.remove('active');
            document.getElementById(`sec${sig}`).classList.add('active');
            window.scrollTo(0,0);
        }
    }

    function calcularYMostrarResumen() {
        let total = Object.keys(evaluaciones).length, si = 0;
        for(let k in evaluaciones) if(evaluaciones[k].cumple === true) si++;
        document.getElementById('final-score').innerText = Math.round((si/total)*100) + '%';
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('sec-final').classList.add('active');
    }

    function finalizarReporte() {
        const folio = document.getElementById('folio_soporte').value.trim();
        const fecha = document.getElementById('fecha_solucion').value;

        if(!folio) return alert("Por favor, ingrese el Folio de Soporte.");
        if(!fecha) return alert("Por favor, seleccione la Fecha Tentativa de Solución.");
        if(sigEncargado.isEmpty() || sigSistemas.isEmpty()) return alert("Ambas firmas son obligatorias para el reporte.");

        if(confirm("¿Confirmas que toda la información es correcta? Se generará el PDF.")) {
            window.print();
        }
    }
</script>
</body>
</html>
