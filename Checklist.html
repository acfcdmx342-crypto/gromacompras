<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Sucursales - Reporte IT</title>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --primary: #003366;
            --secondary: #f4f7f6;
            --accent: #27ae60;
            --danger: #e74c3c;
            --border: #d1d8e0;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--secondary); margin: 0; color: #333; }
        .container { max-width: 850px; margin: 0 auto; background: white; min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        
        .section { display: none; padding: 30px; animation: fadeIn 0.4s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        header { text-align: center; border-bottom: 3px solid var(--primary); padding-bottom: 15px; margin-bottom: 25px; }
        .logo-container { width: 200px; margin: 0 auto 15px; display: block; }
        .logo-container img { width: 100%; height: auto; display: block; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: var(--primary); }
        select, input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 15px; transition: border 0.3s; }

        .rubro-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 15px; page-break-inside: avoid; border-left: 5px solid var(--primary); }
        .rubro-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .rubro-title { font-weight: bold; font-size: 15px; color: #2c3e50; }
        
        .status-badge { display: flex; gap: 8px; }
        .status-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; background: #fdfdfd; color: #7f8c8d; }
        .status-btn.selected-cumple { background: var(--accent) !important; color: white !important; border-color: var(--accent); }
        .status-btn.selected-nocumple { background: var(--danger) !important; color: white !important; border-color: var(--danger); }

        /* Estilos para etiquetas de estado en el PDF */
        .status-pdf { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-align: center; text-transform: uppercase; }
        .status-pdf.cumple { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-pdf.nocumple { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .rubro-footer { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
        .img-preview { max-width: 150px; margin-top: 10px; border-radius: 5px; border: 1px solid #ddd; display: none; }

        .sig-container { border: 1px solid var(--border); background: #fafafa; margin-top: 5px; border-radius: 4px; }
        canvas { width: 100%; height: 120px; touch-action: none; }

        .btn-container { display: flex; gap: 10px; margin-top: 20px; }
        .btn { padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; transition: opacity 0.3s; }
        .btn-next { background: var(--primary); color: white; }
        .btn-back { background: #95a5a6; color: white; }
        .btn-pdf { background: #34495e; color: white; margin-top: 10px;}
        .btn-save { background: #2ecc71; color: white; margin-top: 10px;}
        .btn-clear { background: #f1f2f6; color: #57606f; font-size: 11px; padding: 4px 10px; width: auto; border: 1px solid #ced4da; margin-top: 5px; }

        #detalle-incumplimiento { margin-top: 20px; padding: 15px; border: 1px dashed var(--danger); border-radius: 8px; background: #fff5f5; display: none; }
        .item-error { color: var(--danger); font-weight: bold; font-size: 14px; margin-bottom: 5px; display: list-item; margin-left: 20px; }

        /* Estilos para ocultar en PDF */
        .no-pdf { display: none !important; }

        @media print {
            .section { display: block !important; margin-bottom: 20px; }
            .btn, .btn-clear, .btn-container, input[type="file"] { display: none !important; }
            #detalle-incumplimiento { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container" id="reporte-total">
    <section id="sec1" class="section active">
        <header>
            <div class="logo-container">
                <img src="https://i.ytimg.com/vi/GQ2mlLhIck8/mqdefault.jpg" alt="Logo Empresa">
            </div>
            <h2>Check List Sucursales</h2>
        </header>
        <div class="form-group">
            <label>Fecha y Hora del Reporte</label>
            <input type="text" id="fecha_inicio" readonly>
        </div>
        <div class="form-group">
            <label>Empresa</label>
            <select id="selEmpresa" onchange="cambioEmpresa()">
                <option value="">Cargando empresas...</option>
            </select>
        </div>
        <div class="form-group">
            <label>Zona</label>
            <select id="selZona" onchange="cargarSucursales()" disabled>
                <option value="">Seleccione Zona...</option>
            </select>
        </div>
        <div class="form-group">
            <label>Sucursal</label>
            <select id="selSucursal" disabled>
                <option value="">Seleccione Sucursal...</option>
            </select>
        </div>
        <button class="btn btn-next" onclick="validarSiguiente(1, 2)">Iniciar Evaluación</button>
    </section>

    <div id="dynamic-sections"></div>

    <section id="sec-final" class="section">
        <header>
            <div class="logo-container">
                <img src="https://i.ytimg.com/vi/GQ2mlLhIck8/mqdefault.jpg" alt="Logo Empresa">
            </div>
            <h2>Cierre y Firmas</h2>
        </header>
        
        <div class="score-display" style="text-align: center; margin-bottom: 20px;">
            <label>Cumplimiento General</label>
            <div class="score-circle" id="final-score" style="font-size: 48px; font-weight: 800; color: var(--accent);">0%</div>
        </div>

        <div id="detalle-incumplimiento">
            <h3 style="color: var(--danger); margin-top: 0;">Puntos que NO CUMPLEN:</h3>
            <div id="lista-errores"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
            <div class="form-group">
                <label>Folio de Soporte</label>
                <input type="text" id="folio_soporte" placeholder="Ej. TK-2026-001">
            </div>
            <div class="form-group">
                <label>Fecha Tentativa Solución</label>
                <input type="date" id="fecha_solucion">
            </div>
        </div>
        <div class="form-group">
            <label>Hallazgos / Observaciones</label>
            <textarea id="obs_encargado" rows="3"></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Firma Encargado de Sucursal</label>
                <div class="sig-container"><canvas id="pad-encargado"></canvas></div>
                <button class="btn-clear" onclick="sigEncargado.clear()">Borrar Firma</button>
            </div>
            <div class="form-group">
                <label>Firma Técnico de Sistemas</label>
                <div class="sig-container"><canvas id="pad-sistemas"></canvas></div>
                <button class="btn-clear" onclick="sigSistemas.clear()">Borrar Firma</button>
            </div>
        </div>
        
        <div class="btn-container">
            <button class="btn btn-back" id="btn-back-final">Regresar</button>
            <button class="btn btn-pdf" onclick="generarPDF()">1. GENERAR REPORTE (PDF)</button>
        </div>
        <button class="btn btn-save" onclick="finalizarYRedirigir()">2. GUARDAR EN HISTORIAL Y SALIR</button>
    </section>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://mydbu-fbc33-default-rtdb.firebaseio.com/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let catalogoReal = [];
    let evaluaciones = {};
    window.sigEncargado = null;
    window.sigSistemas = null;

    const rubrosComex = [
        { titulo: "1- Sistema Punto de Venta", items: ["Personal Capacitado para Levantar Soporte", "TPV Limpia", "Impresora Limpia y Funcional", "Terminales Bancarias Funcionando", "NoBreak Funcionando", "Cables Organizados | Ocultos", "XStore Correctos", "Comex TV Configurada y Limpia", "Línea Telmex Funcionando", "MC con WhatsApp Empresas", "Módem Configurado", "Instalación Eléctrica Correcta","IP Limpio y Funcionando","Paginas del grupo añadidas"] },
        { titulo: "2- Color Center (PC)", items: ["CPU Libre de Polvo","Nomenclatura Correcta", "Periféricos Limpios", "NoBreak Funcionando", "Cables Organizados", "Impresora de Etiquetas Funcionando", "Archivo Host Actualizado", "Sin Archivos ni Software No Autorizados", "Puertos USB Restringidos", "Base de Datos Actualizada", "Actualizaciones de Windows", "Respaldos Formula de Clientes", "Monitor en Buenas Condiciones"] },
        { titulo: "3- Maquinaria (Dosificadora)", items: ["Esponja Humectada", "Centro de Boquillas Limpio", "Válvulas Check en Buen Estado", "Contenedores Limpios", "Motores de Agitación Lubricados", "Tarjetas electronicas en Buen Estado","UPS Funcionando","Cableado Organizado","Equipo Limpio"] },
        { titulo: "4- Maquinaria (Revolvedora)", items: ["Cortina en Buen Estado", "Tornillo Sin Fin Lubricado", "Maneral en Buen Estado", "Baleros y Bandas en Buen Estado", "UPS Funcionando","Equipo Limpio"] },
        { titulo: "5- Seguridad (CCTV)", items: ["Grabaciónes en DVR", "Cámaras Funcionando", "DVR Oculto", "UPS Funcionando", "Audio Funcionando","Cableado Oculto"] },
        { titulo: "6- Activo Fijo", items: ["CPU Color Center Registrado", "Dosificadora Registrada", "Revolvedora Registrada", "Mini Revolvedora", "Impresora Dymo | HPRT Registrada","Impresora Laser Registrada","IP Registrado","DVR Registrado"] }
    ];

    const rubrosFerreprecios = [
        { 
            titulo: "1- Sistema Punto de Venta y Conexiones de internet / Comunicación", 
            items: [
                "Personal Capacitado para levantar soportes", 
                "Equipos Limpios", 
                { titulo: "Equipos con nomenclatura", type: "nomenclatura" },
                "equipos con Antivirus",
                "Impresora laser \"facturas\" Limpia y Funcional",
                "Impresora de ticket limpia y Funcional",
                "Impresora de etiquetas \"BarTender\" limpia y Funcional",
                "Scanner limpios y funcionando",
                "Terminales Bancarias Funcionando",
                "NoBreak Funcionando",
                "Cables Organizados | Ocultos",
                "Línea Telmex Funcionando",
                "Modem Perosnalizado",
                "Ip Funcionando",
                "Paginas del grupo añadidas"
            ] 
        },
        { 
            titulo: "2- sistemas de Seguridad CCTV", 
            items: ["DVR Oculto y libre de polvo", "Cámaras con visualización correcta", "grabaciones en DVR", "Cableado Oculto", "UPS Funcionando", "Audio Funcionando"] 
        },
        { 
            titulo: "3- activo fijo", 
            items: ["Equipos de Computo Registrados", "Tabletas Registradas", "Impresoras Registradas", "DVR Registrado", "Ip Registrado"] 
        }
    ];

    window.onload = async () => {
        document.getElementById('fecha_inicio').value = new Date().toLocaleString();
        await cargarBaseDatos();
        window.sigEncargado = new SignaturePad(document.getElementById('pad-encargado'));
        window.sigSistemas = new SignaturePad(document.getElementById('pad-sistemas'));
    };

    async function cargarBaseDatos() {
        try {
            const snap = await get(ref(db, 'sucursales'));
            if(snap.exists()) {
                catalogoReal = Object.values(snap.val()).map(i => ({
                    empresa: String(i.empresa).toUpperCase(),
                    zona: String(i.zona).toUpperCase(),
                    nombre: String(i.nombre).toUpperCase()
                }));
                const sel = document.getElementById('selEmpresa');
                sel.innerHTML = '<option value="">Seleccione Empresa...</option>';
                [...new Set(catalogoReal.map(c => c.empresa))].sort().forEach(e => sel.add(new Option(e, e)));
            }
        } catch (e) { alert("Error de conexión con Firebase"); }
    }

    window.cambioEmpresa = function() {
        const emp = document.getElementById('selEmpresa').value;
        const selZ = document.getElementById('selZona');
        const selS = document.getElementById('selSucursal');
        selZ.innerHTML = '<option value="">Seleccione Zona...</option>';
        selS.innerHTML = '<option value="">Seleccione Sucursal...</option>';
        selS.disabled = true;
        if(emp) {
            selZ.disabled = false;
            [...new Set(catalogoReal.filter(c => c.empresa === emp).map(c => c.zona))].sort().forEach(z => selZ.add(new Option(z, z)));
            generarSecciones();
        } else {
            selZ.disabled = true;
        }
    };

    window.cargarSucursales = function() {
        const emp = document.getElementById('selEmpresa').value;
        const zona = document.getElementById('selZona').value;
        const selS = document.getElementById('selSucursal');
        selS.innerHTML = '<option value="">Seleccione Sucursal...</option>';
        if(zona) {
            selS.disabled = false;
            catalogoReal.filter(c => c.empresa === emp && c.zona === zona).sort((a,b) => a.nombre.localeCompare(b.nombre)).forEach(s => selS.add(new Option(s.nombre, s.nombre)));
        } else {
            selS.disabled = true;
        }
    };

    function generarSecciones() {
        const container = document.getElementById('dynamic-sections');
        container.innerHTML = ""; 
        evaluaciones = {}; 
        
        const empresaSel = document.getElementById('selEmpresa').value;
        const rubrosUsar = (empresaSel === "FERREPRECIOS") ? rubrosFerreprecios : rubrosComex;

        rubrosUsar.forEach((sec, idx) => {
            const num = idx + 2;
            const s = document.createElement('section');
            s.id = `sec${num}`;
            s.className = 'section';
            
            let html = `
                <header>
                    <div class="logo-container">
                        <img src="https://i.ytimg.com/vi/GQ2mlLhIck8/mqdefault.jpg" alt="Logo Empresa">
                    </div>
                    <h2>${sec.titulo}</h2>
                </header>`;
            
            sec.items.forEach((item, i) => {
                const itemTitle = typeof item === 'string' ? item : item.titulo;
                const id = `r_${num}_${i}`;
                evaluaciones[id] = { titulo: itemTitle, cumple: null, responsable: 'Tienda' };
                
                html += `
                <div class="rubro-card">
                    <div class="rubro-header">
                        <span class="rubro-title">${itemTitle}</span>
                        <div class="status-badge">
                            <div class="status-btn" id="c_${id}" onclick="updateStatus('${id}', true, this)">Cumple</div>
                            <div class="status-btn" id="n_${id}" onclick="updateStatus('${id}', false, this)">No Cumple</div>
                        </div>
                    </div>`;

                if (item.type === "nomenclatura") {
                    html += `
                    <div class="form-group" style="margin-top:10px;">
                        <label>Número de equipos:</label>
                        <input type="number" placeholder="Cant." onchange="evaluaciones['${id}'].cantEquipos=this.value">
                        <textarea placeholder="Detalle de nomenclatura..." onchange="evaluaciones['${id}'].detalle=this.value" style="margin-top:5px;"></textarea>
                    </div>`;
                }

                html += `
                    <div class="rubro-footer">
                        <div><label>Resp.</label><select onchange="evaluaciones['${id}'].responsable=this.value"><option>Tienda</option><option>Soporte</option><option>Supervisor</option></select></div>
                        <div><label>Evidencia</label><input type="file" accept="image/*" onchange="window.previewImg(this, 'img_${id}')">
                        <img id="img_${id}" class="img-preview"></div>
                    </div>
                </div>`;
            });
            
            const esUltima = idx === rubrosUsar.length - 1;
            html += `
                <div class="btn-container">
                    <button class="btn btn-back" onclick="validarSiguiente(${num}, ${num - 1})">Regresar</button>
                    <button class="btn btn-next" onclick="validarSiguiente(${num}, ${num + 1})">${esUltima ? 'Finalizar Evaluación' : 'Continuar'}</button>
                </div>`;
            s.innerHTML = html;
            container.appendChild(s);

            if(esUltima) {
                document.getElementById('btn-back-final').onclick = () => validarSiguiente('final', num);
            }
        });
    }

    window.previewImg = function(input, imgId) {
        const reader = new FileReader();
        reader.onload = (e) => { 
            const img = document.getElementById(imgId);
            img.src = e.target.result;
            img.style.display = 'block';
            const id = imgId.replace('img_', '');
            evaluaciones[id].evidencia = e.target.result;
        };
        if(input.files[0]) reader.readAsDataURL(input.files[0]);
    };

    window.updateStatus = function(id, val, btn) {
        evaluaciones[id].cumple = val;
        btn.parentElement.querySelectorAll('.status-btn').forEach(b => b.classList.remove('selected-cumple', 'selected-nocumple'));
        btn.classList.add(val ? 'selected-cumple' : 'selected-nocumple');
    };

    window.validarSiguiente = function(actual, sig) {
        if(sig > actual && actual === 1 && !document.getElementById('selSucursal').value) return alert("Seleccione sucursal");
        
        const empresaSel = document.getElementById('selEmpresa').value;
        const limite = (empresaSel === "FERREPRECIOS") ? rubrosFerreprecios.length + 1 : rubrosComex.length + 1;

        if(sig > limite) {
            calcularYMostrarResumen();
        } else {
            const idActual = actual === 'final' ? 'sec-final' : `sec${actual}`;
            document.getElementById(idActual).classList.remove('active');
            document.getElementById(`sec${sig}`).classList.add('active');
            window.scrollTo(0,0);
        }
    };

    function calcularYMostrarResumen() {
        let total = Object.keys(evaluaciones).length, si = 0;
        let erroresHTML = "";
        
        for(let k in evaluaciones) {
            if(evaluaciones[k].cumple === true) {
                si++;
            } else if (evaluaciones[k].cumple === false) {
                erroresHTML += `<div class="item-error">${evaluaciones[k].titulo}</div>`;
            }
        }

        const divDetalle = document.getElementById('detalle-incumplimiento');
        const listaErrores = document.getElementById('lista-errores');
        if(erroresHTML !== "") {
            listaErrores.innerHTML = erroresHTML;
            divDetalle.style.display = "block";
        } else {
            divDetalle.style.display = "none";
        }

        document.getElementById('final-score').innerText = Math.round((si/total)*100) + '%';
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('sec-final').classList.add('active');
        window.scrollTo(0,0);
    }

    window.generarPDF = function() {
        if(window.sigEncargado.isEmpty() || window.sigSistemas.isEmpty()) {
            return alert("Faltan firmas obligatorias.");
        }

        const original = document.getElementById('reporte-total');
        const clon = original.cloneNode(true);
        
        // 1. Transformar diseño de tarjetas para el PDF
        clon.querySelectorAll('.section').forEach(s => {
            s.style.setProperty('display', 'block', 'important');
            s.style.setProperty('opacity', '1', 'important');
            s.style.setProperty('visibility', 'visible', 'important');
            s.style.padding = '20px';
        });

        // Convertir botones de estado en etiquetas de texto elegantes
        clon.querySelectorAll('.rubro-card').forEach(card => {
            const badgeContainer = card.querySelector('.status-badge');
            const btnCumple = card.querySelector('.selected-cumple');
            const btnNoCumple = card.querySelector('.selected-nocumple');

            let estadoText = "No Evaluado";
            let clase = "";
            
            if (btnCumple) { estadoText = "CUMPLE"; clase = "cumple"; }
            else if (btnNoCumple) { estadoText = "NO CUMPLE"; clase = "nocumple"; }

            if(badgeContainer) {
                badgeContainer.innerHTML = `<span class="status-pdf ${clase}">${estadoText}</span>`;
            }
        });

        // Asegurar que el detalle de incumplimiento se vea si tiene errores
        const listaErroresOriginal = document.getElementById('lista-errores');
        const detalleClon = clon.querySelector('#detalle-incumplimiento');
        if (listaErroresOriginal && listaErroresOriginal.innerHTML.trim() !== "") {
            detalleClon.style.setProperty('display', 'block', 'important');
        }

        // Eliminar botones y elementos innecesarios del clon
        clon.querySelectorAll('.btn, .btn-container, .btn-clear, input[type="file"], select').forEach(el => el.remove());

        // 2. Sincronizar firmas convirtiéndolas a imagen
        const canvasOriginal = [document.getElementById('pad-encargado'), document.getElementById('pad-sistemas')];
        const contenedoresFirmasClon = clon.querySelectorAll('.sig-container');

        canvasOriginal.forEach((canv, index) => {
            if (contenedoresFirmasClon[index]) {
                const dataUrl = canv.toDataURL("image/png");
                const imgFirma = document.createElement('img');
                imgFirma.src = dataUrl;
                imgFirma.style.width = '100%';
                imgFirma.style.height = 'auto';
                contenedoresFirmasClon[index].innerHTML = ''; 
                contenedoresFirmasClon[index].appendChild(imgFirma); 
            }
        });

        // 3. Configuración del PDF
        const opt = {
            margin: [15, 15],
            filename: `Reporte_IT_${document.getElementById('selSucursal').value}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { 
                scale: 3, 
                useCORS: true, 
                letterRendering: true 
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(clon).save().catch(err => console.error(err));
    };

    window.finalizarYRedirigir = function() {
        const folio = document.getElementById('folio_soporte').value.trim();
        const fechaSol = document.getElementById('fecha_solucion').value;
        if(!folio || !fechaSol) return alert("Folio y Fecha son obligatorios.");
        if(window.sigEncargado.isEmpty() || window.sigSistemas.isEmpty()) return alert("Firmas obligatorias.");

        const nuevaVisita = {
            fecha: document.getElementById('fecha_inicio').value,
            empresa: document.getElementById('selEmpresa').value,
            zona: document.getElementById('selZona').value,
            sucursal: document.getElementById('selSucursal').value,
            folio: folio,
            cumplimiento: document.getElementById('final-score').innerText,
            fechaSolucion: fechaSol,
            observaciones: document.getElementById('obs_encargado').value,
            detalleEvaluacion: evaluaciones
        };

        push(ref(db, 'visitasIT'), nuevaVisita)
        .then(() => {
            alert("Evaluación Almacenada Correctamente");
            window.location.href = "visitas.html";
        })
        .catch(err => { alert("Error al guardar"); console.error(err); });
    };
</script>

<script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.onkeydown = e => {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };
</script>
